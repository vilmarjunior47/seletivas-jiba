<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seletivas JIBA</title>
<meta name="theme-color" content="#16324F">
<meta name="description" content="Organização de inscrições e seletivas do JIBA">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --azul-quadra: #16324F;
    --azul-quadra-escuro: #0E2338;
    --fundo: #F6F4EE;
    --texto: #23282B;
    --texto-suave: #5B6268;
    --verde-campo: #2E7D5B;
    --dourado: #C9A227;
    --cinza-inativo: #8A9099;
    --borda: #E4E0D6;
    --branco: #FFFFFF;
    --raio: 10px;
    --raio-grande: 14px;
    --sombra: 0 1px 3px rgba(14,35,56,0.08);
    --header-altura: 84px;
    /* Bloco 4 -- paleta conceitual do chaveamento (fase principal / repescagem / final) */
    --fase-principal: #2A5A8C;
    --fase-principal-bg: #EAF1F8;
    --fase-repescagem: #C1652B;
    --fase-repescagem-bg: #FBF1E7;
    --fase-final: #B4881A;
    --fase-final-bg: #FBF3DC;
    --cor-vitoria: #2E7D5B;
    --cor-vitoria-bg: #E3F2E9;
    --cor-derrota: #B23A3A;
    --cor-derrota-bg: #FBEAEA;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--fundo);
    color: var(--texto);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
    padding-top: var(--header-altura);
    padding-bottom: 24px;
  }

  h1,h2,h3,.marcador{
    font-family: 'Oswald', 'Inter', sans-serif;
    font-weight:600;
    letter-spacing: 0.2px;
    margin:0;
  }

  button{ font-family:inherit; cursor:pointer; }

  a{ color:inherit; text-decoration:none; }

  /* ---------- HEADER ---------- */
  .cabecalho{
    position:fixed; top:0; left:0; right:0; z-index:20;
    height: var(--header-altura);
    background: var(--azul-quadra);
    color: var(--branco);
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px;
  }
  .cabecalho .titulo-wrap{ display:flex; flex-direction:column; gap:2px; }
  .cabecalho .titulo{
    font-size: 21px; font-weight:700; display:flex; align-items:center; gap:8px;
  }
  .cabecalho .subtitulo{
    font-size: 12.5px; color: rgba(255,255,255,0.72); font-family:'Inter',sans-serif; font-weight:400;
  }
  .selo-ano{
    background: var(--dourado);
    color: var(--azul-quadra-escuro);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    white-space:nowrap;
  }
  .grupo-topo-direita{ display:flex; align-items:center; gap:10px; }
  .botao-home-cabecalho{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:50%;
    background: rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3);
    color:#fff; font-size:18px; flex-shrink:0;
  }
  .botao-home-cabecalho:active{ background: rgba(255,255,255,0.28); }

  /* ---------- LAYOUT ---------- */
  .conteudo{
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 16px 8px;
  }

  /* ---------- CARDS DE ESTATÍSTICA ---------- */
  .secao-titulo{
    font-size: 13px;
    text-transform: none;
    color: var(--texto-suave);
    margin: 4px 2px 10px;
    font-weight:600;
  }
  .grade-estatisticas{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .cartao-estatistica{
    background: var(--branco);
    border-radius: var(--raio);
    padding: 14px 14px;
    box-shadow: var(--sombra);
    border: 1px solid var(--borda);
  }
  .cartao-estatistica .valor{
    font-family:'Oswald',sans-serif;
    font-size: 30px;
    font-weight:700;
    color: var(--azul-quadra);
    line-height:1;
  }
  .cartao-estatistica .rotulo{
    font-size: 12.5px;
    color: var(--texto-suave);
    margin-top: 6px;
  }

  /* ---------- GRADE DE MÓDULOS ---------- */
  .grade-modulos{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .cartao-modulo{
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: var(--raio-grande);
    padding: 16px 12px;
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    min-height: 96px;
    box-shadow: var(--sombra);
    transition: transform .08s ease;
  }
  .cartao-modulo:active{ transform: scale(0.98); }
  .cartao-modulo .icone-modulo{ font-size: 24px; }
  .cartao-modulo .nome-modulo{ font-size: 14.5px; font-weight:600; }
  .cartao-modulo.desabilitado{
    opacity: 0.62;
  }
  .cartao-modulo .selo-em-breve{
    font-size: 10.5px;
    color: var(--cinza-inativo);
    background: #EFEDE6;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight:600;
  }

  /* Etapa 2B-1: Home simplificada -- cards primários grandes, secundários compactos */
  .grade-modulos-primaria{ margin-bottom: 22px; }
  .cartao-modulo-primario{
    min-height: 118px;
    padding: 20px 16px;
    justify-content:center;
  }
  .cartao-modulo-primario .icone-modulo{ font-size: 32px; }
  .cartao-modulo-primario .nome-modulo{ font-size: 15.5px; line-height:1.25; }
  .grade-modulos-secundaria{ grid-template-columns: repeat(2, 1fr); }
  .grade-modulos-secundaria .cartao-modulo{ min-height:78px; padding:12px 10px; gap:6px; }
  .grade-modulos-secundaria .icone-modulo{ font-size:20px; }
  .grade-modulos-secundaria .nome-modulo{ font-size:12px; }

  /* Etapa 2B-5: resumo simples do evento (ano dinâmico) + descrição dos cards primários */
  .resumo-evento-home{ text-align:center; padding: 6px 0 20px; }
  .titulo-evento-home{
    font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; color:var(--azul-quadra);
  }
  .subtitulo-evento-home{ font-size:13px; color:var(--texto-suave); margin-top:2px; }
  .faixa-series-home{ font-size:12.5px; color:var(--texto-suave); margin-top:8px; }
  .cartao-modulo-primario .descricao-modulo{
    font-size:11.5px; font-weight:400; color:var(--texto-suave); line-height:1.3;
  }

  /* ---------- TELA GENÉRICA / EM BREVE ---------- */
  .tela-em-breve{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding: 48px 20px;
    color: var(--texto-suave);
    gap: 10px;
  }
  .tela-em-breve .icone-grande{ font-size: 40px; opacity:0.5; }
  .tela-em-breve h2{ color: var(--texto); font-size:19px; }

  .botao-voltar{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:none; color: var(--azul-quadra);
    font-weight:600; font-size:14px; padding: 6px 0; margin-bottom: 6px;
  }

  /* ---------- CONFIGURAÇÕES ---------- */
  .bloco{
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: var(--raio-grande);
    padding: 16px;
    margin-bottom: 16px;
  }
  .bloco h3{ font-size: 16px; margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
  .campo{ margin-bottom: 12px; }
  .campo label{
    display:block; font-size:12.5px; color: var(--texto-suave); margin-bottom: 5px; font-weight:500;
  }
  .campo input, .campo select{
    width:100%;
    padding: 10px 12px;
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    font-size: 14.5px;
    font-family:inherit;
    background: var(--fundo);
    color: var(--texto);
  }
  .campo input:focus, .campo select:focus{
    outline: 2px solid var(--azul-quadra);
    outline-offset: 1px;
    background: var(--branco);
  }
  .linha-campos{ display:flex; gap:10px; }
  .linha-campos .campo{ flex:1; }

  .botao{
    padding: 10px 16px;
    border-radius: var(--raio);
    border:none;
    font-weight:600;
    font-size: 14px;
  }
  .botao-primario{ background: var(--azul-quadra); color:var(--branco); }
  .botao-primario:active{ background: var(--azul-quadra-escuro); }
  .botao-secundario{ background: var(--fundo); color: var(--azul-quadra); border:1px solid var(--borda); }
  .botao-texto{ background:none; color: var(--azul-quadra); font-weight:600; padding: 6px 4px; }
  .botao-perigo-texto{ background:none; color:#B23A3A; font-weight:600; padding:6px 4px; font-size:13px; }

  .linha-lista{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--borda);
    gap: 10px;
  }
  .linha-lista:last-child{ border-bottom:none; }
  .info-item{ display:flex; flex-direction:column; }
  .info-item .principal{ font-size:14.5px; font-weight:600; }
  .info-item .secundario{ font-size:12px; color:var(--texto-suave); }

  .selo-status{
    font-size: 11px; font-weight:600; padding: 3px 9px; border-radius:999px;
  }
  .selo-status.ativo{ background:#E3F2E9; color: var(--verde-campo); }
  .selo-status.inativo{ background:#F1EFE9; color: var(--cinza-inativo); }

  .acoes-linha{ display:flex; align-items:center; gap:12px; }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: var(--azul-quadra-escuro); color:#fff;
    padding: 10px 18px; border-radius: 999px; font-size: 13.5px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    opacity:0; pointer-events:none; transition: opacity .2s ease, transform .2s ease;
    z-index: 50;
  }
  .toast.mostrar{ opacity:1; }

  .item-menu-mais{
    display:flex; align-items:center; gap:12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--borda);
    font-size: 15px; font-weight:600;
  }
  .item-menu-mais .icone-modulo{ font-size:20px; width:26px; text-align:center; }
  .item-menu-mais.desabilitado{ color: var(--cinza-inativo); }
  .item-menu-mais .selo-em-breve{
    margin-left:auto; font-size: 10.5px; color: var(--cinza-inativo);
    background:#EFEDE6; padding:2px 8px; border-radius:999px; font-weight:600;
  }

  /* ---------- ALUNOS / INSCRIÇÕES (Bloco 2) ---------- */
  .campo-busca{
    display:flex; align-items:center; gap:8px;
    background: var(--branco); border:1px solid var(--borda); border-radius: var(--raio);
    padding: 10px 12px; margin-bottom: 14px;
  }
  .campo-busca input{
    border:none; outline:none; background:none; flex:1; font-size:14.5px; font-family:inherit; color: var(--texto);
  }

  .cartao-aluno{
    background: var(--branco); border:1px solid var(--borda); border-radius: var(--raio-grande);
    padding: 14px; margin-bottom: 10px;
  }
  .cartao-aluno .topo-aluno{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .cartao-aluno .nome-aluno{ font-size: 15.5px; font-weight:600; }
  .cartao-aluno .meta-aluno{ font-size:12.5px; color: var(--texto-suave); margin-top:2px; }
  .cartao-aluno .resumo-aluno{ font-size:12.5px; color: var(--verde-campo); font-weight:600; margin-top:4px; }
  .cartao-aluno .acoes-aluno{
    display:flex; gap: 14px; margin-top:10px; padding-top:10px; border-top:1px solid var(--borda);
  }
  .cartao-aluno .acoes-aluno button{
    background:none; border:none; color: var(--azul-quadra); font-weight:600; font-size:13.5px; padding:4px 0;
  }
  .cartao-aluno .acoes-aluno button.acao-excluir{ color:#B23A3A; margin-left:auto; }

  .selo-sexo{
    font-size: 11px; font-weight:600; padding: 3px 9px; border-radius: 999px;
    background:#EEF3F6; color: var(--azul-quadra); white-space:nowrap;
  }
  .seletor-sexo-cartao{
    font-size: 12px; font-weight:600; padding: 3px 22px 3px 9px; border-radius: 999px;
    background:#EEF3F6 url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 12 12%22><path fill=%22%230E2338%22 d=%22M2 4l4 4 4-4z%22/></svg>') no-repeat right 7px center;
    background-size: 9px; color: var(--azul-quadra); border:none; white-space:nowrap;
    font-family:inherit; -webkit-appearance:none; appearance:none; cursor:pointer; max-width:100%;
  }
  .seletor-sexo-cartao:disabled{ opacity:0.6; cursor:default; }

  .cabecalho-modalidades-aluno{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
    gap:8px 14px; margin-bottom:14px;
  }
  .acoes-marcar-todas{ display:flex; gap:14px; flex-wrap:wrap; }
  .acoes-marcar-todas .botao-texto{ font-size:13px; padding:4px 0; }

  .grupo-modalidades{ margin-bottom: 18px; }
  .grupo-modalidades h4{
    font-family:'Oswald',sans-serif; font-size:14.5px; font-weight:600; margin: 0 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .lista-checkbox-modalidade{ display:flex; flex-direction:column; gap:8px; }
  .item-checkbox-modalidade{
    display:flex; align-items:center; gap:12px;
    background: var(--branco); border:1px solid var(--borda); border-radius: var(--raio);
    padding: 13px 14px; font-size: 14.5px; font-weight:500;
  }
  .item-checkbox-modalidade input[type="checkbox"]{
    width: 22px; height: 22px; accent-color: var(--azul-quadra); flex-shrink:0;
  }
  .item-checkbox-modalidade.marcado{ border-color: var(--verde-campo); background:#F3FAF6; }

  .cartao-contador-modalidade{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--branco); border:1px solid var(--borda); border-radius: var(--raio);
    padding: 13px 14px; margin-bottom:8px; font-size:14.5px; font-weight:500;
  }
  .cartao-contador-modalidade .contagem{
    font-family:'Oswald',sans-serif; font-weight:600; color: var(--azul-quadra); font-size:14px;
  }

  .grade-resumo-turma{
    display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin-bottom:18px;
  }

  .aba-turma{
    display:flex; gap:6px; margin-bottom:16px; background:var(--branco);
    border:1px solid var(--borda); border-radius: 999px; padding:4px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .aba-turma button{
    flex:0 0 auto; border:none; background:none; padding:9px 14px; border-radius:999px;
    font-size:13px; font-weight:600; color: var(--texto-suave); white-space:nowrap;
  }
  .aba-turma button.ativa{ background: var(--azul-quadra); color:#fff; }

  /* ---------- SELETIVAS (Bloco 3) ---------- */
  .cartao-modalidade-seletiva{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--branco); border:1px solid var(--borda); border-radius: var(--raio-grande);
    padding: 14px 16px; margin-bottom:10px;
  }
  .cartao-modalidade-seletiva .nome-modalidade-sel{ font-size:15px; font-weight:600; }
  .cartao-modalidade-seletiva .contagem-sel{ font-size:12.5px; color: var(--texto-suave); margin-top:2px; }

  .selo-status-seletiva{
    font-size: 11.5px; font-weight:700; padding: 4px 10px; border-radius: 999px; white-space:nowrap;
  }
  .selo-pendente{ background:#F1EFE9; color: var(--cinza-inativo); }
  .selo-concluida{ background:#E3F2E9; color: var(--verde-campo); }

  select.select-status{
    padding: 9px 10px; border-radius: var(--raio); border:1px solid var(--borda);
    font-family:inherit; font-size:13.5px; background: var(--fundo); font-weight:600; color: var(--texto);
    width:100%;
  }
  select.select-status.st-classificado{ background:#E3F2E9; color: var(--verde-campo); border-color:#B9DEC7; }
  select.select-status.st-reserva{ background:#FBF3DC; color:#8A6B14; border-color:#EBD79B; }
  select.select-status.st-nao-classificado, select.select-status.st-desistiu{ background:#FBEAEA; color:#B23A3A; border-color:#EFC3C3; }
  select.select-status.st-nao-compareceu{ background:#EFEDE6; color: var(--cinza-inativo); }

  /* Bloco 1 -- operação simplificada da seletiva: 3 botões rápidos em
     vez do <select> técnico (ver comentário em ligarEventosSeletivaDetalhe). */
  .grupo-status-simples{ display:flex; gap:6px; flex-wrap:wrap; }
  .botao-status-simples{
    flex:1; min-width:88px; padding:9px 6px; border-radius: var(--raio); border:1px solid var(--borda);
    font-family:inherit; font-size:12.5px; font-weight:700; background: var(--fundo); color: var(--texto-suave);
    text-align:center; white-space:nowrap;
  }
  .botao-status-simples:disabled{ opacity:0.6; }
  .botao-status-simples.ativo.st-aguardando{ background:#EFEDE6; color: var(--cinza-inativo); border-color:#D9D5C9; }
  .botao-status-simples.ativo.st-passou{ background:#E3F2E9; color: var(--verde-campo); border-color:#B9DEC7; }
  .botao-status-simples.ativo.st-nao-passou{ background:#FBEAEA; color:#B23A3A; border-color:#EFC3C3; }

  .cartao-aluno-seletiva{
    background: var(--branco); border:1px solid var(--borda); border-radius: var(--raio-grande);
    padding: 14px; margin-bottom:10px;
  }
  .cartao-aluno-seletiva .topo-aluno-sel{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px;
  }
  .cartao-aluno-seletiva .nome-aluno-sel{ font-size:15px; font-weight:600; }
  .cartao-aluno-seletiva .turma-aluno-sel{ font-size:12px; color: var(--texto-suave); margin-top:2px; }
  .linha-rapida-sel{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .linha-rapida-sel label{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; }
  .linha-rapida-sel input[type="checkbox"]{ width:22px; height:22px; accent-color: var(--verde-campo); }
  .grade-campos-sel{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px; }
  .grade-campos-sel .campo{ margin-bottom:0; }
  .grade-campos-sel input{
    width:100%; padding:8px 10px; border:1px solid var(--borda); border-radius:var(--raio);
    font-family:inherit; font-size:13.5px; background: var(--fundo);
  }
  .botao-detalhes-sel{
    background:none; border:none; color: var(--azul-quadra); font-size:12.5px; font-weight:600;
    padding: 6px 0 0; width:100%; text-align:left;
  }

  .painel-filtros{
    background: var(--branco); border:1px solid var(--borda); border-radius: var(--raio-grande);
    padding: 14px; margin-bottom: 14px; display:none; flex-direction:column; gap:10px;
  }
  .painel-filtros.aberto{ display:flex; }
  .botao-filtros{
    display:flex; align-items:center; gap:6px; background: var(--branco); border:1px solid var(--borda);
    border-radius: 999px; padding: 8px 16px; font-size:13.5px; font-weight:600; color: var(--azul-quadra);
    margin-bottom: 12px;
  }

  .lista-numerada{ list-style:none; margin:0; padding:0; }
  .lista-numerada li{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--borda); font-size:14px;
  }
  .lista-numerada li:last-child{ border-bottom:none; }
  .lista-numerada .numero{
    width:22px; height:22px; border-radius:50%; background: var(--azul-quadra); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;
  }
  .lista-numerada.lista-reservas .numero{ background: var(--dourado); color: var(--azul-quadra-escuro); }

  .resumo-seletiva-turma-item{
    background: var(--branco); border:1px solid var(--borda); border-radius: var(--raio); padding:12px 14px; margin-bottom:8px;
  }
  .resumo-seletiva-turma-item .nome-mod{ font-weight:600; font-size:14px; margin-bottom:4px; }

  .linha-colocacao{
    display:flex; align-items:center; gap:10px; background:var(--branco); border:1px solid var(--borda);

  /* ---------- CHAVEAMENTOS (Bloco 7 + redesign visual do Bloco 4) ----------

  .cabecalho-chave{

  /* pipeline Principal -> Repescagem -> Final -> Campeão */
  .pipeline-chave{ display:flex; align-items:stretch; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px; }
  .etapa-pipeline{
    flex:1 1 0; min-width:118px; border-radius: var(--raio); padding:10px 12px; text-decoration:none;
    border:1.5px solid var(--borda); background: var(--branco); position:relative;
  }
  .etapa-pipeline .rotulo-etapa{ font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; opacity:0.85; }
  .etapa-pipeline .valor-etapa{ font-size:13px; font-weight:700; margin-top:4px; color:var(--texto); }
  .etapa-pipeline.ativa{ box-shadow: 0 0 0 2px currentColor inset; }
  .etapa-pipeline.principal{ border-color: var(--fase-principal); background: var(--fase-principal-bg); color: var(--fase-principal); }
  .etapa-pipeline.repescagem{ border-color: var(--fase-repescagem); background: var(--fase-repescagem-bg); color: var(--fase-repescagem); }

  .seta-pipeline{ display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--texto-suave); flex:0 0 auto; }

  .faixa-fase{
    display:flex; align-items:center; gap:8px; margin: 18px 0 10px; font-family:'Oswald',sans-serif;
    font-size:13px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
  }
  .faixa-fase .ponto-fase{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .faixa-fase.principal{ color: var(--fase-principal); }
  .faixa-fase.principal .ponto-fase{ background: var(--fase-principal); }
  .faixa-fase.repescagem{ color: var(--fase-repescagem); }
  .faixa-fase.repescagem .ponto-fase{ background: var(--fase-repescagem); }
  .faixa-fase.final{ color: var(--fase-final); }
  .faixa-fase.final .ponto-fase{ background: var(--fase-final); }
  .faixa-fase::after{ content:''; flex:1; height:1px; background: var(--borda); }

  .trilho-chave{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x proximity; }
  .cartao-fase{

  }
  @media (max-width: 720px){

    .cartao-fase{ width:auto; margin-bottom:6px; }

  .cartao-confronto-chave{

    padding: 14px; margin-bottom:12px; position:relative;
  }
  .rotulo-jogo{
    font-size:10.5px; font-weight:700; color:var(--texto-suave); letter-spacing:0.5px;
    text-transform:uppercase; margin-bottom:8px;
  }
  .cartao-confronto-chave.finalizado{ border-color: var(--cor-vitoria); background: linear-gradient(180deg, var(--cor-vitoria-bg) 0%, var(--branco) 55%); }
  .cartao-confronto-chave .lado-confronto{
    display:flex; align-items:center; justify-content:space-between; gap:8px;

  .cartao-confronto-chave .lado-confronto.perdedor{ color: var(--cor-derrota); background: var(--cor-derrota-bg); text-decoration: line-through; opacity:0.8; }

  .lado-confronto.perdedor .etiqueta-resultado-lado{ background: var(--cor-derrota); color:#fff; text-decoration:none; }
  .cartao-confronto-chave .x-confronto-chave{

  }

  .linha-participante-chave{

  .rotulo-falta input{ width:20px; height:20px; }

  .podio-chaveamento{
    text-align:center; background: linear-gradient(180deg, var(--fase-final-bg), var(--branco));
    border:1.5px solid var(--fase-final); border-radius: var(--raio-grande); padding:26px 16px; margin-bottom:16px;

  }
  .podio-vice{ text-align:center; margin-top:10px; font-size:14px; color:var(--texto-suave); }

  /* CONTROLE DA CHAVE (Bloco 3, reorganizado visualmente) */
  .grupo-controle-chave{ margin-bottom:14px; }
  .grupo-controle-chave h4{
    font-size:11px; font-weight:700; color:var(--texto-suave); letter-spacing:0.5px; text-transform:uppercase; margin:0 0 8px;

  .aviso-forte{

    padding:14px; margin-bottom:14px; font-size:13.5px;
  }

  /* ---------- FINAIS DO JIBA (Bloco 8) ---------- */
  .cartao-representante{

    padding:14px; margin-bottom:10px;

  /* ---------- Etapa 2B-6: Ficha de Seletiva + Chaveamento com família ---------- */

<body>

<div id="telaLogin" class="tela-login no-print" style="display:none;">
  <div class="cartao-login">
    <div class="login-evento">JIBA 2026</div>
    <div class="login-titulo">🏆 Seletivas JIBA</div>
    <div id="loginErro" class="login-erro" style="display:none;"></div>
    <div id="loginAvisoOffline" class="login-aviso-offline" style="display:none;">
      Não foi possível carregar o Supabase. Verifique sua conexão com a internet e recarregue a página.
    </div>
    <form id="formLogin">
      <div class="campo">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="campo" style="margin-bottom:18px;">
        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="botao botao-primario" id="btnEntrarLogin" style="width:100%;">Entrar</button>
    </form>
  </div>
</div>

<header class="cabecalho no-print" id="cabecalhoApp" style="display:none;">
  <div class="titulo-wrap">
    <div class="titulo">🏆 SELETIVAS JIBA</div>
    <div class="subtitulo">Organização de Inscrições e Seletivas</div>
  </div>
  <div class="grupo-topo-direita">
    <div class="selo-ano" id="seloAno">JIBA 2026</div>
    <button class="botao-home-cabecalho" onclick="location.hash='#/'" aria-label="Início" title="Início">🏠</button>
    <button class="botao-sair-cabecalho no-print" id="btnSairApp" title="Sair" aria-label="Sair">Sair</button>
  </div>
</header>

<main class="conteudo" id="app" role="main" style="display:none;"></main>

<div class="toast no-print" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   AUTENTICAÇÃO (Supabase Auth) — Migração Etapa 1
   ------------------------------------------------------------
   Aqui SOMENTE: cliente Supabase, login, logout, verificação de
   sessão e um teste de leitura em `series`. A camada DB abaixo
   continua 100% em localStorage — nada disso migra dados ainda.
============================================================ */
const SUPABASE_URL = 'https://ofydqodbsrjukcgxijkg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9i2jVj-ynrvSmY6X62w8lA_rlMrWoQT';

// Publishable key é segura para uso no frontend (é o equivalente à antiga
// "anon key" pública). NUNCA colocar aqui a Secret key, a service_role
// ou a senha do banco — nenhuma delas é necessária no cliente.
let supabaseClient = null;
try {
  if(window.supabase && typeof window.supabase.createClient === 'function'){
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  }
} catch(e){
  console.error('Não foi possível inicializar o cliente Supabase:', e);
}

function mostrarTelaLogin(){
  document.getElementById('telaLogin').style.display = 'flex';
  document.getElementById('cabecalhoApp').style.display = 'none';
  document.getElementById('app').style.display = 'none';
}

// Migração Etapa 2: antes de mostrar as telas, carrega (ou semeia, se vazio)
// as entidades que já vivem no Supabase -- ver DB.carregarDadosSupabase().
// Isso é assíncrono, então mostramos um aviso simples de carregamento e só
// chamamos renderizar() depois que os dados chegarem.
async function mostrarAplicacao(){
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('cabecalhoApp').style.display = '';
  document.getElementById('app').style.display = '';
  atualizarSeloAno();

  const app = document.getElementById('app');
  app.innerHTML = '<p style="padding:60px 20px; text-align:center; color:var(--texto-suave);">Carregando dados...</p>';

  try {
    await DB.carregarDadosSupabase();
    atualizarSeloAno();
    renderizar();
    testarConexaoSupabase();
  } catch(e){
    console.error('Erro ao carregar dados do Supabase:', e);
    app.innerHTML = `
      <div style="padding:60px 20px; text-align:center; color:var(--texto-suave);">
        <p>Não foi possível carregar os dados. Verifique sua conexão e tente novamente.</p>
        <button class="botao botao-primario" style="margin-top:14px;" onclick="mostrarAplicacao()">Tentar novamente</button>
      </div>
    `;
  }
}

// Teste de leitura, somente para confirmar a comunicação com o Supabase.
// Não insere, altera nem exclui nada — e não migra a camada DB.
async function testarConexaoSupabase(){
  if(!supabaseClient) return;
  try {
    const { error } = await supabaseClient.from('series').select('id').limit(1);
    if(error){
      console.error('Falha ao conectar ao Supabase:', error);
    } else {
      console.log('Supabase conectado com sucesso.');
    }
  } catch(e){
    console.error('Falha ao conectar ao Supabase:', e);
  }
}

async function verificarSessaoESeguir(){
  if(!supabaseClient){
    document.getElementById('loginAvisoOffline').style.display = 'block';
    mostrarTelaLogin();
    return;
  }
  try {
    const { data, error } = await supabaseClient.auth.getSession();
    if(error){ console.error('Erro ao verificar sessão:', error); }
    if(data && data.session){
      await mostrarAplicacao();
    } else {
      mostrarTelaLogin();
    }
  } catch(e){
    console.error('Erro ao verificar sessão:', e);
    mostrarTelaLogin();
  }
}

function ligarEventosLogin(){
  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const erroEl = document.getElementById('loginErro');
    erroEl.style.display = 'none';
    if(!supabaseClient){
      document.getElementById('loginAvisoOffline').style.display = 'block';
      return;
    }
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginSenha').value;
    const botao = document.getElementById('btnEntrarLogin');
    botao.disabled = true;
    botao.textContent = 'Entrando...';
    try {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
      if(error){
        erroEl.textContent = 'E-mail ou senha inválidos.';
        erroEl.style.display = 'block';
      } else {
        document.getElementById('loginSenha').value = '';
        await mostrarAplicacao();
      }
    } catch(e){
      console.error('Erro ao fazer login:', e);
      erroEl.textContent = 'Não foi possível entrar. Tente novamente.';
      erroEl.style.display = 'block';
    } finally {
      botao.disabled = false;
      botao.textContent = 'Entrar';
    }
  });

  document.getElementById('btnSairApp').addEventListener('click', async () => {
    if(!supabaseClient){ mostrarTelaLogin(); return; }
    try {
      await supabaseClient.auth.signOut();
    } catch(e){
      console.error('Erro ao sair:', e);
    }
    mostrarTelaLogin();
  });
}

/* ============================================================
   CAMADA DE DADOS (DB)
   ------------------------------------------------------------
   Bloco 1: guarda tudo em localStorage, com o MESMO formato de
   dados que será usado nas tabelas do Supabase (Bloco 2).
   Quando o Supabase for conectado, basta trocar os métodos
   internos por chamadas supabase.from('...').select()/insert()
   /update(), sem mudar as telas que os chamam.
   Ver arquivo supabase-schema.sql para o desenho das tabelas.
============================================================ */
const DB = (() => {
  /* ------------------------------------------------------------
     Migração Etapa 2 — quais entidades vêm de onde
     ------------------------------------------------------------
     SUPABASE (lidas via cache local, escritas via supabaseClient):
       config_evento, series, turnos, categorias, turmas,
       modalidades (+ modalidade_serie), alunos, inscricoes,
       seletivas, participacoes_seletiva.

     LOCALSTORAGE (inalterado, Blocos 4 a 10 continuam aqui):
       equipes, participacoes_equipe, jogos, config_pontuacao,
       resultados_modalidade, colocacoes_modalidade, desafios,
       pontuacoes_desafio, categorias_pontuacao, pontuacoes_categoria,
       ajustes_pontuacao, chaveamentos, participantes_chaveamento,
       confrontos_chaveamento, finais_jiba, participantes_final_jiba,
       confrontos_final_jiba.

     Estratégia: as entidades do Supabase são carregadas uma vez em
     memória (cache) logo após o login (DB.carregarDadosSupabase).
     As funções "getX" continuam SÍNCRONAS (leem o cache), então
     nenhum consumidor que só LÊ precisou mudar -- inclusive os
     módulos ainda em localStorage (equipes/jogos/chaveamentos/
     finais/pontuação), que continuam lendo séries/turmas/alunos/
     modalidades normalmente. Só as funções que ESCREVEM nessas 11
     entidades viraram async (aguardam a resposta do Supabase antes
     de atualizar o cache) -- os consumidores dessas foram ajustados
     para usar await.
  ------------------------------------------------------------ */
  let _cacheConfig = null;
  let _cacheSeries = [];
  let _cacheTurnos = [];
  let _cacheCategorias = [];
  let _cacheTurmas = [];
  let _cacheModalidades = [];
  let _cacheAlunos = [];
  let _cacheInscricoes = [];
  let _cacheSeletivas = [];
  let _cacheParticipacoesSeletiva = [];
  let _cacheAgrupamentos = []; // { id, nome, serieId, ativo, turmaIds:[...] }
  let _dadosSupabaseCarregados = false;

  function mapConfigFromRow(r){ return { id:r.id, nomeEvento:r.nome_evento, ano:r.ano, nomeCompleto:r.nome_completo }; }
  function mapSimplesFromRow(r){ return { id:r.id, nome:r.nome, ativo:r.ativo }; } // series/turnos/categorias
  function mapTurmaFromRow(r){ return { id:r.id, serieId:r.serie_id, turma:r.turma, turno:r.turno, ativo:r.ativo }; }
  function mapAlunoFromRow(r){ return { id:r.id, turmaId:r.turma_id, serieId:r.serie_id, nome:r.nome, sexo:r.sexo, importacaoId:r.importacao_id || null }; }
  function mapInscricaoFromRow(r){ return { id:r.id, alunoId:r.aluno_id, turmaId:r.turma_id, serieId:r.serie_id, modalidadeId:r.modalidade_id }; }
  function mapSeletivaFromRow(r){ return { id:r.id, modalidadeId:r.modalidade_id, serieId:r.serie_id, categoria:r.categoria, vagas:r.vagas, status:r.status }; }
  function mapParticipacaoSeletivaFromRow(r){
    return { id:r.id, seletivaId:r.seletiva_id, alunoId:r.aluno_id, presente:r.presente, status:r.status,
      colocacao:r.colocacao || '', resultado:r.resultado || '', observacao:r.observacao || '' };
  }
  function mapAgrupamentoFromRow(r){ return { id:r.id, nome:r.nome, serieId:r.serie_id, ativo:r.ativo }; }

  // Carrega (ou semeia, se a tabela estiver vazia) uma tabela simples
  // do tipo {id, nome, ativo} -- reaproveitado por series/turnos/categorias.
  // Diagnóstico granular (Correção 1): cada chamada ao Supabase é isolada
  // com sua própria mensagem de console, para localizar exatamente qual
  // tabela/operação falhou -- o objeto de erro completo é preservado.
  async function carregarOuSemearSimples(tabela, nomesPadrao){
    const { data, error } = await supabaseClient.from(tabela).select('*').order('criado_em');
    if(error){
      console.error(`Erro ao carregar ${tabela}:`, error);
      throw error;
    }
    if(data && data.length) return data.map(mapSimplesFromRow);
    if(!nomesPadrao || !nomesPadrao.length) return [];
    const linhas = nomesPadrao.map(nome => ({ nome, ativo:true }));
    const { data: inseridas, error: erroInsercao } = await supabaseClient.from(tabela).insert(linhas).select();
    if(erroInsercao){
      console.error(`Erro ao semear ${tabela}:`, erroInsercao);
      throw erroInsercao;
    }
    return (inseridas || []).map(mapSimplesFromRow);
  }

  // Ponto de entrada chamado uma vez, logo após o login (ver mostrarAplicacao).
  // Idempotente: só semeia dados padrão se a tabela estiver realmente vazia,
  // nunca apaga ou duplica registros em acessos posteriores.
  //
  // Diagnóstico granular (Correção 1): cada etapa loga no console qual
  // tabela/operação está sendo executada e, se falhar, um rótulo claro
  // ("Erro ao carregar X:" / "Erro ao semear X:") junto do objeto de erro
  // COMPLETO retornado pelo Supabase (nunca resumido ou escondido). A tela
  // de "Não foi possível carregar os dados" (mostrarAplicacao) continua
  // simples para o usuário -- o detalhe técnico vai só para o console.
  async function carregarDadosSupabase(){
    // ---- config_evento ----
    const { data: configRows, error: erroConfig } = await supabaseClient.from('config_evento').select('*').limit(1);
    if(erroConfig){
      console.error('Erro ao carregar config_evento:', erroConfig);
      throw erroConfig;
    }
    if(configRows && configRows.length){
      _cacheConfig = mapConfigFromRow(configRows[0]);
    } else {
      // Nota: em condições normais este ramo não deveria executar, pois o
      // supabase-schema.sql já insere a linha padrão de config_evento ao
      // ser rodado no projeto. Evitamos .single() aqui de propósito -- se
      // a política de SELECT após INSERT não devolver a linha (RLS), é
      // melhor detectar isso explicitamente do que estourar um erro
      // genérico do PostgREST.
      const { data: novoConfig, error: erroCriarConfig } = await supabaseClient.from('config_evento')
        .insert({ nome_evento:'JIBA', ano:2026, nome_completo:'Jogos Internos Batista' })
        .select();
      if(erroCriarConfig){
        console.error('Erro ao semear config_evento:', erroCriarConfig);
        throw erroCriarConfig;
      }
      if(!novoConfig || !novoConfig.length){
        const erro = new Error('A inserção em config_evento não retornou nenhuma linha (possível bloqueio de RLS na leitura pós-inserção).');
        console.error('Erro ao semear config_evento:', erro);
        throw erro;
      }
      _cacheConfig = mapConfigFromRow(novoConfig[0]);
    }

    // ---- series / turnos / categorias ----
    _cacheSeries = await carregarOuSemearSimples('series', ['1º ano','2º ano','3º ano','4º ano','5º ano']);
    _cacheTurnos = await carregarOuSemearSimples('turnos', ['Matutino','Vespertino']);

  function gerarId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  // Correção urgente (erro 22P02): alguns campos do Supabase são do tipo
  // uuid (ex.: alunos.importacao_id). gerarId() acima NÃO produz um UUID
  // válido -- serve só para ids de entidades que continuam em
  // localStorage. Para qualquer valor que vá para um campo uuid do
  // Supabase, usar esta função em vez de gerarId().
  function gerarUuidCliente(){
    if(typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function'){
      return crypto.randomUUID();
    }
    // fallback (ambientes muito antigos sem crypto.randomUUID): monta um UUID v4 válido na mão
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

    if(!aluno) return;
    const existente = _cacheInscricoes.find(i => i.alunoId === alunoId && i.modalidadeId === modalidadeId);
    if(existente){
      const { error } = await supabaseClient.from('inscricoes').delete().eq('id', existente.id);
      if(error) throw error;
      _cacheInscricoes = _cacheInscricoes.filter(i => i.id !== existente.id);
    } else {
      const linha = { aluno_id: alunoId, modalidade_id: modalidadeId, turma_id: aluno.turmaId, serie_id: aluno.serieId };
      const { data, error } = await supabaseClient.from('inscricoes').insert(linha).select().single();

  async function definirInscricoesDoAluno(alunoId, modalidadeIdsDesejados){
    const aluno = getAluno(alunoId);
    if(!aluno) return;
    const atuais = _cacheInscricoes.filter(i => i.alunoId === alunoId);
    const idsAtuais = new Set(atuais.map(i => i.modalidadeId));
    const paraRemover = atuais.filter(i => !modalidadeIdsDesejados.includes(i.modalidadeId));
    const paraAdicionar = modalidadeIdsDesejados.filter(mid => !idsAtuais.has(mid));

    if(paraRemover.length){
      const { error } = await supabaseClient.from('inscricoes').delete().in('id', paraRemover.map(i => i.id));
      if(error) throw error;
    }
    let inseridas = [];
    if(paraAdicionar.length){
      const linhas = paraAdicionar.map(modalidadeId => ({
        aluno_id: alunoId, modalidade_id: modalidadeId, turma_id: aluno.turmaId, serie_id: aluno.serieId
      }));
      const { data, error } = await supabaseClient.from('inscricoes').insert(linhas).select();
      if(error) throw error;
      inseridas = data.map(mapInscricaoFromRow);
    }
    const idsParaRemover = new Set(paraRemover.map(i => i.id));
    _cacheInscricoes = [..._cacheInscricoes.filter(i => !idsParaRemover.has(i.id)), ...inseridas];
  }

    );
  }

  function getSeletivas(){ return _cacheSeletivas; }
  function getSeletiva(modalidadeId, serieId, categoria){
    return _cacheSeletivas.find(s =>
      s.modalidadeId === modalidadeId && s.serieId === serieId && s.categoria === categoria
    ) || null;
  }
  async function obterOuCriarSeletiva(modalidadeId, serieId, categoria){
    let seletiva = getSeletiva(modalidadeId, serieId, categoria);
    if(seletiva) return seletiva;
    const linha = { modalidade_id: modalidadeId, serie_id: serieId, categoria, vagas:0, status:'Pendente' };
    const { data, error } = await supabaseClient.from('seletivas').insert(linha).select().single();
    if(error) throw error;
    seletiva = mapSeletivaFromRow(data);
    _cacheSeletivas = [..._cacheSeletivas, seletiva];
    return seletiva;
  }
  async function atualizarSeletiva(id, dados){
    const linha = {};
    if('vagas' in dados) linha.vagas = dados.vagas;
    if('status' in dados) linha.status = dados.status;
    const { data, error } = await supabaseClient.from('seletivas').update(linha).eq('id', id).select().single();
    if(error) throw error;
    _cacheSeletivas = _cacheSeletivas.map(s => s.id === id ? mapSeletivaFromRow(data) : s);
  }

  function getParticipacoes(seletivaId){
    return _cacheParticipacoesSeletiva.filter(p => p.seletivaId === seletivaId);
  }
  function getParticipacoesDoAluno(alunoId){
    return _cacheParticipacoesSeletiva.filter(p => p.alunoId === alunoId);
  }
  async function obterOuCriarParticipacao(seletivaId, alunoId){
    let p = _cacheParticipacoesSeletiva.find(p => p.seletivaId === seletivaId && p.alunoId === alunoId);
    if(p) return p;
    const linha = { seletiva_id: seletivaId, aluno_id: alunoId, presente:false, status:'Aguardando' };
    const { data, error } = await supabaseClient.from('participacoes_seletiva').insert(linha).select().single();
    if(error) throw error;
    p = mapParticipacaoSeletivaFromRow(data);
    _cacheParticipacoesSeletiva = [..._cacheParticipacoesSeletiva, p];
    return p;
  }
  async function atualizarParticipacao(id, dados){
    const linha = {};
    if('presente' in dados) linha.presente = dados.presente;
    if('status' in dados) linha.status = dados.status;
    if('colocacao' in dados) linha.colocacao = dados.colocacao;
    if('resultado' in dados) linha.resultado = dados.resultado;
    if('observacao' in dados) linha.observacao = dados.observacao;
    const { data, error } = await supabaseClient.from('participacoes_seletiva').update(linha).eq('id', id).select().single();
    if(error) throw error;
    _cacheParticipacoesSeletiva = _cacheParticipacoesSeletiva.map(p => p.id === id ? mapParticipacaoSeletivaFromRow(data) : p);
  }
  // Chamada pelo roteador (async) antes de abrir a tela da seletiva:
  // garante que a seletiva e a participação de cada aluno elegível já
  // existam no Supabase/cache, para a tela em si poder ler tudo de forma
  // síncrona (sem esperar nada durante a renderização).
  async function garantirSeletivaEParticipacoes(modalidadeId, serieId, categoria){
    const seletiva = await obterOuCriarSeletiva(modalidadeId, serieId, categoria);
    const elegiveis = alunosElegiveisSeletiva(modalidadeId, serieId, categoria);
    const faltantes = elegiveis.filter(a => !_cacheParticipacoesSeletiva.some(p => p.seletivaId === seletiva.id && p.alunoId === a.id));
    for(const aluno of faltantes){
      await obterOuCriarParticipacao(seletiva.id, aluno.id);
    }
    return seletiva;
  }
  function contarClassificados(seletivaId, ignorarParticipacaoId){
    return getParticipacoes(seletivaId).filter(p =>
      p.status === 'Classificado' && p.id !== ignorarParticipacaoId
    ).length;
  }
  // Etapa 2B-2: agrupa os alunos de uma seletiva já concluída por resultado,
  // opcionalmente restrito a uma turma (o chaveamento/fase seguinte é
  // sempre intra-turma). Só leitura -- nenhuma tabela nova, reaproveita
  // getParticipacoes/getAluno já existentes.
  function agruparResultadoSeletiva(seletivaId, turmaId){
    const linhas = getParticipacoes(seletivaId)
      .map(p => ({ p, aluno: getAluno(p.alunoId) }))
      .filter(l => l.aluno && (!turmaId || l.aluno.turmaId === turmaId));
    const porNome = (a, b) => a.aluno.nome.localeCompare(b.aluno.nome, 'pt-BR');
    return {
      classificados: linhas.filter(l => l.p.status === 'Classificado').sort(porNome),
      naoClassificados: linhas.filter(l => l.p.status === 'Não classificado').sort(porNome),
      reservas: linhas.filter(l => l.p.status === 'Reserva').sort(porNome),
    };
  }
  // Participantes para "Gerar fase principal" (Classificados) ou "Gerar
  // repescagem" (Reservas + Não classificados) de uma turma específica.
  function participantesFaseSeletiva(seletivaId, turmaId, tipo){
    const grupos = agruparResultadoSeletiva(seletivaId, turmaId);
    const linhas = tipo === 'principal' ? grupos.classificados : [...grupos.reservas, ...grupos.naoClassificados];
    return linhas.map(l => l.aluno);
  }
  function resumoSeletivasDaTurma(turmaId){
    // usado na Ficha da Turma: agrega classificados/reservas por modalidade,
    // somando as categorias (Masculino + Feminino) para os alunos daquela turma.
    const turma = getTurmas().find(t => t.id === turmaId);
    if(!turma) return [];
    const modalidades = modalidadesDaSerie(turma.serieId).filter(m => m.tipo === 'Individual');
    const alunosDaTurma = new Set(getAlunosPorTurma(turmaId).map(a => a.id));
    const todasParticipacoes = _cacheParticipacoesSeletiva;

    return modalidades.map(m => {
      const inscritos = getInscricoes().filter(i => i.modalidadeId === m.id && alunosDaTurma.has(i.alunoId)).length;
      const participacoesTurma = todasParticipacoes.filter(p =>
        alunosDaTurma.has(p.alunoId) &&
        getSeletivas().some(s => s.id === p.seletivaId && s.modalidadeId === m.id)
      );
      const classificados = participacoesTurma.filter(p => p.status === 'Classificado').length;
      const reservas = participacoesTurma.filter(p => p.status === 'Reserva').length;
      const alguemAvaliado = participacoesTurma.some(p => p.status !== 'Aguardando');
      return { modalidade: m, inscritos, classificados, reservas, pendente: !alguemAvaliado };
    }).filter(r => r.inscritos > 0);
  }

  /* ============================================================
     AGRUPAMENTO DE TURMAS
     ------------------------------------------------------------
     Camada acima de `turmas`, só para visualização/inscrições/
     relatório conjuntos -- nunca move nem duplica aluno algum
     (turma_id do aluno nunca é alterado). Igual às outras 11
     entidades já migradas, cache local + escrita direta no
     Supabase (tabelas `agrupamentos_turmas` e
     `agrupamentos_turmas_itens`, ver supabase-schema.sql).
  ============================================================ */
  function getAgrupamentos(){ return _cacheAgrupamentos; }
  function getAgrupamentosAtivos(){ return _cacheAgrupamentos.filter(a => a.ativo); }
  function getAgrupamentosAtivosDaSerie(serieId){
    return _cacheAgrupamentos.filter(a => a.ativo && a.serieId === serieId);
  }
  function getAgrupamento(id){ return _cacheAgrupamentos.find(a => a.id === id) || null; }
  // Agrupamento ATIVO ao qual esta turma pertence (ou null se estiver solta).
  function getAgrupamentoDaTurma(turmaId){
    return _cacheAgrupamentos.find(a => a.ativo && a.turmaIds.includes(turmaId)) || null;
  }

  function validarTurmasDoAgrupamento(serieId, turmaIds, ignorarAgrupamentoId){
    if(!turmaIds || turmaIds.length < 2){
      throw new Error('Selecione pelo menos duas turmas para agrupar.');
    }
    const idsUnicos = new Set(turmaIds);
    if(idsUnicos.size !== turmaIds.length){
      throw new Error('Turma repetida na seleção.');
    }
    const todasDaSerie = turmaIds.every(tid => {
      const t = getTurmas().find(x => x.id === tid);
      return t && t.serieId === serieId;
    });
    if(!todasDaSerie){
      throw new Error('Só é possível agrupar turmas da mesma série.');
    }
    const conflito = turmaIds.find(tid => {
      const outro = getAgrupamentoDaTurma(tid);
      return outro && outro.id !== ignorarAgrupamentoId;
    });
    if(conflito){
      const turmaConflito = getTurmas().find(t => t.id === conflito);
      throw new Error(`A turma ${turmaConflito ? turmaConflito.turma : ''} já faz parte de outro agrupamento ativo.`);
    }
  }

  async function criarAgrupamento(nome, serieId, turmaIds){
    validarTurmasDoAgrupamento(serieId, turmaIds, null);
    const { data: novoAgrupamento, error } = await supabaseClient.from('agrupamentos_turmas')
      .insert({ nome, serie_id: serieId, ativo: true }).select().single();
    if(error) throw error;
    const linhasItens = turmaIds.map(tid => ({ agrupamento_id: novoAgrupamento.id, turma_id: tid }));
    const { error: erroItens } = await supabaseClient.from('agrupamentos_turmas_itens').insert(linhasItens);
    if(erroItens) throw erroItens;
    const agrupamento = { ...mapAgrupamentoFromRow(novoAgrupamento), turmaIds: [...turmaIds] };
    _cacheAgrupamentos = [..._cacheAgrupamentos, agrupamento];
    return agrupamento;
  }

  async function editarAgrupamento(id, { nome, turmaIds }){
    const atual = getAgrupamento(id);
    if(!atual) throw new Error('Agrupamento não encontrado.');
    if(turmaIds){
      validarTurmasDoAgrupamento(atual.serieId, turmaIds, id);
    }
    if(nome){
      const { error } = await supabaseClient.from('agrupamentos_turmas').update({ nome }).eq('id', id);
      if(error) throw error;
    }
    if(turmaIds){
      const paraRemover = atual.turmaIds.filter(t => !turmaIds.includes(t));
      const paraAdicionar = turmaIds.filter(t => !atual.turmaIds.includes(t));
      for(const tid of paraRemover){
        const { error } = await supabaseClient.from('agrupamentos_turmas_itens').delete().eq('agrupamento_id', id).eq('turma_id', tid);
        if(error) throw error;
      }
      if(paraAdicionar.length){
        const linhas = paraAdicionar.map(tid => ({ agrupamento_id: id, turma_id: tid }));
        const { error } = await supabaseClient.from('agrupamentos_turmas_itens').insert(linhas);
        if(error) throw error;
      }
    }
    _cacheAgrupamentos = _cacheAgrupamentos.map(a => a.id === id
      ? { ...a, nome: nome || a.nome, turmaIds: turmaIds ? [...turmaIds] : a.turmaIds }
      : a
    );
    return getAgrupamento(id);
  }

  // "Separar turmas": só desativa (ativo=false). Nada é excluído -- as
  // turmas, os alunos, as inscrições e o histórico do agrupamento continuam.
  async function separarAgrupamento(id){
    const { error } = await supabaseClient.from('agrupamentos_turmas').update({ ativo:false }).eq('id', id);
    if(error) throw error;
    _cacheAgrupamentos = _cacheAgrupamentos.map(a => a.id === id ? { ...a, ativo:false } : a);
  }

  // Visão de inscrições de um agrupamento (mesma forma de
  // resumoInscricoesPorTurma, mas cada aluno some junto com sua turma de
  // origem, já que os alunos de duas ou mais turmas são combinados aqui).
  function resumoInscricoesPorAgrupamento(agrupamentoId){
    const agrupamento = getAgrupamento(agrupamentoId);
    if(!agrupamento) return null;
    const turmas = agrupamento.turmaIds.map(tid => getTurmas().find(t => t.id === tid)).filter(Boolean);
    const modalidadesDoGrupo = modalidadesDaSerie(agrupamento.serieId);

    const porModalidade = modalidadesDoGrupo.map(m => {
      const todos = [];
      turmas.forEach(t => {
        getAlunosInscritosModalidade(t.id, m.id).forEach(alunoId => {
          const aluno = getAluno(alunoId);
          if(aluno) todos.push({ aluno, turma: t });
        });
      });
      const masculino = todos.filter(x => x.aluno.sexo === 'Masculino').sort((a, b) => a.aluno.nome.localeCompare(b.aluno.nome, 'pt-BR'));
      const feminino = todos.filter(x => x.aluno.sexo === 'Feminino').sort((a, b) => a.aluno.nome.localeCompare(b.aluno.nome, 'pt-BR'));
      return { modalidade: m, masculino, feminino, total: masculino.length + feminino.length };
    })
      .filter(r => r.total > 0)
      .sort((a, b) => a.modalidade.nome.localeCompare(b.modalidade.nome, 'pt-BR'));

    const alunosCadastrados = turmas.reduce((soma, t) => soma + getAlunosPorTurma(t.id).length, 0);
    const totalInscricoes = porModalidade.reduce((soma, r) => soma + r.total, 0);

    return {
      agrupamento, turmas,
      alunosCadastrados, totalInscricoes,
      modalidadesUtilizadas: porModalidade.length,
      modalidades: porModalidade
    };
  }

  /* ============================================================
     RELATÓRIOS DE RESULTADO DAS SELETIVAS (reformulação)
     ------------------------------------------------------------
     DIAGNÓSTICO (antes de alterar): o relatório antigo
     "Resultados das Seletivas" nunca lia as seletivas de verdade
     (`seletivas`/`participacoes_seletiva`, Bloco 3) -- ele inferia
     um "resultado" a partir do CHAVEAMENTO (Bloco 7) daquela turma
     (`getChaveamentosPorContexto(...).filter(Finalizado)[0]`). Por
     isso, uma seletiva finalizada (com Classificados definidos) só
     aparecia se, ALÉM disso, já existisse um chaveamento finalizado
     para a mesma turma -- o que é um passo seguinte e opcional
     (Etapa 2B-2/2B-3). Sem chaveamento, a seletiva "sumia" do
     relatório mesmo estando concluída. O relatório também era só
     por `turma_id`, sem nenhum conceito de agrupamento.
     CORREÇÃO: os relatórios abaixo leem diretamente
     `getSeletiva`/`getParticipacoes` (a fonte real), e aceitam tanto
     uma turma quanto um agrupamento ativo como "contexto de
     apresentação" -- sem inventar nenhuma tabela nova.
  ============================================================ */

  // Turma "solta" ou as turmas de um agrupamento ativo, tratadas como
  // uma única unidade de apresentação (mesma ideia de
  // resumoInscricoesPorAgrupamento, generalizada para os relatórios de
  // resultado).
  function contextoApresentacaoResultado(idTurmaOuAgrupamento){
    const agrupamento = getAgrupamento(idTurmaOuAgrupamento);
    if(agrupamento){
      const turmas = agrupamento.turmaIds.map(tid => getTurmas().find(t => t.id === tid)).filter(Boolean);
      return { tipo: 'grupo', agrupamento, turmas, serieId: agrupamento.serieId };
    }
    const turma = getTurmas().find(t => t.id === idTurmaOuAgrupamento);
    if(turma) return { tipo: 'turma', turma, turmas: [turma], serieId: turma.serieId };
    return null;
  }

  // Traduz o status técnico da participação para a linguagem pedida
  // (PASSOU / NÃO PASSOU / AGUARDANDO) -- só na apresentação; o valor
  // salvo em `participacoes_seletiva.status` continua exatamente igual.
  function situacaoAmigavelParticipacao(status){
    switch(status){
      case 'Classificado': return 'PASSOU';
      case 'Reserva': return 'RESERVA';
      case 'Não classificado': return 'NÃO PASSOU';
      case 'Não compareceu': return 'NÃO PASSOU (ausente)';
      case 'Desistiu': return 'NÃO PASSOU (desistiu)';
      default: return 'AGUARDANDO';
    }
  }

  // RESULTADO SIMPLIFICADO (para professoras): só quem PASSOU
  // (status "Classificado"), por modalidade, Masculino/Feminino
  // separados. Se o contexto for um agrupamento, os alunos das turmas
  // combinadas aparecem juntos, sem rótulo de turma (a ficha já informa
  // "Grupo de competição" uma vez só).
  function relatorioClassificadosSimplificado(idTurmaOuAgrupamento){
    const ctx = contextoApresentacaoResultado(idTurmaOuAgrupamento);
    if(!ctx) return null;
    const serie = getSeries().find(s => s.id === ctx.serieId);
    const idsAlunosDoContexto = new Set(ctx.turmas.flatMap(t => getAlunosPorTurma(t.id).map(a => a.id)));
    const modalidades = modalidadesDaSerie(ctx.serieId).filter(m => m.tipo === 'Individual');

    const blocos = modalidades.map(m => {
      function classificadosDaCategoria(categoria){
        const seletiva = getSeletiva(m.id, ctx.serieId, categoria);
        if(!seletiva) return [];
        return getParticipacoes(seletiva.id)
          .filter(p => p.status === 'Classificado' && idsAlunosDoContexto.has(p.alunoId))
          .map(p => getAluno(p.alunoId))
          .filter(Boolean)
          .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      }
      return { modalidade: m, masculino: classificadosDaCategoria('Masculino'), feminino: classificadosDaCategoria('Feminino') };
    }).filter(b => b.masculino.length || b.feminino.length);

    return {
      tipo: ctx.tipo, serie, turmas: ctx.turmas, agrupamento: ctx.agrupamento || null, blocos
    };
  }

  // RESULTADO DETALHADO (controle interno): todas as participações
  // (qualquer situação, inclusive Aguardando/Reserva), com sexo, turma
  // de origem, presença e colocação -- para conferência do organizador.
  function relatorioResultadoDetalhado(idTurmaOuAgrupamento){
    const ctx = contextoApresentacaoResultado(idTurmaOuAgrupamento);
    if(!ctx) return null;
    const serie = getSeries().find(s => s.id === ctx.serieId);
    const idsAlunosDoContexto = new Set(ctx.turmas.flatMap(t => getAlunosPorTurma(t.id).map(a => a.id)));
    const modalidades = modalidadesDaSerie(ctx.serieId).filter(m => m.tipo === 'Individual');

    const blocos = [];
    modalidades.forEach(m => {
      ['Masculino', 'Feminino'].forEach(categoria => {
        const seletiva = getSeletiva(m.id, ctx.serieId, categoria);
        if(!seletiva) return;
        const linhas = getParticipacoes(seletiva.id)
          .filter(p => idsAlunosDoContexto.has(p.alunoId))
          .map(p => {
            const aluno = getAluno(p.alunoId);
            return aluno ? { participacao: p, aluno, turma: getTurmas().find(t => t.id === aluno.turmaId) } : null;
          })
          .filter(Boolean)
          .sort((a, b) => a.aluno.nome.localeCompare(b.aluno.nome, 'pt-BR'));
        if(!linhas.length) return;
        blocos.push({ modalidade: m, categoria, seletiva, linhas });
      });
    });

    return { serie, turmas: ctx.turmas, agrupamento: ctx.agrupamento || null, blocos };
  }

  // DIAGNÓSTICO (Resultado Final do JIBA): revisei montarFinalJiba,
  // definirVencedorConfrontoFinalJiba e atualizarResultadosFinaisJibaSeAplicavel
  // -- a gravação de `finais_jiba.status = 'Finalizado'` está correta.
  // A causa mais provável de uma final "não aparecer" é que ela foi
  // decidida pelo chaveamento intra-turma (Fase Principal/Repescagem/
  // Final da Etapa 2B-3, tabela `chaveamentos` com tipo:'final') e NÃO
  // por uma Final do JIBA entre representantes de turmas diferentes
  // (tabela separada `finais_jiba`, Bloco 8) -- são dois estágios
  // distintos do sistema. Em vez de misturar os dois conceitos, este
  // relatório passa a mostrar AMBOS, em seções claramente separadas,
  // para que nenhum campeão "suma" independente de qual caminho foi
  // usado.
  function relatorioCampeoesChaveamentoFinal({ serieId, modalidadeId } = {}){
    let finais = getChaveamentos().filter(c => c.tipo === 'final' && c.status === 'Finalizado');
    if(serieId) finais = finais.filter(c => c.serieId === serieId);
    if(modalidadeId) finais = finais.filter(c => c.modalidadeId === modalidadeId);
    return finais.map(c => ({
      chaveamento: c,
      modalidade: getModalidades().find(m => m.id === c.modalidadeId),
      serie: getSeries().find(s => s.id === c.serieId),
      turma: getTurmas().find(t => t.id === c.turmaId),
      campeao: getAluno(c.campeaoAlunoId),
      vice: c.viceAlunoId ? getAluno(c.viceAlunoId) : null
    }));
  }

  /* ---------- Equipes Coletivas (Bloco 4) ---------- */
  function getModalidadesColetivasAtivas(){
    return getModalidades().filter(m => m.ativo && m.tipo === 'Coletiva');
  }
  function modalidadesColetivasDaSerie(serieId){
    return modalidadesDaSerie(serieId).filter(m => m.tipo === 'Coletiva');
  }
  function alunosElegiveisEquipe(turmaId, modalidadeId){
    const m = getModalidades().find(m => m.id === modalidadeId);
    const inscritosIds = new Set(getAlunosInscritosModalidade(turmaId, modalidadeId));
    let alunos = getAlunosPorTurma(turmaId).filter(a => inscritosIds.has(a.id));
    if(m && m.categoria === 'Masculino') alunos = alunos.filter(a => a.sexo === 'Masculino');
    if(m && m.categoria === 'Feminino') alunos = alunos.filter(a => a.sexo === 'Feminino');
    return alunos;
  }

  function getEquipes(){ return lerLista(CHAVES.equipes); }
  function getEquipe(turmaId, modalidadeId){
    return getEquipes().find(e => e.turmaId === turmaId && e.modalidadeId === modalidadeId) || null;
  }
  function obterOuCriarEquipe(turmaId, modalidadeId){
    let equipe = getEquipe(turmaId, modalidadeId);
    if(equipe) return equipe;
    const lista = getEquipes();
    equipe = {
      id: gerarId(), turmaId, modalidadeId, status: 'Em montagem',
      limiteSelecionados: 0, limiteReservas: 0,
      regraMista: { ativa:false, minMeninos:0, minMeninas:0 }
    };
    lista.push(equipe);
    salvarLista(CHAVES.equipes, lista);
    return equipe;
  }
  function atualizarEquipe(id, dados){
    const lista = getEquipes().map(e => e.id === id ? {...e, ...dados} : e);
    salvarLista(CHAVES.equipes, lista);
  }

  function getParticipacoesEquipe(equipeId){
    return lerLista(CHAVES.participacoesEquipe).filter(p => p.equipeId === equipeId);
  }
  function getParticipacoesEquipeDoAluno(alunoId){
    return lerLista(CHAVES.participacoesEquipe).filter(p => p.alunoId === alunoId);
  }
  function obterOuCriarParticipacaoEquipe(equipeId, alunoId){
    const lista = lerLista(CHAVES.participacoesEquipe);
    let p = lista.find(p => p.equipeId === equipeId && p.alunoId === alunoId);
    if(p) return p;
    p = {
      id: gerarId(), equipeId, alunoId,
      status: 'Aguardando definição', posicao: '', capitao: false, observacao: ''
    };
    lista.push(p);
    salvarLista(CHAVES.participacoesEquipe, lista);
    return p;
  }
  function atualizarParticipacaoEquipe(id, dados){

  // -- Validação de sequência de colocação (ranking por competição, com empates) --
  function validarSequenciaColocacoes(posicoesAtribuidas){
    if(!posicoesAtribuidas.length) return { valido:true };
    const contagem = {};
    posicoesAtribuidas.forEach(p => { contagem[p] = (contagem[p] || 0) + 1; });
    const posicoesUnicas = Object.keys(contagem).map(Number).sort((a, b) => a - b);
    let esperada = 1;
    for(const p of posicoesUnicas){
      if(p !== esperada){
        return {
          valido:false,
          mensagemErro: `⚠️ Com base nas colocações já usadas, a próxima colocação válida é ${esperada}º lugar (foi usado ${p}º).`
        };
      }
      esperada = p + contagem[p];
    }
    return { valido:true };
  }

  // -- Ranking automático por pontos, com empate (usado na Classificação Geral) --
  function calcularRankingCompeticao(itens){
    const ordenado = itens.slice().sort((a, b) => b.valor - a.valor);
    const resultado = [];
    for(let i = 0; i < ordenado.length; i++){
      if(i > 0 && ordenado[i].valor === ordenado[i - 1].valor){
        resultado.push({...ordenado[i], posicao: resultado[i - 1].posicao});
      } else {
        resultado.push({...ordenado[i], posicao: i + 1});
      }
    }
    return resultado;
  }
