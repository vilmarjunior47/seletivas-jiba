function renderListaModalidadesTurma(turmaId){
  const container = document.getElementById('listaModalidadesTurma');
  if(!container) return;
  const turma = DB.getTurmas().find(t => t.id === turmaId);
  if(!turma){ container.innerHTML = ''; return; }

  const modalidades = DB.modalidadesDaSerie(turma.serieId);
  const coletivas = modalidades.filter(m => m.tipo === 'Coletiva');
  const individuais = modalidades.filter(m => m.tipo === 'Individual');

  function listaHtml(lista){
    if(!lista.length) return '<p style="color:var(--texto-suave); font-size:13.5px;">Nenhuma modalidade disponível para esta série.</p>';
    return lista.map(m => `
      <a href="#/turma/${turmaId}/modalidade/${m.id}" class="cartao-contador-modalidade">
        <span>${iconeTipoModalidade(m.tipo)} ${m.nome}</span>
        <span class="contagem">${DB.contarInscritosModalidadeNaTurma(turmaId, m.id)} inscritos</span>
      </a>
    `).join('');
  }

  function listaColetivasHtml(lista){
    if(!lista.length) return '<p style="color:var(--texto-suave); font-size:13.5px;">Nenhuma modalidade disponível para esta série.</p>';
    return lista.map(m => {
      const equipe = DB.getEquipe(turmaId, m.id);
      const participacoes = equipe ? DB.getParticipacoesEquipe(equipe.id) : [];
      const selecionados = participacoes.filter(p => p.status === 'Titular/Selecionado').length;
      const reservas = participacoes.filter(p => p.status === 'Reserva').length;
      const naoSelecionados = participacoes.filter(p => p.status === 'Não selecionado').length;
      const inscritos = DB.contarInscritosModalidadeNaTurma(turmaId, m.id);
      return `
        <a href="#/turma/${turmaId}/modalidade/${m.id}" class="cartao-contador-modalidade" style="flex-direction:column; align-items:stretch; gap:6px;">
          <div style="display:flex; justify-content:space-between;">
            <span>${iconeTipoModalidade(m.tipo)} ${m.nome}</span>
            <span class="contagem">${inscritos} inscritos</span>
          </div>
          <div style="font-size:12px; color:var(--texto-suave); display:flex; gap:10px; flex-wrap:wrap;">
            <span>✅ ${selecionados} selecionados</span>
            <span>🟡 ${reservas} reservas</span>
            <span>❌ ${naoSelecionados} não selecionados</span>
          </div>
        </a>
      `;
    }).join('');
  }

  container.innerHTML = `
    <div class="grupo-modalidades">
      <h4>🏃 Modalidades Coletivas</h4>
      ${listaColetivasHtml(coletivas)}
    </div>
    <div class="grupo-modalidades">
      <h4>🏅 Modalidades Individuais</h4>
      ${listaHtml(individuais)}
    </div>
  `;
}

function ligarEventosFichaTurma(turmaId){
  const turma = DB.getTurmas().find(t => t.id === turmaId);
  const serieId = turma ? turma.serieId : null;

  document.getElementById('formNovoAluno').addEventListener('submit', async e => {
    e.preventDefault();
    const nomeInput = document.getElementById('alunoNome');
    const nome = nomeInput.value.trim();
    const sexo = document.getElementById('alunoSexo').value;
    if(!nome) return;
    const btn = e.target.querySelector('button[type="submit"]');
    const ok = await executarComFeedback(btn, 'Salvando...', () => DB.addAluno({ turmaId, serieId, nome, sexo }));
    if(!ok) return;
    nomeInput.value = '';
    renderResumoTurma(turmaId);
    renderListaAlunosTurma(turmaId);
    mostrarToast('Aluno adicionado.');
  });

  document.getElementById('buscaAluno').addEventListener('input', () => {
    renderListaAlunosTurma(turmaId);
  });

  document.getElementById('listaAlunosTurma').addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const id = btn.dataset.id;
    const acao = btn.dataset.acao;

    if(acao === 'inscricoes-aluno'){
      location.hash = `#/turma/${turmaId}/aluno/${id}`;
    }
    if(acao === 'editar-aluno'){
      const aluno = DB.getAluno(id);
      const novoNome = prompt('Nome completo do aluno:', aluno.nome);
      if(!novoNome || !novoNome.trim()) return;
      let novoSexo = prompt('Sexo (Masculino ou Feminino):', aluno.sexo);
      if(!['Masculino','Feminino'].includes(novoSexo)) novoSexo = aluno.sexo;
      const ok = await executarComFeedback(btn, '...', () => DB.atualizarAluno(id, { nome: novoNome.trim(), sexo: novoSexo }));
      if(!ok) return;
      renderListaAlunosTurma(turmaId);
      mostrarToast('Aluno atualizado.');
    }
    if(acao === 'excluir-aluno'){
      const aluno = DB.getAluno(id);
      const confirmado = confirm(`Excluir ${aluno.nome}? Isso também removerá as inscrições dele.`);
      if(!confirmado) return;
      const ok = await executarComFeedback(btn, '...', () => DB.excluirAluno(id));
      if(!ok) return;
      renderResumoTurma(turmaId);
      renderListaAlunosTurma(turmaId);
      renderListaModalidadesTurma(turmaId);
      mostrarToast('Aluno excluído.');
    }
  });

  document.getElementById('listaAlunosTurma').addEventListener('change', async e => {
    const sel = e.target.closest('select[data-acao="alterar-sexo"]');
    if(!sel) return;
    const id = sel.dataset.id;
    const novoSexo = sel.value;
    const anterior = DB.getAluno(id).sexo;
    sel.disabled = true;
    try {
      await DB.atualizarAluno(id, { sexo: novoSexo });
      mostrarToast('Sexo atualizado.');
    } catch(err){
      console.error('Erro ao atualizar sexo do aluno:', err);
      alert('Não foi possível salvar. Verifique sua conexão e tente novamente.');
      sel.value = anterior;
    } finally {
      sel.disabled = false;
    }
  });

  document.querySelectorAll('.aba-turma button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.aba-turma button').forEach(b => b.classList.remove('ativa'));
      btn.classList.add('ativa');
      const aba = btn.dataset.aba;
      document.getElementById('painelAbaAlunos').style.display = aba === 'alunos' ? 'block' : 'none';
      document.getElementById('painelAbaModalidades').style.display = aba === 'modalidades' ? 'block' : 'none';
      document.getElementById('painelAbaSeletivas').style.display = aba === 'seletivas' ? 'block' : 'none';
      document.getElementById('painelAbaEquipes').style.display = aba === 'equipes' ? 'block' : 'none';
      document.getElementById('painelAbaJogos').style.display = aba === 'jogos' ? 'block' : 'none';
      document.getElementById('painelAbaChaveamentos').style.display = aba === 'chaveamentos' ? 'block' : 'none';
      document.getElementById('painelAbaJiba').style.display = aba === 'jiba' ? 'block' : 'none';
      if(aba === 'modalidades') renderListaModalidadesTurma(turmaId);
      if(aba === 'seletivas') renderResumoSeletivasTurma(turmaId);
      if(aba === 'equipes') renderResumoEquipesTurma(turmaId);
      if(aba === 'jogos') renderResumoJogosTurma(turmaId);
      if(aba === 'chaveamentos') renderResumoChaveamentosTurma(turmaId);
      if(aba === 'jiba') renderResumoJibaTurma(turmaId);
    });
  });
}

function telaFichaAluno(turmaId, alunoId){
  const turma = DB.getTurmas().find(t => t.id === turmaId);
  const aluno = DB.getAluno(alunoId);
  if(!turma || !aluno){
    return `
      <button class="botao-voltar" onclick="location.hash='#/turma/${turmaId}'">&larr; Turma</button>
      <div class="tela-em-breve"><div class="icone-grande">❓</div><h2>Aluno não encontrado</h2></div>
    `;
  }
  const serie = DB.getSeries().find(s => s.id === turma.serieId);
  const nomeExibido = `${serie ? serie.nome : '—'} ${turma.turma}`;
  const modalidades = DB.modalidadesDaSerie(turma.serieId);
  const coletivas = modalidades.filter(m => m.tipo === 'Coletiva');
  const individuais = modalidades.filter(m => m.tipo === 'Individual');
  const inscritas = new Set(DB.getInscricoesDoAluno(alunoId));

  function checkboxHtml(m){
    const marcado = inscritas.has(m.id);
    return `
      <label class="item-checkbox-modalidade ${marcado ? 'marcado' : ''}">
        <input type="checkbox" name="modalidade" value="${m.id}" ${marcado ? 'checked' : ''}>
        ${m.nome}
      </label>
    `;
  }

  return `
    <button class="botao-voltar" onclick="location.hash='#/turma/${turmaId}'">&larr; ${nomeExibido}</button>
    <div class="bloco">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <h3>👤 ${aluno.nome}</h3>
        <button class="botao-texto" onclick="location.hash='#/relatorios/ficha-aluno/${alunoId}'">🖨️ Imprimir ficha</button>
      </div>
      <div class="meta-aluno" style="font-size:13.5px; display:flex; flex-direction:column; gap:4px;">
        <span>${nomeExibido} · ${turma.turno}</span>
        <span class="selo-sexo" style="width:fit-content;">${aluno.sexo}</span>
      </div>
    </div>

    <form id="formInscricoes">
      <div class="cabecalho-modalidades-aluno">
        <div class="secao-titulo" style="margin:0;">🏅 Modalidades</div>
        ${modalidades.length ? `
          <div class="acoes-marcar-todas">
            <button type="button" class="botao-texto" id="btnMarcarTodasModalidades">☑ Marcar todas</button>
            <button type="button" class="botao-texto" id="btnDesmarcarTodasModalidades">☐ Desmarcar todas</button>
          </div>
        ` : ''}
      </div>
      ${!modalidades.length ? '<p style="color:var(--texto-suave); font-size:14px;">Nenhuma modalidade disponível para a série deste aluno.</p>' : ''}

      ${coletivas.length ? `
        <div class="grupo-modalidades">
          <h4>🏃 Modalidades Coletivas</h4>
          <div class="lista-checkbox-modalidade">${coletivas.map(checkboxHtml).join('')}</div>
        </div>
      ` : ''}

      ${individuais.length ? `
        <div class="grupo-modalidades">
          <h4>🏅 Modalidades Individuais</h4>
          <div class="lista-checkbox-modalidade">${individuais.map(checkboxHtml).join('')}</div>
        </div>
      ` : ''}

      ${modalidades.length ? '<button type="submit" class="botao botao-primario" style="width:100%;">Salvar inscrições</button>' : ''}
    </form>

    ${(() => {
      const individuaisInscritas = individuais.filter(m => inscritas.has(m.id));
      if(!individuaisInscritas.length) return '';
      const linhas = individuaisInscritas.map(m => {
        const seletiva = DB.getSeletiva(m.id, aluno.serieId, aluno.sexo);
        const participacao = seletiva
          ? DB.getParticipacoes(seletiva.id).find(p => p.alunoId === aluno.id)
          : null;
        const status = participacao ? participacao.status : 'Aguardando';
        const linhaStatus = status === 'Aguardando'
          ? '⏳ Aguardando seletiva'
          : iconeStatusSeletiva(status);
        return `
          <div class="linha-lista">
            <div class="info-item">
              <span class="principal">${iconeModalidade(m.nome)} ${m.nome}</span>
              <span class="secundario">${linhaStatus}${participacao && participacao.colocacao ? ' · ' + participacao.colocacao : ''}</span>
            </div>
          </div>
        `;
      }).join('');
      return `
        <div class="secao-titulo">🎯 Seletivas</div>
        <div class="bloco">${linhas}</div>
      `;
    })()}

    ${(() => {
      const coletivasInscritas = coletivas.filter(m => inscritas.has(m.id));
      if(!coletivasInscritas.length) return '';
      const linhas = coletivasInscritas.map(m => {
        const equipe = DB.getEquipe(aluno.turmaId, m.id);
        const participacao = equipe
          ? DB.getParticipacoesEquipe(equipe.id).find(p => p.alunoId === aluno.id)
          : null;
        const status = participacao ? participacao.status : 'Aguardando definição';
        const linhaStatus = status === 'Aguardando definição'
          ? '⏳ Aguardando definição'
          : labelStatusEquipe(status);
        const detalhes = [];
        if(participacao && participacao.posicao) detalhes.push(`Posição: ${participacao.posicao}`);
        if(participacao && participacao.capitao) detalhes.push('⭐ Capitão');
        return `
          <div class="linha-lista">
            <div class="info-item">
              <span class="principal">${iconeModalidade(m.nome)} ${m.nome}</span>
              <span class="secundario">${linhaStatus}${detalhes.length ? ' · ' + detalhes.join(' · ') : ''}</span>
            </div>
          </div>
        `;
      }).join('');
      return `
        <div class="secao-titulo">🏆 Equipes</div>
        <div class="bloco">${linhas}</div>
      `;
    })()}

    ${(() => {
      const historico = DB.chaveamentosDoAluno(aluno.id);
      if(!historico.length) return '';
      const blocos = historico.map(h => {
        const linhasFase = h.confrontos.map(c => {
          if(c.tipoResultado === 'bye'){
            return `<div class="secundario">${c.fase}: ⭐ avanço automático (BYE)</div>`;
          }
          if(!c.vencedorAlunoId){
            return `<div class="secundario">${c.fase}: ⏳ ainda não jogou</div>`;
          }
          const venceu = c.vencedorAlunoId === aluno.id;
          const oponenteId = c.alunoAId === aluno.id ? c.alunoBId : c.alunoAId;
          const oponente = oponenteId ? DB.getAluno(oponenteId) : null;
          return `<div class="secundario">${c.fase}: ${venceu ? '✅ venceu' : '❌ perdeu para'} ${oponente ? oponente.nome : ''}</div>`;
        }).join('');
        let selo = '';
        if(h.chaveamento.campeaoAlunoId === aluno.id) selo = '<span class="selo-capitao-inline" style="margin-left:0;">🥇 Campeão — Representante da turma</span>';
        else if(h.chaveamento.viceAlunoId === aluno.id) selo = '<span class="selo-capitao-inline" style="margin-left:0;">🥈 Vice-campeão</span>';
        return `
          <div class="linha-lista" style="flex-direction:column; align-items:stretch;">
            <span class="principal">🎲 ${h.modalidade ? h.modalidade.nome : ''} — ${nomeExibidoTurma(h.chaveamento.turmaId)}</span>
            ${linhasFase}
            ${selo ? `<div style="margin-top:6px;">${selo}</div>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="secao-titulo">🎲 Chaveamentos</div>
        <div class="bloco">${blocos}</div>
      `;
    })()}

    ${(() => {
      const historicoJiba = DB.jibaDoAluno(aluno.id);
      if(!historicoJiba.length) return '';
      const blocos = historicoJiba.map(h => {
        const linhasFase = h.confrontos.map(c => {
          if(c.tipoResultado === 'bye'){
            return `<div class="secundario">${c.fase}: ⭐ avanço automático (BYE)</div>`;
          }
          if(!c.vencedorAlunoId){
            return `<div class="secundario">${c.fase}: ⏳ ainda não jogou</div>`;
          }
          const venceu = c.vencedorAlunoId === aluno.id;
          const oponenteId = c.alunoAId === aluno.id ? c.alunoBId : c.alunoAId;
          const oponente = oponenteId ? DB.getAluno(oponenteId) : null;
          const turmaOponente = oponenteId ? (c.alunoAId === aluno.id ? c.turmaBId : c.turmaAId) : null;
          return `<div class="secundario">${c.fase}: ${venceu ? '✅ venceu' : '❌ perdeu para'} ${oponente ? oponente.nome : ''}${turmaOponente ? ' — ' + nomeExibidoTurma(turmaOponente) : ''}</div>`;
        }).join('');
        let selo = '';
        if(h.finalJiba.campeaoAlunoId === aluno.id) selo = '<span class="selo-capitao-inline" style="margin-left:0;">🥇 Campeão do JIBA</span>';
        else if(h.finalJiba.viceAlunoId === aluno.id) selo = '<span class="selo-capitao-inline" style="margin-left:0;">🥈 Vice-campeão do JIBA</span>';
        else if(h.finalJiba.terceiroAlunoId === aluno.id) selo = '<span class="selo-capitao-inline" style="margin-left:0;">🥉 3º lugar do JIBA</span>';
        return `
          <div class="linha-lista" style="flex-direction:column; align-items:stretch;">
            <span class="principal">🏆 ${h.modalidade ? h.modalidade.nome : ''}</span>
            <span class="secundario">Representou: ${nomeExibidoTurma(h.turmaId)}</span>
            ${linhasFase}
            ${selo ? `<div style="margin-top:6px;">${selo}</div>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="secao-titulo">🏆 JIBA</div>
        <div class="bloco">${blocos}</div>
      `;
    })()}
  `;
}

function ligarEventosFichaAluno(turmaId, alunoId){
  const form = document.getElementById('formInscricoes');
  if(!form) return;

  form.querySelectorAll('input[type="checkbox"]').forEach(chk => {
    chk.addEventListener('change', () => {
      chk.closest('.item-checkbox-modalidade').classList.toggle('marcado', chk.checked);
    });
  });

  // Melhoria de usabilidade: marcar/desmarcar tudo de uma vez, para depois
  // o professor só desmarcar manualmente as exceções. Isso só mexe nos
  // checkboxes em tela -- a gravação continua sendo feita pelo MESMO botão
  // "Salvar inscrições" de sempre, via DB.definirInscricoesDoAluno.
  const btnMarcarTodas = document.getElementById('btnMarcarTodasModalidades');
  if(btnMarcarTodas){
    btnMarcarTodas.addEventListener('click', () => {
      form.querySelectorAll('input[type="checkbox"]').forEach(chk => {
        chk.checked = true;
        chk.closest('.item-checkbox-modalidade').classList.add('marcado');
      });
    });
  }
  const btnDesmarcarTodas = document.getElementById('btnDesmarcarTodasModalidades');
  if(btnDesmarcarTodas){
    btnDesmarcarTodas.addEventListener('click', () => {
      form.querySelectorAll('input[type="checkbox"]').forEach(chk => {
        chk.checked = false;
        chk.closest('.item-checkbox-modalidade').classList.remove('marcado');
      });
    });
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const selecionadas = Array.from(form.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
    const btn = form.querySelector('button[type="submit"]');
    const ok = await executarComFeedback(btn, 'Salvando...', () => DB.definirInscricoesDoAluno(alunoId, selecionadas));
    if(!ok) return;
    mostrarToast('Inscrições salvas.');
  });
}

function ligarEventosVerPorModalidade(turmaId, modalidadeId){
  const container = document.getElementById('listaAlunosModalidade');
  if(!container) return;
  container.addEventListener('change', async e => {
    const chk = e.target;
    if(chk.dataset.acao !== 'toggle-inscricao') return;
    chk.disabled = true;
    try {
      await DB.alternarInscricao(chk.dataset.alunoId, modalidadeId);
      chk.closest('.item-checkbox-modalidade').classList.toggle('marcado', chk.checked);
      const total = DB.contarInscritosModalidadeNaTurma(turmaId, modalidadeId);
      const elContagem = document.getElementById('contagemModalidade');
      if(elContagem) elContagem.textContent = `${total} inscrito${total === 1 ? '' : 's'}`;
    } catch(err){
      console.error('Erro ao salvar inscrição:', err);
      alert('Não foi possível salvar. Verifique sua conexão e tente novamente.');
      chk.checked = !chk.checked;
    } finally {
      chk.disabled = false;
    }
  });
}

const ICONES_MODALIDADE = {
  'Tênis de Mesa':'🏓', 'Xadrez':'♟️', 'Dama':'🔴', 'Cubo Mágico':'🧩',
  'Futmesa':'⚽', 'Totó/Pebolim':'🎮',
  'Futsal':'⚽', 'Dodgeball':'🤾', 'Pique-bandeirinha':'🚩',
  'Acerte os Cones':'🎯', 'Corrida da Cestinha':'🧺', 'Revezamento':'🏃',
  'Vôlei':'🏐'
};
function iconeModalidade(nome){ return ICONES_MODALIDADE[nome] || '🏅'; }

const OPCOES_STATUS_SELETIVA = [
  { v:'Aguardando', label:'⏳ Aguardando' },
  { v:'Classificado', label:'✅ Classificado' },
  { v:'Reserva', label:'🟡 Reserva' },
  { v:'Não classificado', label:'❌ Não classificado' },
  { v:'Não compareceu', label:'⚪ Não compareceu' },
  { v:'Desistiu', label:'🚫 Desistiu' },
];
function classeStatusSeletiva(status){
  switch(status){
    case 'Classificado': return 'st-classificado';
    case 'Reserva': return 'st-reserva';
    case 'Não classificado': return 'st-nao-classificado';
    case 'Não compareceu': return 'st-nao-compareceu';
    case 'Desistiu': return 'st-desistiu';
    default: return '';
  }
}
function iconeStatusSeletiva(status){
  const opt = OPCOES_STATUS_SELETIVA.find(o => o.v === status);
  return opt ? opt.label : status;
}
function nomeExibidoTurma(turmaId){
  const t = DB.getTurmas().find(t => t.id === turmaId);
  if(!t) return '—';
  const s = DB.getSeries().find(s => s.id === t.serieId);
  return `${s ? s.nome : '—'} ${t.turma}`;
}
// Bloco 2: mesma ideia de nomeExibidoTurma, mas também reconhece um
// chaveamento criado a partir de um agrupamento (turmaId fica null
// nesse caso -- ver DB.montarChaveamento).
function rotuloContextoChaveamento(c){
  if(c.agrupamentoId){
    const agrupamento = DB.getAgrupamento(c.agrupamentoId);
    return agrupamento ? `🔗 ${agrupamento.nome}` : '—';
  }
  return nomeExibidoTurma(c.turmaId);
}

function renderAreaResultadoFase(seletiva, serieId, turmaId, modalidadeId, categoria){
  const area = document.getElementById('areaResultadoFase');
  if(!area) return;
  if(seletiva.status !== 'Concluída' || !turmaId){
    area.innerHTML = '';
    return;
  }
  const turma = DB.getTurmas().find(t => t.id === turmaId);
  const grupos = DB.agruparResultadoSeletiva(seletiva.id, turmaId);
  const jaTemChaveamento = DB.getChaveamentosPorContexto(turmaId, modalidadeId, categoria).length > 0;

  function linha(l){ return `<li>${l.aluno.nome}</li>`; }

  area.innerHTML = `
    <div class="secao-titulo">📋 Resultado da seletiva — ${turma ? turma.turma : ''}</div>
    <div class="bloco">
      <div style="margin-bottom:16px;">
        <div style="font-weight:700; color:var(--verde-campo); margin-bottom:6px;">🟢 Classificados (${grupos.classificados.length})</div>
        <ol class="lista-numerada">${grupos.classificados.length ? grupos.classificados.map(linha).join('') : '<li style="color:var(--texto-suave);">Ninguém classificado ainda.</li>'}</ol>
      </div>
      <div style="margin-bottom:16px;">
        <div style="font-weight:700; color:#B23A3A; margin-bottom:6px;">🔴 Não classificados (${grupos.naoClassificados.length})</div>
        <ol class="lista-numerada">${grupos.naoClassificados.length ? grupos.naoClassificados.map(linha).join('') : '<li style="color:var(--texto-suave);">Nenhum.</li>'}</ol>
      </div>
      <div>
        <div style="font-weight:700; color:#8A6B14; margin-bottom:6px;">🟡 Reservas (${grupos.reservas.length})</div>
        <ol class="lista-numerada">${grupos.reservas.length ? grupos.reservas.map(linha).join('') : '<li style="color:var(--texto-suave);">Nenhuma.</li>'}</ol>
      </div>
    </div>
    ${jaTemChaveamento ? '<p style="font-size:12.5px; color:var(--texto-suave); padding:0 4px;">⚠️ Já existe um chaveamento para esta turma/modalidade/categoria.</p>' : ''}
    <div style="display:flex; flex-direction:column; gap:10px; margin:10px 0 22px;">
      <button class="botao botao-primario" id="btnGerarFasePrincipal" type="button" ${grupos.classificados.length < 2 ? 'disabled title="É preciso pelo menos 2 classificados"' : ''}>🏆 Gerar fase principal</button>
      <button class="botao botao-secundario" id="btnGerarRepescagem" type="button" ${(grupos.reservas.length + grupos.naoClassificados.length) < 2 ? 'disabled title="É preciso pelo menos 2 alunos entre reservas/não classificados"' : ''}>🔁 Gerar repescagem</button>
    </div>
  `;

  const btnPrincipal = document.getElementById('btnGerarFasePrincipal');
  if(btnPrincipal){
    btnPrincipal.addEventListener('click', () => {
      location.hash = `#/seletivas/fase/${serieId}/${turmaId}/${modalidadeId}/${categoria}/principal`;
    });
  }
  const btnRepescagem = document.getElementById('btnGerarRepescagem');

function renderContadoresSeletiva(seletivaId, vagas){
  const container = document.getElementById('contadoresSeletiva');
  const progresso = document.getElementById('progressoVagas');
  if(!container) return;
  const participacoes = DB.getParticipacoes(seletivaId);
  const dados = [
    { valor: participacoes.length, rotulo:'Inscritos' },
    { valor: participacoes.filter(p => p.presente).length, rotulo:'Presentes' },
    { valor: participacoes.filter(p => p.status === 'Classificado').length, rotulo:'Classificados' },
    { valor: participacoes.filter(p => p.status === 'Reserva').length, rotulo:'Reservas' },
    { valor: participacoes.filter(p => p.status === 'Não classificado').length, rotulo:'Não classif.' },
    { valor: participacoes.filter(p => p.status === 'Não compareceu').length, rotulo:'Ausentes' },
  ];
  container.innerHTML = dados.map(d => `
    <div class="cartao-estatistica">
      <div class="valor">${d.valor}</div>
      <div class="rotulo">${d.rotulo}</div>
    </div>
  `).join('');

  if(progresso){
    const classificados = participacoes.filter(p => p.status === 'Classificado').length;
    progresso.textContent = vagas > 0
      ? `${classificados} / ${vagas} classificados`
      : `${classificados} classificados (vagas ilimitadas)`;
  }
}

function renderListasClassificadosReservas(seletivaId){
  const elClass = document.getElementById('listaClassificados');
  const elReserva = document.getElementById('listaReservas');
  if(!elClass || !elReserva) return;

  function linha(p){
    const aluno = DB.getAluno(p.alunoId);
    if(!aluno) return '';
    return `<li>${p.colocacao ? `<span class="numero">${p.colocacao}</span>` : '<span class="numero">•</span>'} ${aluno.nome} — ${nomeExibidoTurma(aluno.turmaId)}</li>`;
  }

  const participacoes = DB.getParticipacoes(seletivaId);
  const classificados = participacoes.filter(p => p.status === 'Classificado');
  const reservas = participacoes.filter(p => p.status === 'Reserva');

  elClass.innerHTML = classificados.length ? classificados.map(linha).join('') : '<li style="color:var(--texto-suave);">Nenhum classificado ainda.</li>';
  elReserva.innerHTML = reservas.length ? reservas.map(linha).join('') : '<li style="color:var(--texto-suave);">Nenhuma reserva ainda.</li>';
}

function renderListaAlunosSeletiva(seletivaId, modalidadeId, serieId, categoria){
  const container = document.getElementById('listaAlunosSeletiva');
  if(!container) return;

  const filtroTurma = document.getElementById('filtroTurma')?.value || '';
  const filtroStatus = document.getElementById('filtroStatus')?.value || '';
  const ordenarPor = document.getElementById('ordenarPor')?.value || 'nome';

  let linhas = DB.getParticipacoes(seletivaId).map(p => ({ p, aluno: DB.getAluno(p.alunoId) })).filter(l => l.aluno);

  if(filtroTurma) linhas = linhas.filter(l => l.aluno.turmaId === filtroTurma);
  if(filtroStatus) linhas = linhas.filter(l => l.p.status === filtroStatus);

  linhas.sort((a, b) => {
    if(ordenarPor === 'turma') return nomeExibidoTurma(a.aluno.turmaId).localeCompare(nomeExibidoTurma(b.aluno.turmaId), 'pt-BR');
    if(ordenarPor === 'colocacao') return (a.p.colocacao || 'zzz').localeCompare(b.p.colocacao || 'zzz', 'pt-BR', { numeric:true });
    if(ordenarPor === 'status') return a.p.status.localeCompare(b.p.status, 'pt-BR');
    return a.aluno.nome.localeCompare(b.aluno.nome, 'pt-BR');
  });

  if(!linhas.length){
    container.innerHTML = '<p style="color:var(--texto-suave); font-size:14px; text-align:center; padding:20px 0;">Nenhum aluno encontrado com os filtros atuais.</p>';
    return;
  }

  container.innerHTML = linhas.map(({p, aluno}) => `
    <div class="cartao-aluno-seletiva" data-id="${p.id}">
      <div class="topo-aluno-sel">
        <div>
          <div class="nome-aluno-sel">${aluno.nome}</div>
          <div class="turma-aluno-sel">${nomeExibidoTurma(aluno.turmaId)}</div>
        </div>
      </div>
      <div class="linha-rapida-sel">
        <label><input type="checkbox" data-acao="presenca" data-id="${p.id}" ${p.presente ? 'checked' : ''}> Presente</label>
      </div>
      <div class="campo" style="margin-bottom:8px;">
        <div class="grupo-status-simples" data-id="${p.id}">
          <button type="button" class="botao-status-simples ${p.status === 'Aguardando' ? 'ativo st-aguardando' : ''}" data-acao="status-simples" data-status="Aguardando" data-id="${p.id}">⏳ Aguardando</button>
          <button type="button" class="botao-status-simples ${p.status === 'Classificado' ? 'ativo st-passou' : ''}" data-acao="status-simples" data-status="Classificado" data-id="${p.id}">🟢 PASSOU</button>
          <button type="button" class="botao-status-simples ${p.status === 'Não classificado' ? 'ativo st-nao-passou' : ''}" data-acao="status-simples" data-status="Não classificado" data-id="${p.id}">🔴 NÃO PASSOU</button>
        </div>
      </div>
      <div class="grade-campos-sel">
        <div class="campo">
          <label>Colocação</label>
          <input type="text" data-acao="colocacao" data-id="${p.id}" value="${p.colocacao || ''}" placeholder="Ex: 1º">
        </div>
      </div>
      <button type="button" class="botao-detalhes-sel" data-acao="expandir-detalhes" data-id="${p.id}">▾ Resultado e observação</button>
      <div class="grade-campos-sel" id="detalhes-${p.id}" style="display:none; margin-top:8px;">
        <div class="campo">
          <label>Resultado</label>
          <input type="text" data-acao="resultado" data-id="${p.id}" value="${p.resultado || ''}">
        </div>
        <div class="campo">
          <label>Observação</label>
          <input type="text" data-acao="observacao" data-id="${p.id}" value="${p.observacao || ''}">
        </div>
      </div>
    </div>
  `).join('');
}

function ligarEventosSeletivaDetalhe(modalidadeId, serieId, categoria, turmaId){
  // Já garantida pelo roteador (DB.garantirSeletivaEParticipacoes) antes de
  // chegar aqui -- leitura síncrona do cache local.
  const seletiva = DB.getSeletiva(modalidadeId, serieId, categoria);
  const seletivaId = seletiva.id;

  function atualizarTudo(){
    const atual = DB.getSeletiva(modalidadeId, serieId, categoria);
    renderContadoresSeletiva(seletivaId, atual.vagas);
    renderListasClassificadosReservas(seletivaId);
    renderAreaResultadoFase(atual, serieId, turmaId, modalidadeId, categoria);
  }

  renderListaAlunosSeletiva(seletivaId, modalidadeId, serieId, categoria);
  atualizarTudo();

  document.getElementById('btnAlternarFiltros').addEventListener('click', () => {
    document.getElementById('painelFiltros').classList.toggle('aberto');
  });

  ['filtroTurma','filtroStatus','ordenarPor'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      renderListaAlunosSeletiva(seletivaId, modalidadeId, serieId, categoria);
    });
  });

  document.getElementById('btnSalvarVagas').addEventListener('click', async () => {
    const vagas = Math.max(0, parseInt(document.getElementById('inputVagas').value, 10) || 0);
    const btn = document.getElementById('btnSalvarVagas');
    const ok = await executarComFeedback(btn, '...', () => DB.atualizarSeletiva(seletivaId, { vagas }));
    if(!ok) return;
    atualizarTudo();
    mostrarToast('Vagas atualizadas.');
  });

  document.getElementById('btnFinalizarSeletiva').addEventListener('click', async () => {
    const atual = DB.getSeletiva(modalidadeId, serieId, categoria);
    const vaiFinalizar = atual.status !== 'Concluída';
    const confirmado = confirm(vaiFinalizar ? 'Deseja finalizar esta seletiva?' : 'Deseja reabrir esta seletiva?');
    if(!confirmado) return;
    const btn = document.getElementById('btnFinalizarSeletiva');
    const ok = await executarComFeedback(btn, '...', () => DB.atualizarSeletiva(seletivaId, { status: vaiFinalizar ? 'Concluída' : 'Pendente' }));
    if(!ok) return;
    const badge = document.getElementById('badgeStatusSeletiva');
    if(vaiFinalizar){
      badge.textContent = '✅ Concluída';
      badge.className = 'selo-status-seletiva selo-concluida';
      btn.textContent = '↩️ Reabrir seletiva';
      btn.classList.remove('botao-primario');
      btn.classList.add('botao-secundario');
    } else {
      badge.textContent = '⏳ Pendente';
      badge.className = 'selo-status-seletiva selo-pendente';
      btn.textContent = '✅ Finalizar seletiva';
      btn.classList.remove('botao-secundario');
      btn.classList.add('botao-primario');
    }
    mostrarToast(vaiFinalizar ? 'Seletiva finalizada.' : 'Seletiva reaberta.');
  });

  document.getElementById('btnSalvarSeletiva').addEventListener('click', () => {
    renderListaAlunosSeletiva(seletivaId, modalidadeId, serieId, categoria);
    atualizarTudo();
    mostrarToast('Seletiva salva.');
  });

  const listaEl = document.getElementById('listaAlunosSeletiva');

  listaEl.addEventListener('click', e => {
    const btn = e.target.closest('button[data-acao="expandir-detalhes"]');
    if(!btn) return;
    const painel = document.getElementById(`detalhes-${btn.dataset.id}`);
    if(painel) painel.style.display = painel.style.display === 'none' ? 'grid' : 'none';
  });

  listaEl.addEventListener('change', async e => {
    const alvo = e.target;
    const acao = alvo.dataset.acao;
    const participacaoId = alvo.dataset.id;
    if(!acao || !participacaoId) return;

    if(acao === 'presenca'){
      alvo.disabled = true;
      try {
        await DB.atualizarParticipacao(participacaoId, { presente: alvo.checked });
        atualizarTudo();
      } catch(err){
        console.error('Erro ao salvar presença:', err);
        alert('Não foi possível salvar. Verifique sua conexão e tente novamente.');
        alvo.checked = !alvo.checked;
      } finally {
        alvo.disabled = false;
      }
    }

    if(['colocacao','resultado','observacao'].includes(acao)){
      try {
        await DB.atualizarParticipacao(participacaoId, { [acao]: alvo.value.trim() });
        if(acao === 'colocacao') renderListasClassificadosReservas(seletivaId);
      } catch(err){
        console.error('Erro ao salvar:', err);
        alert('Não foi possível salvar. Verifique sua conexão e tente novamente.');
      }
    }
  });

  // Simplificação da operação (Bloco 1): 3 botões rápidos em vez do
  // <select> técnico de 6 opções. Continua gravando exatamente os
  // mesmos valores já existentes em participacoes_seletiva.status
  // ("Classificado"/"Não classificado"/"Aguardando") via
  // DB.atualizarParticipacao, sem nenhuma alteração na função em si --
  // só a forma de escolher na tela mudou. "Reserva" e "Não compareceu"
  // continuam existindo no banco e nos relatórios/filtros; só saíram
  // dos botões rápidos da operação do dia a dia.
  listaEl.addEventListener('click', async e => {
    const btn = e.target.closest('button[data-acao="status-simples"]');
    if(!btn) return;
    const participacaoId = btn.dataset.id;
    const novoStatus = btn.dataset.status;
    const grupo = btn.closest('.grupo-status-simples');

    if(novoStatus === 'Classificado'){
      const atual = DB.getSeletiva(modalidadeId, serieId, categoria);
      if(atual.vagas > 0){
        const jaClassificados = DB.contarClassificados(seletivaId, participacaoId);
        if(jaClassificados >= atual.vagas){
          const confirmaMesmoAssim = confirm('⚠️ Limite de vagas atingido.\n\nMarcar mesmo assim como PASSOU?');
          if(!confirmaMesmoAssim) return;
        }
      }
    }

    grupo.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      await DB.atualizarParticipacao(participacaoId, { status: novoStatus });
      grupo.querySelectorAll('button').forEach(b => b.classList.remove('ativo', 'st-aguardando', 'st-passou', 'st-nao-passou'));
      const classeAtiva = novoStatus === 'Classificado' ? 'st-passou' : (novoStatus === 'Não classificado' ? 'st-nao-passou' : 'st-aguardando');
      btn.classList.add('ativo', classeAtiva);
      atualizarTudo();
    } catch(err){
      console.error('Erro ao salvar status:', err);
      alert('Não foi possível salvar. Verifique sua conexão e tente novamente.');
    } finally {
      grupo.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  });
}

const OPCOES_STATUS_EQUIPE = [

  switch(status){
    case 'Titular/Selecionado': return 'st-selecionado';

    case 'Não selecionado': return 'st-nao-classificado';
    case 'Desistiu': return 'st-desistiu';
    case 'Não compareceu': return 'st-nao-compareceu';

      <h4 style="font-family:'Oswald',sans-serif; font-size:14px; margin:16px 0 8px;">RESERVAS</h4>

function renderContadoresEquipe(equipeId, equipe){
  const container = document.getElementById('contadoresEquipe');
  const progresso = document.getElementById('progressoLimites');
  if(!container) return;
  const participacoes = DB.getParticipacoesEquipe(equipeId);
  const selecionados = participacoes.filter(p => p.status === 'Titular/Selecionado').length;
  const reservas = participacoes.filter(p => p.status === 'Reserva').length;
  const dados = [
    { valor: participacoes.length, rotulo:'Inscritos' },
    { valor: selecionados, rotulo:'Selecionados' },
    { valor: reservas, rotulo:'Reservas' },
    { valor: participacoes.filter(p => p.status === 'Não selecionado').length, rotulo:'Não selec.' },
    { valor: participacoes.filter(p => p.status === 'Aguardando definição').length, rotulo:'Aguardando' },
  ];
  container.innerHTML = dados.map(d => `
    <div class="cartao-estatistica">
      <div class="valor">${d.valor}</div>
      <div class="rotulo">${d.rotulo}</div>
    </div>
  `).join('');

  if(progresso){
    const textoSel = equipe.limiteSelecionados > 0 ? `Selecionados: ${selecionados} / ${equipe.limiteSelecionados}` : `Selecionados: ${selecionados} (sem limite)`;
    const textoRes = equipe.limiteReservas > 0 ? `Reservas: ${reservas} / ${equipe.limiteReservas}` : `Reservas: ${reservas} (sem limite)`;
    progresso.textContent = `${textoSel} · ${textoRes}`;
  }

  const composicao = document.getElementById('composicaoAtualMista');
  if(composicao){
    const alunosSelecionadosIds = new Set(participacoes.filter(p => p.status === 'Titular/Selecionado').map(p => p.alunoId));
    const alunos = DB.getAlunos().filter(a => alunosSelecionadosIds.has(a.id));
    const meninos = alunos.filter(a => a.sexo === 'Masculino').length;
    const meninas = alunos.filter(a => a.sexo === 'Feminino').length;
    composicao.textContent = `Selecionados hoje: ${meninos} meninos, ${meninas} meninas.`;
  }
}

function renderEquipeMontada(equipeId){
  const elSel = document.getElementById('listaSelecionadosEquipe');
  const elRes = document.getElementById('listaReservasEquipe');
  if(!elSel || !elRes) return;

  function linha(p){
    const aluno = DB.getAluno(p.alunoId);
    if(!aluno) return '';
    return `<li><span class="numero">•</span> ${aluno.nome}${p.posicao ? ' — ' + p.posicao : ''}${p.capitao ? '<span class="selo-capitao-inline">⭐ Capitão</span>' : ''}</li>`;
  }

  const participacoes = DB.getParticipacoesEquipe(equipeId);
  const selecionados = participacoes.filter(p => p.status === 'Titular/Selecionado');
  const reservas = participacoes.filter(p => p.status === 'Reserva');

  elSel.innerHTML = selecionados.length ? selecionados.map(linha).join('') : '<li style="color:var(--texto-suave);">Nenhum selecionado ainda.</li>';
  elRes.innerHTML = reservas.length ? reservas.map(linha).join('') : '<li style="color:var(--texto-suave);">Nenhuma reserva ainda.</li>';
}

function renderListaAlunosEquipe(equipeId, modalidadeId){
  const container = document.getElementById('listaAlunosEquipe');
  if(!container) return;
  const modalidade = DB.getModalidades().find(m => m.id === modalidadeId);
  const sugestoes = sugestoesPosicao(modalidade ? modalidade.nome : '');

  const termoBusca = (document.getElementById('buscaAlunoEquipe')?.value || '').trim().toLowerCase();
  const filtroStatus = document.getElementById('filtroStatusEquipe')?.value || '';

  let linhas = DB.getParticipacoesEquipe(equipeId).map(p => ({ p, aluno: DB.getAluno(p.alunoId) })).filter(l => l.aluno);
  if(termoBusca) linhas = linhas.filter(l => l.aluno.nome.toLowerCase().includes(termoBusca));
  if(filtroStatus) linhas = linhas.filter(l => l.p.status === filtroStatus);
  linhas.sort((a, b) => a.aluno.nome.localeCompare(b.aluno.nome, 'pt-BR'));

  if(!linhas.length){
    container.innerHTML = '<p style="color:var(--texto-suave); font-size:14px; text-align:center; padding:20px 0;">Nenhum aluno encontrado com os filtros atuais.</p>';
    return;
  }

  const datalistId = `sugestoes-posicao-${modalidadeId}`;

  container.innerHTML = `
    <datalist id="${datalistId}">
      ${sugestoes.map(s => `<option value="${s}"></option>`).join('')}
    </datalist>
    ${linhas.map(({p, aluno}) => `
      <div class="cartao-aluno-seletiva" data-id="${p.id}">
        <div class="topo-aluno-sel">
          <div>
            <div class="nome-aluno-sel">${aluno.nome} <span class="selo-sexo">${aluno.sexo}</span></div>
          </div>
          <button type="button" class="botao-capitao ${p.capitao ? 'marcado' : ''}" data-acao="capitao" data-id="${p.id}">

        <div class="campo" style="margin-bottom:8px;">

            ${OPCOES_STATUS_EQUIPE.map(o => `<option value="${o.v}" ${p.status === o.v ? 'selected' : ''}>${o.label}</option>`).join('')}
          </select>

          </div>

function ligarEventosEquipeDetalhe(serieId, turmaId, modalidadeId){
  const equipe = DB.obterOuCriarEquipe(turmaId, modalidadeId);
  const equipeId = equipe.id;

  function atualizarTudo(){
    const atual = DB.getEquipe(turmaId, modalidadeId);
    renderContadoresEquipe(equipeId, atual);
    renderEquipeMontada(equipeId);
  }

  renderListaAlunosEquipe(equipeId, modalidadeId);
  atualizarTudo();

  document.getElementById('btnAlternarFiltrosEquipe').addEventListener('click', () => {
    document.getElementById('painelFiltrosEquipe').classList.toggle('aberto');
  });
  document.getElementById('buscaAlunoEquipe').addEventListener('input', () => {
    renderListaAlunosEquipe(equipeId, modalidadeId);
  });
  document.getElementById('filtroStatusEquipe').addEventListener('change', () => {
    renderListaAlunosEquipe(equipeId, modalidadeId);
  });

  document.getElementById('btnSalvarLimites').addEventListener('click', () => {
    const limiteSelecionados = Math.max(0, parseInt(document.getElementById('inputLimiteSelecionados').value, 10) || 0);
    const limiteReservas = Math.max(0, parseInt(document.getElementById('inputLimiteReservas').value, 10) || 0);
    DB.atualizarEquipe(equipeId, { limiteSelecionados, limiteReservas });
    atualizarTudo();
    mostrarToast('Limites atualizados.');
  });

  const btnRegraMista = document.getElementById('btnSalvarRegraMista');
  if(btnRegraMista){
    btnRegraMista.addEventListener('click', () => {
      const regraMista = {
        ativa: document.getElementById('regraMistaAtiva').checked,
        minMeninos: Math.max(0, parseInt(document.getElementById('regraMinMeninos').value, 10) || 0),
        minMeninas: Math.max(0, parseInt(document.getElementById('regraMinMeninas').value, 10) || 0),
      };
      DB.atualizarEquipe(equipeId, { regraMista });
      atualizarTudo();
      mostrarToast('Regra de composição salva.');
    });
  }

  document.getElementById('btnFinalizarEquipe').addEventListener('click', () => {
    const atual = DB.getEquipe(turmaId, modalidadeId);
    const vaiFinalizar = atual.status !== 'Finalizada';
    const confirmado = confirm(vaiFinalizar ? 'Deseja finalizar esta equipe?' : 'Deseja reabrir esta equipe?');
    if(!confirmado) return;
    DB.atualizarEquipe(equipeId, { status: vaiFinalizar ? 'Finalizada' : 'Em montagem' });
    const badge = document.getElementById('badgeStatusEquipe');
    const btn = document.getElementById('btnFinalizarEquipe');
    if(vaiFinalizar){
      badge.textContent = '✅ Finalizada';
      badge.className = 'selo-status-seletiva selo-concluida';
      btn.textContent = '🔓 Reabrir equipe';
      btn.classList.remove('botao-primario'); btn.classList.add('botao-secundario');
    } else {
      badge.textContent = '⏳ Em montagem';
      badge.className = 'selo-status-seletiva selo-pendente';
      btn.textContent = '✅ Finalizar equipe';
      btn.classList.remove('botao-secundario'); btn.classList.add('botao-primario');
    }
    mostrarToast(vaiFinalizar ? 'Equipe finalizada.' : 'Equipe reaberta.');
  });

  document.getElementById('btnSalvarEquipe').addEventListener('click', () => {
    renderListaAlunosEquipe(equipeId, modalidadeId);
    atualizarTudo();
    mostrarToast('Equipe salva.');
  });

  const listaEl = document.getElementById('listaAlunosEquipe');

  listaEl.addEventListener('click', e => {
    const btnCapitao = e.target.closest('button[data-acao="capitao"]');
    if(btnCapitao){
      const participacaoId = btnCapitao.dataset.id;
      const atual = DB.getParticipacoesEquipe(equipeId).find(p => p.id === participacaoId);
      if(atual.capitao){
        DB.atualizarParticipacaoEquipe(participacaoId, { capitao:false });
      } else {
        const capitaoExistente = DB.getCapitaoEquipe(equipeId);
        if(capitaoExistente && capitaoExistente.id !== participacaoId){
          const substituir = confirm('Já existe um capitão nesta equipe. Deseja substituir?');
          if(!substituir) return;
          DB.atualizarParticipacaoEquipe(capitaoExistente.id, { capitao:false });
        }
        DB.atualizarParticipacaoEquipe(participacaoId, { capitao:true });
      }
      renderListaAlunosEquipe(equipeId, modalidadeId);
      renderEquipeMontada(equipeId);
      return;
    }

    const btnRemover = e.target.closest('button[data-acao="remover-equipe"]');
    if(btnRemover){
      const participacaoId = btnRemover.dataset.id;
      const aluno = DB.getAluno(DB.getParticipacoesEquipe(equipeId).find(p => p.id === participacaoId).alunoId);
      const confirmado = confirm(`Remover ${aluno ? aluno.nome : 'este aluno'} da equipe? A inscrição na modalidade não será apagada.`);
      if(!confirmado) return;
      DB.removerAlunoDaEquipe(participacaoId);
      renderListaAlunosEquipe(equipeId, modalidadeId);
      atualizarTudo();
      mostrarToast('Aluno removido da equipe.');
    }
  });

  listaEl.addEventListener('change', e => {
    const alvo = e.target;
    const acao = alvo.dataset.acao;
    const participacaoId = alvo.dataset.id;
    if(!acao || !participacaoId) return;

    if(acao === 'status'){
      const participacaoAtual = DB.getParticipacoesEquipe(equipeId).find(p => p.id === participacaoId);
      let novoStatus = alvo.value;

      if(novoStatus === 'Titular/Selecionado'){
        const atual = DB.getEquipe(turmaId, modalidadeId);
        if(atual.limiteSelecionados > 0){
          const jaSelecionados = DB.contarSelecionadosEquipe(equipeId, participacaoId);
          if(jaSelecionados >= atual.limiteSelecionados){
            const aceitaReserva = confirm('⚠️ Limite de jogadores atingido.\n\nDeseja colocar este aluno como reserva?');
            if(aceitaReserva){
              novoStatus = 'Reserva';
            } else {
              alvo.value = participacaoAtual.status;
              return;
            }
          }
        }
      } else if(novoStatus === 'Reserva'){
        const atual = DB.getEquipe(turmaId, modalidadeId);
        if(atual.limiteReservas > 0){
          const jaReservas = DB.contarReservasEquipe(equipeId, participacaoId);
          if(jaReservas >= atual.limiteReservas){
            alert('⚠️ Limite de jogadores atingido.\n\nO número máximo de reservas já foi alcançado.');
            alvo.value = participacaoAtual.status;
            return;
          }
        }
      }

      DB.atualizarParticipacaoEquipe(participacaoId, { status: novoStatus });
      alvo.value = novoStatus;
      alvo.className = `select-status ${classeStatusEquipe(novoStatus)}`;
      atualizarTudo();
    }

    if(acao === 'posicao'){
      DB.atualizarParticipacaoEquipe(participacaoId, { posicao: alvo.value.trim() });
      renderEquipeMontada(equipeId);
    }
  });
}

function labelStatusJogo(status){
  if(status === 'Aguardando') return '⏳ Aguardando';
  if(status === 'Em andamento') return '▶️ Em andamento';
  return '✅ Finalizado';
}
function badgeRelativoHtml(jogo, turmaId){
  if(jogo.status !== 'Finalizado') return '';
  if(jogo.resultadoTipo === 'empate') return '<div class="badge-resultado badge-empate">🤝 Empate</div>';
  if(jogo.vencedorTurmaId === turmaId) return '<div class="badge-resultado badge-vitoria">🏆 Vitória</div>';
  return '<div class="badge-resultado badge-derrota">❌ Derrota</div>';
}
function cardJogoHtml(jogo, turmaRef){
  const modalidade = DB.getModalidades().find(m => m.id === jogo.modalidadeId);
  const serie = DB.getSeries().find(s => s.id === jogo.serieId);
  const nomeA = nomeExibidoTurma(jogo.turmaAId);
  const nomeB = nomeExibidoTurma(jogo.turmaBId);

  let placarHtml = '<span class="x-confronto">×</span>';
  let badge = '';
  if(jogo.status === 'Finalizado'){
    placarHtml = `<span class="numero-placar">${jogo.placarA}</span><span class="x-confronto">×</span><span class="numero-placar">${jogo.placarB}</span>`;
    if(turmaRef){
      badge = badgeRelativoHtml(jogo, turmaRef);
    } else if(jogo.resultadoTipo === 'empate'){
      badge = '<div class="badge-resultado badge-empate">🤝 Empate</div>';
    } else {
      const nomeVencedor = jogo.vencedorTurmaId === jogo.turmaAId ? nomeA : nomeB;
      badge = `<div class="badge-resultado badge-vitoria">🏆 ${nomeVencedor}</div>`;
    }
  }

  return `
    <div class="cartao-jogo">
      <div class="cabecalho-jogo">
        <span class="modalidade-jogo">${iconeModalidade(modalidade ? modalidade.nome : '')} ${modalidade ? modalidade.nome : ''} · ${serie ? serie.nome : ''}</span>
        <span class="selo-status-seletiva ${jogo.status === 'Finalizado' ? 'selo-concluida' : 'selo-pendente'}">${labelStatusJogo(jogo.status)}</span>
      </div>
      <div class="placar-confronto">
        <span class="lado-time">${nomeA}</span>
        ${placarHtml}
        <span class="lado-time">${nomeB}</span>
      </div>
      ${badge}
      <a href="#/jogos/${jogo.id}" class="botao botao-secundario" style="display:block; text-align:center; margin-top:12px; text-decoration:none;">${jogo.status === 'Finalizado' ? 'Ver / corrigir' : 'Abrir jogo'}</a>
    </div>
  `;
}

function ligarEventosNovoConfronto(){
  const selSerie = document.getElementById('confSerie');
  const selModalidade = document.getElementById('confModalidade');
  const selTurmaA = document.getElementById('confTurmaA');
  const selTurmaB = document.getElementById('confTurmaB');
  const btnCriar = document.getElementById('btnCriarConfronto');

  function atualizarTurmas(){
    const serieId = selSerie.value;
    const modalidadeId = selModalidade.value;
    if(!serieId || !modalidadeId){
      [selTurmaA, selTurmaB].forEach(sel => {
        sel.innerHTML = '<option value="">Escolha a modalidade primeiro</option>';
        sel.disabled = true;
      });
      btnCriar.disabled = true;
      return;
    }
    const serie = DB.getSeries().find(s => s.id === serieId);
    const turmas = DB.getTurmasAtivasDaSerie(serieId);
    const opcoes = turmas.map(t => `<option value="${t.id}">${serie.nome} ${t.turma}</option>`).join('');
    selTurmaA.innerHTML = '<option value="">Selecione...</option>' + opcoes;
    selTurmaB.innerHTML = '<option value="">Selecione...</option>' + opcoes;
    selTurmaA.disabled = false;
    selTurmaB.disabled = false;
    btnCriar.disabled = false;
  }

  function atualizarModalidades(){
    const serieId = selSerie.value;
    if(!serieId){
      selModalidade.innerHTML = '<option value="">Escolha a série primeiro</option>';
      selModalidade.disabled = true;
      atualizarTurmas();
      return;
    }
    const modalidades = DB.modalidadesColetivasDaSerie(serieId);
    selModalidade.innerHTML = modalidades.length
      ? '<option value="">Selecione...</option>' + modalidades.map(m => `<option value="${m.id}">${iconeModalidade(m.nome)} ${m.nome}</option>`).join('')
      : '<option value="">Nenhuma modalidade coletiva nesta série</option>';
    selModalidade.disabled = !modalidades.length;
    atualizarTurmas();
  }

  selSerie.addEventListener('change', atualizarModalidades);
  selModalidade.addEventListener('change', atualizarTurmas);

  document.getElementById('formNovoConfronto').addEventListener('submit', e => {
    e.preventDefault();
    const serieId = selSerie.value;
    const modalidadeId = selModalidade.value;
    const turmaAId = selTurmaA.value;
    const turmaBId = selTurmaB.value;
    if(!serieId || !modalidadeId || !turmaAId || !turmaBId) return;
    if(turmaAId === turmaBId){
      alert('Uma turma não pode jogar contra ela mesma. Escolha turmas diferentes.');
      return;
    }
    if(DB.existeConfrontoIdentico(modalidadeId, turmaAId, turmaBId)){
      const continuar = confirm('⚠️ Este confronto já existe.\n\nDeseja criar outro jogo entre essas equipes?');
      if(!continuar) return;
    }
    const modalidade = DB.getModalidades().find(m => m.id === modalidadeId);
    const jogo = DB.criarJogo({ serieId, modalidadeId, categoria: modalidade.categoria, turmaAId, turmaBId });
    mostrarToast('Confronto criado.');
    location.hash = `#/jogos/${jogo.id}`;
  });
}

function renderListaJogos(){
  const container = document.getElementById('listaJogosContainer');
  if(!container) return;
  const busca = (document.getElementById('buscaTurmaJogos')?.value || '').trim().toLowerCase();
  const filtroSerie = document.getElementById('filtroSerieJogos')?.value || '';
  const filtroModalidade = document.getElementById('filtroModalidadeJogos')?.value || '';
  const filtroCategoria = document.getElementById('filtroCategoriaJogos')?.value || '';
  const filtroStatus = document.getElementById('filtroStatusJogos')?.value || '';

  let jogos = DB.getJogos();
  if(filtroSerie) jogos = jogos.filter(j => j.serieId === filtroSerie);
  if(filtroModalidade) jogos = jogos.filter(j => j.modalidadeId === filtroModalidade);
  if(filtroCategoria) jogos = jogos.filter(j => j.categoria === filtroCategoria);
  if(filtroStatus) jogos = jogos.filter(j => j.status === filtroStatus);
  if(busca){
    jogos = jogos.filter(j =>
      nomeExibidoTurma(j.turmaAId).toLowerCase().includes(busca) ||
      nomeExibidoTurma(j.turmaBId).toLowerCase().includes(busca)
    );
  }
  jogos = jogos.slice().sort((a, b) => new Date(b.atualizadoEm) - new Date(a.atualizadoEm));

  container.innerHTML = jogos.length
    ? jogos.map(j => cardJogoHtml(j)).join('')
    : '<p style="color:var(--texto-suave); font-size:14px; text-align:center; padding:20px 0;">Nenhum jogo encontrado.</p>';
}

function ligarEventosListaJogos(statusInicial){
  if(statusInicial) document.getElementById('filtroStatusJogos').value = statusInicial;
  renderListaJogos();
  document.getElementById('btnAlternarFiltrosJogos').addEventListener('click', () => {
    document.getElementById('painelFiltrosJogos').classList.toggle('aberto');
  });
  ['buscaTurmaJogos','filtroSerieJogos','filtroModalidadeJogos','filtroCategoriaJogos','filtroStatusJogos'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', renderListaJogos);

  });
}

function telaJogoDetalhe(jogoId){
  const jogo = DB.getJogo(jogoId);

  }
  const modalidade = DB.getModalidades().find(m => m.id === jogo.modalidadeId);
  const serie = DB.getSeries().find(s => s.id === jogo.serieId);
  const nomeA = nomeExibidoTurma(jogo.turmaAId);
  const nomeB = nomeExibidoTurma(jogo.turmaBId);
  const podeEditarPlacar = jogo.status === 'Em andamento';
  const finalizado = jogo.status === 'Finalizado';

  return `
    <button class="botao-voltar" onclick="location.hash='#/jogos/lista'">&larr; Jogos</button>

    <div class="bloco">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <h3>${iconeModalidade(modalidade ? modalidade.nome : '')} ${modalidade ? modalidade.nome : ''}<br><span style="font-size:13px; font-weight:400; color:var(--texto-suave);">${serie ? serie.nome : ''} · ${jogo.categoria}</span></h3>
        <span class="selo-status-seletiva ${finalizado ? 'selo-concluida' : 'selo-pendente'}" id="badgeStatusJogo">${labelStatusJogo(jogo.status)}</span>
      </div>

      <div class="placar-confronto" style="margin-top:16px;">
        <span class="lado-time">${nomeA}</span>
        ${jogo.status !== 'Aguardando'
          ? `<span class="numero-placar">${jogo.placarA ?? 0}</span><span class="x-confronto">×</span><span class="numero-placar">${jogo.placarB ?? 0}</span>`
          : '<span class="x-confronto">×</span>'
        }
        <span class="lado-time">${nomeB}</span>
      </div>

      ${jogo.status === 'Aguardando' ? `
        <button class="botao botao-primario" id="btnIniciarJogo" type="button" style="width:100%; margin-top:14px;">▶️ Iniciar jogo</button>
      ` : ''}

      ${podeEditarPlacar ? `
        <div class="linha-placar-editavel">
          <span class="nome-time-editar">${nomeA}</span>
          <input type="number" min="0" id="inputPlacarA" class="input-placar-grande" style="max-width:90px;" value="${jogo.placarA ?? ''}" placeholder="0">
          <span class="x-confronto">×</span>
          <input type="number" min="0" id="inputPlacarB" class="input-placar-grande" style="max-width:90px;" value="${jogo.placarB ?? ''}" placeholder="0">
          <span class="nome-time-editar">${nomeB}</span>
        </div>
        <div class="preview-vencedor" id="previewVencedor"></div>
        <div class="campo">
          <label for="inputObservacaoJogo">📝 Observação (opcional)</label>
          <input type="text" id="inputObservacaoJogo" value="${jogo.observacao || ''}" placeholder="Ex: Jogo encerrado por tempo.">
        </div>
        <div class="linha-campos" style="max-width:none;">
          <button class="botao botao-secundario" id="btnSalvarResultado" type="button" style="flex:1;">💾 Salvar resultado</button>
          <button class="botao botao-primario" id="btnFinalizarJogo" type="button" style="flex:1;">🏁 Finalizar jogo</button>
        </div>
      ` : ''}

      ${finalizado ? `
        ${jogo.resultadoTipo === 'empate'
          ? '<div class="badge-resultado badge-empate">🤝 EMPATE</div>'
          : `<div class="badge-resultado badge-vitoria">🏆 Vencedor: ${jogo.vencedorTurmaId === jogo.turmaAId ? nomeA : nomeB}</div>`
        }
        ${jogo.observacao ? `<p style="font-size:13.5px; color:var(--texto-suave); margin-top:10px;">📝 ${jogo.observacao}</p>` : ''}
        <button class="botao botao-secundario" id="btnCorrigirResultado" type="button" style="width:100%; margin-top:14px;">✏️ Corrigir resultado</button>
      ` : ''}
    </div>

    <button class="botao-detalhes-sel" id="btnExcluirJogo" type="button" style="color:#B23A3A; text-align:center; width:100%; margin-top:6px;">🗑️ Excluir confronto</button>
  `;
}

function rerenderizarJogoDetalhe(jogoId){
  const app = document.getElementById('app');
  app.innerHTML = telaJogoDetalhe(jogoId);
  ligarEventosJogoDetalhe(jogoId);
  window.scrollTo(0,0);
}

function ligarEventosJogoDetalhe(jogoId){
  function atualizarPreview(){
    const inputA = document.getElementById('inputPlacarA');
    const inputB = document.getElementById('inputPlacarB');
    const preview = document.getElementById('previewVencedor');
    if(!inputA || !inputB || !preview) return;
    const a = parseInt(inputA.value, 10);
    const b = parseInt(inputB.value, 10);
    const jogoAtual = DB.getJogo(jogoId);
    if(isNaN(a) || isNaN(b)){ preview.textContent = ''; return; }
    if(a > b) preview.textContent = `🏆 Vencedor: ${nomeExibidoTurma(jogoAtual.turmaAId)}`;
    else if(b > a) preview.textContent = `🏆 Vencedor: ${nomeExibidoTurma(jogoAtual.turmaBId)}`;
    else preview.textContent = '🤝 Empate';
  }

  const btnIniciar = document.getElementById('btnIniciarJogo');
  if(btnIniciar){
    btnIniciar.addEventListener('click', () => {
      DB.atualizarJogo(jogoId, { status: 'Em andamento' });
      mostrarToast('Jogo iniciado.');
      rerenderizarJogoDetalhe(jogoId);
    });
  }

  const inputA = document.getElementById('inputPlacarA');
  const inputB = document.getElementById('inputPlacarB');
  if(inputA && inputB){
    inputA.addEventListener('input', atualizarPreview);
    inputB.addEventListener('input', atualizarPreview);
    atualizarPreview();
  }

  const btnSalvar = document.getElementById('btnSalvarResultado');
  if(btnSalvar){
    btnSalvar.addEventListener('click', () => {
      const placarA = parseInt(inputA.value, 10);
      const placarB = parseInt(inputB.value, 10);
      const observacao = document.getElementById('inputObservacaoJogo').value.trim();
      DB.atualizarJogo(jogoId, {
        placarA: isNaN(placarA) ? null : placarA,
        placarB: isNaN(placarB) ? null : placarB,
        observacao
      });
      mostrarToast('Resultado salvo.');
    });
  }

  const btnFinalizar = document.getElementById('btnFinalizarJogo');
  if(btnFinalizar){
    btnFinalizar.addEventListener('click', () => {
      const placarA = parseInt(inputA.value, 10);
      const placarB = parseInt(inputB.value, 10);
      if(isNaN(placarA) || isNaN(placarB)){
        alert('Preencha o placar dos dois times antes de finalizar.');
        return;
      }
      const jogoAtual = DB.getJogo(jogoId);
      const nomeA = nomeExibidoTurma(jogoAtual.turmaAId);
      const nomeB = nomeExibidoTurma(jogoAtual.turmaBId);
      const confirmado = confirm(`${nomeA} ${placarA} × ${placarB} ${nomeB}\n\nConfirma este resultado?`);
      if(!confirmado) return;
      const observacao = document.getElementById('inputObservacaoJogo').value.trim();
      const resultado = DB.calcularResultado(placarA, placarB, jogoAtual.turmaAId, jogoAtual.turmaBId);
      DB.atualizarJogo(jogoId, {
        placarA, placarB, observacao, status: 'Finalizado',
        resultadoTipo: resultado.resultadoTipo, vencedorTurmaId: resultado.vencedorTurmaId
      });
      mostrarToast('Jogo finalizado.');
      rerenderizarJogoDetalhe(jogoId);
    });
  }

  const btnCorrigir = document.getElementById('btnCorrigirResultado');
  if(btnCorrigir){
    btnCorrigir.addEventListener('click', () => {
      const confirmado = confirm('Este jogo já foi finalizado. Deseja reabrir para correção?');
      if(!confirmado) return;
      DB.atualizarJogo(jogoId, { status: 'Em andamento' });
      mostrarToast('Jogo reaberto para correção.');
      rerenderizarJogoDetalhe(jogoId);
    });
  }

  const btnExcluir = document.getElementById('btnExcluirJogo');
  btnExcluir.addEventListener('click', () => {
    const confirmado = confirm('⚠️ Deseja realmente excluir este confronto?');
    if(!confirmado) return;
    DB.excluirJogo(jogoId);
    mostrarToast('Confronto excluído.');
    location.hash = '#/jogos/lista';
  });
}

function telaColocacaoColetiva(serieId, modalidadeId, forcarEdicao){
  const serie = DB.getSeries().find(s => s.id === serieId);
  const modalidade = DB.getModalidades().find(m => m.id === modalidadeId);
  if(!serie || !modalidade){
    return `<button class="botao-voltar" onclick="location.hash='#/classificacao/coletivos'">&larr; Coletivos</button>
      <div class="tela-em-breve"><div class="icone-grande">❓</div><h2>Não encontrado</h2></div>`;
  }
  const resultado = DB.obterOuCriarResultadoModalidade(modalidadeId, serieId, '', 'coletiva');
  const turmas = DB.getTurmasAtivasDaSerie(serieId);
  const colocacoesExistentes = DB.getColocacoesDoResultado(resultado.id);
  const mapaExistente = {};
  colocacoesExistentes.forEach(c => { mapaExistente[c.turmaId] = c.posicao; });
  const jogosReferencia = DB.getJogosPorModalidadeSerie(modalidadeId, serieId).filter(j => j.status === 'Finalizado');
  const modoEdicao = forcarEdicao || resultado.status === 'Pendente';

  return `
    <button class="botao-voltar" onclick="location.hash='#/classificacao/coletivos/${serieId}'">&larr; Trocar modalidade</button>
    <div class="bloco">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <h3>${iconeModalidade(modalidade.nome)} ${modalidade.nome}<br><span style="font-size:13px; font-weight:400; color:var(--texto-suave);">${serie.nome}</span></h3>
        <span class="selo-status-seletiva ${resultado.status === 'Lançado' ? 'selo-concluida' : 'selo-pendente'}" id="badgeStatusColocacao">${resultado.status === 'Lançado' ? '✅ Resultado lançado' : '⏳ Pendente'}</span>
      </div>
    </div>

    ${jogosReferencia.length ? `
      <div class="secao-titulo">Jogos realizados (referência)</div>
      <div class="bloco">
        ${jogosReferencia.map(j => `
          <div class="cartao-jogo-referencia">
            <span>${nomeExibidoTurma(j.turmaAId)} ${j.placarA} × ${j.placarB} ${nomeExibidoTurma(j.turmaBId)}</span>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div class="secao-titulo">Colocação final</div>
    <div id="listaColocacaoColetiva">
      ${modoEdicao ? turmas.map(t => `
        <div class="linha-colocacao">
          <span class="nome-time-coloc">${serie.nome} ${t.turma}</span>
          <input type="number" min="1" class="input-posicao" data-turma-id="${t.id}" value="${mapaExistente[t.id] ?? ''}" placeholder="—">
          <span class="pontos-preview" data-preview-turma="${t.id}">${mapaExistente[t.id] ? DB.getPontosPorPosicao(mapaExistente[t.id]) + ' pts' : ''}</span>
        </div>
      `).join('') : Object.entries(mapaExistente).sort((a, b) => a[1] - b[1]).map(([turmaId, pos]) => `
        <div class="linha-colocacao">
          <span class="rotulo-posicao">${pos}º</span>
          <span class="nome-time-coloc">${nomeExibidoTurma(turmaId)}</span>
          <span class="pontos-preview">${DB.getPontosPorPosicao(pos)} pts</span>
        </div>
      `).join('')}
    </div>

    ${modoEdicao
      ? '<button class="botao botao-primario" id="btnSalvarColocacaoColetiva" type="button" style="width:100%; margin-top:10px;">Salvar colocação</button>'
      : '<button class="botao botao-secundario" id="btnCorrigirColocacaoColetiva" type="button" style="width:100%; margin-top:10px;">✏️ Corrigir colocação</button>'
    }
  `;
}

function ligarEventosColocacaoColetiva(serieId, modalidadeId){
  const resultado = DB.obterOuCriarResultadoModalidade(modalidadeId, serieId, '', 'coletiva');

  document.querySelectorAll('#listaColocacaoColetiva input.input-posicao').forEach(input => {
    input.addEventListener('input', () => {
      const preview = document.querySelector(`[data-preview-turma="${input.dataset.turmaId}"]`);
      if(!preview) return;
      const val = parseInt(input.value, 10);
      preview.textContent = isNaN(val) ? '' : `${DB.getPontosPorPosicao(val)} pts`;
    });
  });

  const btnSalvar = document.getElementById('btnSalvarColocacaoColetiva');
  if(btnSalvar){
    btnSalvar.addEventListener('click', () => {
      const mapa = {};
      const posicoes = [];
      document.querySelectorAll('#listaColocacaoColetiva input.input-posicao').forEach(input => {
        const val = input.value.trim();
        if(val !== ''){
          mapa[input.dataset.turmaId] = Number(val);
          posicoes.push(Number(val));
        }
      });
      if(!posicoes.length){
        alert('Defina pelo menos uma colocação antes de salvar.');
        return;
      }
      const validacao = DB.validarSequenciaColocacoes(posicoes);
      if(!validacao.valido){
        alert(validacao.mensagemErro);
        return;
      }
      const linhasResumo = Object.entries(mapa)
        .sort((a, b) => a[1] - b[1])
        .map(([turmaId, pos]) => `${pos}º — ${nomeExibidoTurma(turmaId)} — ${DB.getPontosPorPosicao(pos)} pts`)
        .join('\n');
      const confirmado = confirm(`Confirma este resultado?\n\n${linhasResumo}`);
      if(!confirmado) return;
      DB.salvarColocacoesColetiva(resultado.id, mapa);
      mostrarToast('Colocação salva.');
      rerenderizarColocacaoColetiva(serieId, modalidadeId);
    });
  }

  const btnCorrigir = document.getElementById('btnCorrigirColocacaoColetiva');
  if(btnCorrigir){
    btnCorrigir.addEventListener('click', () => {
      const confirmado = confirm('Esta colocação já foi lançada. Deseja corrigir?');
      if(!confirmado) return;
      DB.reabrirResultado(resultado.id);
      rerenderizarColocacaoColetiva(serieId, modalidadeId, true);
    });
  }
}
function rerenderizarColocacaoColetiva(serieId, modalidadeId, forcarEdicao){
  const app = document.getElementById('app');
  app.innerHTML = telaColocacaoColetiva(serieId, modalidadeId, forcarEdicao);
  ligarEventosColocacaoColetiva(serieId, modalidadeId);
  window.scrollTo(0, 0);
}

    const seriesIds = Array.from(document.querySelectorAll('input[name="desafioSerie"]:checked')).map(c => c.value);

    const desafio = DB.getDesafios().find(d => d.id === btn.dataset.id);
    DB.atualizarDesafio(btn.dataset.id, { ativo: !desafio.ativo });
    rerenderizarDesafios();
  });

function ligarEventosPontosExtras(){
  document.getElementById('formNovoAjuste').addEventListener('submit', e => {
    e.preventDefault();
    const turmaId = document.getElementById('ajusteTurma').value;
    const tipo = document.getElementById('ajusteTipo').value;
    const valor = parseInt(document.getElementById('ajusteValor').value, 10);
    const motivo = document.getElementById('ajusteMotivo').value.trim();
    if(!turmaId || isNaN(valor)) return;
    DB.addAjustePontuacao({ turmaId, valor, motivo, tipo });
    mostrarToast('Ajuste registrado.');
    rerenderizarPontosExtras('ajustes');
  });

  document.getElementById('listaAjustes').addEventListener('click', e => {
    const btn = e.target.closest('button[data-acao="excluir-ajuste"]');
    if(!btn) return;
    const confirmado = confirm('⚠️ Deseja realmente excluir este ajuste do histórico?');
    if(!confirmado) return;
    DB.excluirAjustePontuacao(btn.dataset.id);
    mostrarToast('Ajuste excluído.');
    rerenderizarPontosExtras('ajustes');
  });

  document.querySelectorAll('.aba-extras button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.aba-extras button').forEach(b => b.classList.remove('ativa'));
      btn.classList.add('ativa');
      const aba = btn.dataset.aba;
      document.getElementById('painelAbaAjustes').style.display = aba === 'ajustes' ? 'block' : 'none';
      document.getElementById('painelAbaCategorias').style.display = aba === 'categorias' ? 'block' : 'none';
    });
  });

  const formCat = document.getElementById('formNovaCategoriaPontuacao');
  formCat.addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('novaCategoriaPontuacaoNome');
    if(!input.value.trim()) return;
    DB.addCategoriaPontuacao(input.value.trim());
    mostrarToast('Categoria adicionada.');
    rerenderizarPontosExtras('categorias');
  });

  const painelCategorias = document.getElementById('painelAbaCategorias');
  painelCategorias.addEventListener('click', e => {
    const btn = e.target.closest('button[data-acao="toggle-categoria-pontuacao"]');
    if(!btn) return;
    const cat = DB.getCategoriasPontuacao().find(c => c.id === btn.dataset.id);
    DB.atualizarCategoriaPontuacao(btn.dataset.id, { ativo: !cat.ativo });
    rerenderizarPontosExtras('categorias');
  });
  painelCategorias.addEventListener('change', e => {
    const input = e.target.closest('input[data-acao="pontos-categoria"]');
    if(!input) return;
    const pontos = Math.max(0, parseInt(input.value, 10) || 0);
    DB.atualizarPontuacaoCategoria(input.dataset.id, pontos);
    mostrarToast('Pontuação salva.');
  });
}
function rerenderizarPontosExtras(abaAtiva){
  const app = document.getElementById('app');
  app.innerHTML = telaPontosExtras(abaAtiva);
  ligarEventosPontosExtras();
}

function telaClassificacaoGeral(serieId){

  const medalhas = { 1:'🥇', 2:'🥈', 3:'🥉' };

  ranking.forEach(r => { contagemPorPosicao[r.posicao] = (contagemPorPosicao[r.posicao] || 0) + 1; });

  return `
    <button class="botao-voltar" onclick="location.hash='#/classificacao/geral'">&larr; Trocar série</button>

function renderListaChaveamentos(){
  const container = document.getElementById('listaChaveamentosContainer');
  if(!container) return;
  const busca = (document.getElementById('buscaTurmaChave')?.value || '').trim().toLowerCase();
  const filtroSerie = document.getElementById('filtroSerieChave')?.value || '';
  const filtroModalidade = document.getElementById('filtroModalidadeChave')?.value || '';
  const filtroCategoria = document.getElementById('filtroCategoriaChave')?.value || '';
  const filtroStatus = document.getElementById('filtroStatusChave')?.value || '';

  let lista = DB.getChaveamentos();
  if(filtroSerie) lista = lista.filter(c => c.serieId === filtroSerie);
  if(filtroModalidade) lista = lista.filter(c => c.modalidadeId === filtroModalidade);
  if(filtroCategoria) lista = lista.filter(c => c.categoria === filtroCategoria);
  if(filtroStatus) lista = lista.filter(c => c.status === filtroStatus);
  if(busca) lista = lista.filter(c => nomeExibidoTurma(c.turmaId).toLowerCase().includes(busca));
  lista = lista.slice().sort((a, b) => new Date(b.atualizadoEm) - new Date(a.atualizadoEm));

  container.innerHTML = lista.length
    ? lista.map(cardChaveamentoHtml).join('')
    : '<p style="color:var(--texto-suave); font-size:14px; text-align:center; padding:20px 0;">Nenhum chaveamento encontrado.</p>';
}
function ligarEventosListaChaveamentos(statusInicial){
  if(statusInicial) document.getElementById('filtroStatusChave').value = statusInicial;
  renderListaChaveamentos();
  document.getElementById('btnAlternarFiltrosChave').addEventListener('click', () => {
    document.getElementById('painelFiltrosChave').classList.toggle('aberto');
  });
  ['buscaTurmaChave','filtroSerieChave','filtroModalidadeChave','filtroCategoriaChave','filtroStatusChave'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', renderListaChaveamentos);
    el.addEventListener('change', renderListaChaveamentos);
  });
}

// Bloco 2: resolve um id que pode ser tanto uma turma quanto um
// agrupamento ativo -- usado por todas as telas de criação de
// chaveamento para funcionar com os dois contextos sem duplicar código.
function resolverContextoChaveamento(id){
  const agrupamento = DB.getAgrupamento(id);
  if(agrupamento){
    return { tipo:'grupo', agrupamento, serieId: agrupamento.serieId, rotulo: agrupamento.nome };
  }
  const turma = DB.getTurmas().find(t => t.id === id);
  if(turma){
    const serie = DB.getSeries().find(s => s.id === turma.serieId);
    return { tipo:'turma', turma, serieId: turma.serieId, rotulo: `${serie ? serie.nome : ''} ${turma.turma}` };
  }
  return null;
}
