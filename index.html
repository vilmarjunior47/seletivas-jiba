/* ---------- Etapa 2B-2: seleção de participantes vinda do RESULTADO de uma
   seletiva já concluída ("Gerar fase principal" / "Gerar repescagem").
   Reaproveita integralmente htmlSelecaoParticipantes/ligarEventosSelecaoParticipantes/
   renderPreviewSorteio/DB.montarChaveamento já existentes do Bloco 7 -- só a
   ORIGEM da lista de participantes é diferente (vem do resultado da seletiva,
   não de "todos os inscritos"). Nenhuma chave é criada automaticamente: o
   professor ainda revisa a lista, sorteia e confirma, exatamente como já
   funcionava. */
function telaSelecaoParticipantesFaseSeletiva(serieId, turmaId, modalidadeId, categoria, tipo){
  const serie = DB.getSeries().find(s => s.id === serieId);
  const turma = DB.getTurmas().find(t => t.id === turmaId);
  const modalidade = DB.getModalidades().find(m => m.id === modalidadeId);
  const seletiva = DB.getSeletiva(modalidadeId, serieId, categoria);
  const voltar = `#/seletivas/${serieId}/${turmaId}/${modalidadeId}/${categoria}`;
  if(!serie || !turma || !modalidade || !seletiva){
    return `<button class="botao-voltar" onclick="location.hash='#/seletivas'">&larr; Seletivas</button>
      <div class="tela-em-breve"><div class="icone-grande">❓</div><h2>Não encontrado</h2></div>`;
  }
  const existentes = DB.getChaveamentosPorContexto(turmaId, modalidadeId, categoria);
  const elegiveis = DB.participantesFaseSeletiva(seletiva.id, turmaId, tipo);
  const titulo = tipo === 'principal' ? '🏆 Fase Principal (Classificados)' : '🔁 Repescagem (Reservas/Não classificados)';
  previewSorteio = null;

  return `
    <button class="botao-voltar" onclick="location.hash='${voltar}'">&larr; Voltar à seletiva</button>
    <div class="secao-titulo">${iconeModalidade(modalidade.nome)} ${modalidade.nome} — ${serie.nome} ${turma.turma} — ${titulo}</div>

    ${existentes.length ? `
      <div class="aviso-forte">
        ⚠️ Já existe um chaveamento para esta turma/modalidade/categoria.
        <div style="display:flex; gap:10px; margin-top:10px;">
          <a href="#/chaveamentos/${existentes[0].id}" class="botao botao-secundario" style="flex:1; text-align:center; text-decoration:none;">Abrir existente</a>
          <button class="botao botao-primario" id="btnCriarOutroChave" type="button" style="flex:1;">Criar outro</button>
        </div>
      </div>
      <div id="areaSelecaoParticipantes" style="display:none;">${htmlSelecaoParticipantes(elegiveis)}</div>
    ` : `
      <div id="areaSelecaoParticipantes">${htmlSelecaoParticipantes(elegiveis)}</div>
    `}

    <div id="areaSorteio"></div>
  `;
}

function renderPreviewSorteio(serieId, contextoId, modalidadeId, categoria){
  const area = document.getElementById('areaSorteio');
  if(!area || !previewSorteio) return;
  const N = previewSorteio.alunos.length;

  // Alteração pontual: participante único -- não é sorteio, não é BYE.
  // Confirmar já cria o chaveamento direto como Finalizado/campeão
  // (DB.montarChaveamento trata N===1 automaticamente).
  if(N === 1){
    const unico = previewSorteio.alunos[0];
    area.innerHTML = `
      <div class="bloco" style="text-align:center;">
        <div style="font-size:13px; font-weight:700; color:var(--texto-suave); text-transform:uppercase; letter-spacing:0.4px;">Participante único</div>
        <div style="font-size:12.5px; color:var(--texto-suave); margin:6px 0 14px;">Apenas 1 aluno inscrito nesta seletiva — ele será o campeão automaticamente, sem disputar partida.</div>
        <div class="medalha-grande">🏆</div>
        <div class="nome-campeao">${unico.nome}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:12px;">
        <button class="botao botao-primario" id="btnConfirmarSorteio" type="button">Confirmar campeão</button>
        <button class="botao-texto" id="btnCancelarSorteio" type="button" style="color:#B23A3A;">Cancelar</button>
      </div>
    `;
    document.getElementById('btnConfirmarSorteio').addEventListener('click', () => {
      const ctx = resolverContextoChaveamento(contextoId);
      const chaveamento = DB.montarChaveamento({
        serieId,
        turmaId: ctx && ctx.tipo === 'turma' ? contextoId : null,
        agrupamentoId: ctx && ctx.tipo === 'grupo' ? contextoId : null,
        modalidadeId, categoria,
        disputaTerceiro: false,
        participantesEmbaralhados: previewSorteio.alunos
      });
      mostrarToast('Campeão registrado (participante único).');
      previewSorteio = null;
      location.hash = `#/chaveamentos/${chaveamento.id}`;
    });
    document.getElementById('btnCancelarSorteio').addEventListener('click', () => {
      previewSorteio = null;
      area.innerHTML = '';
    });
    return;
  }

  let size = 2;
  while(size < N) size *= 2;
  const numByes = size - N;
  const comBye = previewSorteio.alunos.slice(0, numByes);
  const semBye = previewSorteio.alunos.slice(numByes);
  const nomesFases = DB.obterNomesFases(size);

  const confrontosPreview = [];
  comBye.forEach(a => confrontosPreview.push({ a, b:null, bye:true }));
  for(let i = 0; i < semBye.length; i += 2) confrontosPreview.push({ a:semBye[i], b:semBye[i + 1], bye:false });

  area.innerHTML = `
    <div class="secao-titulo">${previewSorteio.manual ? 'Confirmar ordem definida' : 'Prévia do sorteio'} — ${nomesFases[0]}</div>
    ${confrontosPreview.map((c, idx) => `
      <div class="cartao-confronto-chave">
        <div style="font-size:12px; color:var(--texto-suave); margin-bottom:6px;">Jogo ${idx + 1}</div>
        ${c.bye
          ? `<div class="lado-confronto vencedor">⭐ ${c.a.nome} <span class="selo-bye">BYE — avanço automático</span></div>`
          : `<div class="lado-confronto">${c.a.nome}</div><div class="x-confronto-chave">×</div><div class="lado-confronto">${c.b.nome}</div>`
        }
      </div>
    `).join('')}

    <div class="bloco">
      <label style="display:flex; align-items:center; gap:8px; font-weight:600; ${!nomesFases.includes('Semifinal') ? 'opacity:0.5;' : ''}">
        <input type="checkbox" id="checkDisputaTerceiro" ${previewSorteio.disputaTerceiro ? 'checked' : ''} style="width:20px; height:20px;" ${!nomesFases.includes('Semifinal') ? 'disabled' : ''}>
        Realizar disputa de 3º lugar
      </label>
      ${!nomesFases.includes('Semifinal') ? '<p style="font-size:12px; color:var(--texto-suave); margin-top:6px;">Só disponível com 4 ou mais participantes.</p>' : ''}
    </div>

    <div style="display:flex; flex-direction:column; gap:10px; margin-top:12px;">
      <button class="botao botao-primario" id="btnConfirmarSorteio" type="button">${previewSorteio.manual ? 'Confirmar e montar chave' : 'Confirmar sorteio'}</button>
      ${!previewSorteio.manual ? '<button class="botao botao-secundario" id="btnSortearNovamente" type="button">🎲 Sortear novamente</button>' : ''}
      <button class="botao-texto" id="btnCancelarSorteio" type="button" style="color:#B23A3A;">Cancelar</button>
    </div>
  `;

  const checkTerceiro = document.getElementById('checkDisputaTerceiro');
  if(checkTerceiro){
    checkTerceiro.addEventListener('change', e => { previewSorteio.disputaTerceiro = e.target.checked; });
  }
  document.getElementById('btnConfirmarSorteio').addEventListener('click', () => {
    const ctx = resolverContextoChaveamento(contextoId);
    const chaveamento = DB.montarChaveamento({
      serieId,
      turmaId: ctx && ctx.tipo === 'turma' ? contextoId : null,
      agrupamentoId: ctx && ctx.tipo === 'grupo' ? contextoId : null,
      modalidadeId, categoria,
      disputaTerceiro: previewSorteio.disputaTerceiro,
      participantesEmbaralhados: previewSorteio.alunos
    });
    mostrarToast('Chaveamento criado.');
    previewSorteio = null;
    location.hash = `#/chaveamentos/${chaveamento.id}`;
  });
  const btnSortearNovamente = document.getElementById('btnSortearNovamente');
  if(btnSortearNovamente){
    btnSortearNovamente.addEventListener('click', () => {
      previewSorteio.alunos = DB.embaralharFisherYates(previewSorteio.alunos);
      renderPreviewSorteio(serieId, contextoId, modalidadeId, categoria);
    });
  }
  document.getElementById('btnCancelarSorteio').addEventListener('click', () => {
    previewSorteio = null;
    area.innerHTML = '';
  });
}

function ligarEventosSelecaoParticipantes(serieId, contextoId, modalidadeId, categoria){
  const btnCriarOutro = document.getElementById('btnCriarOutroChave');
  if(btnCriarOutro){
    btnCriarOutro.addEventListener('click', () => {
      document.getElementById('areaSelecaoParticipantes').style.display = 'block';
      btnCriarOutro.closest('.aviso-forte').style.display = 'none';
    });
  }
  const btnSortear = document.getElementById('btnSortearConfrontos');
  if(btnSortear){
    btnSortear.addEventListener('click', () => {
      const selecionados = Array.from(document.querySelectorAll('input[name="participanteChave"]:checked')).map(c => c.value);
      // Alteração pontual: 1 participante agora é permitido (campeão
      // automático, sem confronto) -- só bloqueia com 0 selecionados.
      if(selecionados.length < 1){
        alert('⚠️ Selecione pelo menos 1 participante.');
        return;
      }
      const alunos = selecionados.map(id => DB.getAluno(id)).filter(Boolean);

      if(alunos.length === 1){
        previewSorteio = { alunos, disputaTerceiro:false, manual:false };
        renderPreviewSorteio(serieId, contextoId, modalidadeId, categoria);
        document.getElementById('areaSorteio').scrollIntoView({ behavior:'smooth' });
        return;
      }

      const modoManual = document.querySelector('input[name="modoMontagem"]:checked')?.value === 'manual';
      if(modoManual){
        renderOrdemManual(serieId, contextoId, modalidadeId, categoria, alunos);
      } else {
        previewSorteio = { alunos: DB.embaralharFisherYates(alunos), disputaTerceiro:false, manual:false };
        renderPreviewSorteio(serieId, contextoId, modalidadeId, categoria);
      }
      document.getElementById('areaSorteio').scrollIntoView({ behavior:'smooth' });
    });
  }
}

// ✍️ Definir manualmente: o professor escolhe a ORDEM dos participantes
// (setas ↑/↓) em vez de sortear. A lista final alimenta o MESMO preview/
// confirmação de sempre (renderPreviewSorteio), só sem a opção de
// "sortear novamente" -- a ordem escolhida é respeitada tal como está.
function renderOrdemManual(serieId, contextoId, modalidadeId, categoria, alunos){
  const area = document.getElementById('areaSorteio');
  if(!area) return;
  let ordem = alunos.slice();

  function desenhar(){
    area.innerHTML = `
      <div class="bloco">
        <h3>✍️ Defina a ordem dos participantes</h3>
        <p style="font-size:12.5px; color:var(--texto-suave); margin:-4px 0 10px;">Use as setas para reordenar. O chaveamento será montado respeitando esta ordem, sem sorteio.</p>
        ${ordem.map((a, i) => `
          <div class="linha-participante-chave">
            <span style="font-weight:600;">${i + 1}. ${a.nome}</span>
            <div style="display:flex; gap:6px;">
              <button type="button" class="botao-texto" data-acao="mover-cima" data-idx="${i}" ${i === 0 ? 'disabled' : ''} style="min-width:36px;">↑</button>
              <button type="button" class="botao-texto" data-acao="mover-baixo" data-idx="${i}" ${i === ordem.length - 1 ? 'disabled' : ''} style="min-width:36px;">↓</button>
            </div>
          </div>
        `).join('')}
        <button class="botao botao-primario" id="btnConfirmarOrdemManual" type="button" style="width:100%; margin-top:12px;">Confirmar ordem e continuar</button>
      </div>
    `;
    area.querySelectorAll('button[data-acao="mover-cima"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.idx);
        [ordem[i - 1], ordem[i]] = [ordem[i], ordem[i - 1]];
        desenhar();
      });
    });
    area.querySelectorAll('button[data-acao="mover-baixo"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.idx);
        [ordem[i + 1], ordem[i]] = [ordem[i], ordem[i + 1]];
        desenhar();
      });
    });
    document.getElementById('btnConfirmarOrdemManual').addEventListener('click', () => {
      previewSorteio = { alunos: ordem.slice(), disputaTerceiro:false, manual:true };
      renderPreviewSorteio(serieId, contextoId, modalidadeId, categoria);
    });
  }
  desenhar();
}

/* ---------- Detalhe do chaveamento (bracket) ---------- */
function cardConfrontoChaveHtml(c){
  const alunoA = c.alunoAId ? DB.getAluno(c.alunoAId) : null;
  const alunoB = c.alunoBId ? DB.getAluno(c.alunoBId) : null;
  const rotuloJogo = `<div class="rotulo-jogo">Jogo ${c.ordem + 1}</div>`;

  if(c.tipoResultado === 'bye'){
    return `
      <div class="cartao-confronto-chave finalizado" data-id="${c.id}">
        ${rotuloJogo}
        <div class="lado-confronto vencedor">⭐ ${alunoA ? alunoA.nome : '—'} <span class="selo-bye">🔵 BYE — avanço automático</span></div>
      </div>
    `;
  }

  if(!alunoA || !alunoB){
    return `
      <div class="cartao-confronto-chave" data-id="${c.id}">
        ${rotuloJogo}
        <div class="lado-confronto">${alunoA ? alunoA.nome : '⏳ Aguardando definição'}</div>
        <div class="x-confronto-chave">VS</div>
        <div class="lado-confronto">${alunoB ? alunoB.nome : '⏳ Aguardando definição'}</div>
      </div>
    `;
  }

  const finalizado = c.status === 'Finalizado';
  const editando = confrontosEmEdicao.has(c.id);

  // Bloco 3: jogo adiado -- não é vitória, derrota nem W.O.; fica
  // pendente até o professor "retomar" e registrar o resultado normalmente.
  if(c.adiado && !finalizado){
    return `
      <div class="cartao-confronto-chave adiado" data-id="${c.id}">
        ${rotuloJogo}
        <div class="lado-confronto">${alunoA.nome}</div>
        <div class="x-confronto-chave">VS</div>
        <div class="lado-confronto">${alunoB.nome}</div>
        <div class="selo-adiado">⏸️ JOGO ADIADO — este jogo ainda precisa ser realizado</div>
        <button type="button" class="botao botao-secundario" data-acao="retomar-adiado" data-id="${c.id}" style="width:100%; margin-top:8px;">▶️ Retomar jogo</button>
      </div>
    `;
  }

  if(finalizado && !editando){
    const tags = [];
    if(c.tipoResultado === 'wo') tags.push('<span class="selo-tipo-resultado">⚠️ W.O.</span>');
    if(c.tipoResultado === 'desistencia') tags.push('<span class="selo-tipo-resultado">Desistência</span>');
    return `
      <div class="cartao-confronto-chave finalizado" data-id="${c.id}">
        ${rotuloJogo}
        <div class="lado-confronto ${c.vencedorAlunoId === alunoA.id ? 'vencedor' : 'perdedor'}">${alunoA.nome}${c.vencedorAlunoId === alunoA.id ? ` <span class="etiqueta-resultado-lado">🟢 VENCEU</span>` : ` <span class="etiqueta-resultado-lado">🔴 PERDEU</span>`}</div>
        <div class="x-confronto-chave">VS</div>
        <div class="lado-confronto ${c.vencedorAlunoId === alunoB.id ? 'vencedor' : 'perdedor'}">${alunoB.nome}${c.vencedorAlunoId === alunoB.id ? ` <span class="etiqueta-resultado-lado">🟢 VENCEU</span>` : ` <span class="etiqueta-resultado-lado">🔴 PERDEU</span>`}</div>
        ${c.placar ? `<div style="text-align:center; font-size:13px; color:var(--texto-suave); margin-top:6px;">Placar: ${c.placar}</div>` : ''}
        ${tags.length ? `<div style="text-align:center; margin-top:6px;">${tags.join(' ')}</div>` : ''}
        ${c.observacao ? `<div style="text-align:center; font-size:12.5px; color:var(--texto-suave); margin-top:4px;">📝 ${c.observacao}</div>` : ''}
        <button type="button" class="botao-detalhes-sel no-print" data-acao="corrigir-vencedor" data-id="${c.id}" style="margin-top:8px;">✏️ Corrigir vencedor</button>
      </div>
    `;
  }

  return `
    <div class="cartao-confronto-chave" data-id="${c.id}">
      ${rotuloJogo}
      <div class="lado-confronto">${alunoA.nome}</div>
      <div class="x-confronto-chave">VS</div>
      <div class="lado-confronto">${alunoB.nome}</div>
      <div class="botoes-vencedor no-print">
        <button type="button" data-acao="vencedor" data-id="${c.id}" data-vencedor="${alunoA.id}">🏆 ${alunoA.nome} venceu</button>
        <button type="button" data-acao="vencedor" data-id="${c.id}" data-vencedor="${alunoB.id}">🏆 ${alunoB.nome} venceu</button>
      </div>
      ${!editando ? `
        <div class="linha-acoes-confronto no-print">
          <button type="button" class="botao-texto" data-acao="adiar" data-id="${c.id}">⏸️ Adiar jogo</button>
          <button type="button" class="botao-texto" data-acao="toggle-wo" data-id="${c.id}" style="color:#B23A3A;">⚠️ W.O.</button>
        </div>
        <div class="grade-campos-sel no-print" id="wo-${c.id}" style="display:none; margin-top:8px; grid-template-columns:1fr 1fr; gap:8px;">
          <button type="button" class="botao botao-secundario" data-acao="confirmar-wo" data-id="${c.id}" data-vencedor="${alunoA.id}">⚠️ W.O. — ${alunoA.nome} venceu</button>
          <button type="button" class="botao botao-secundario" data-acao="confirmar-wo" data-id="${c.id}" data-vencedor="${alunoB.id}">⚠️ W.O. — ${alunoB.nome} venceu</button>
        </div>
      ` : ''}
      <button type="button" class="botao-detalhes-sel no-print" data-acao="toggle-opcoes" data-id="${c.id}">▾ Mais opções (placar, W.O., desistência, observação)</button>
      <div class="grade-campos-sel no-print" id="opcoes-${c.id}" style="display:none; margin-top:8px;">
        <div class="campo">
          <label>Tipo</label>
          <select id="tipoResultado-${c.id}">
            <option value="normal">Normal</option>
            <option value="wo">W.O.</option>
            <option value="desistencia">Desistência</option>
          </select>
        </div>
        <div class="campo">
          <label>Placar (opcional)</label>
          <input type="text" id="placar-${c.id}" placeholder="Ex: 11 x 7">
        </div>
        <div class="campo">
          <label>Observação</label>
          <input type="text" id="observacao-${c.id}" placeholder="Opcional">
        </div>
      </div>
      ${editando ? `<button type="button" class="botao-texto" data-acao="cancelar-correcao" data-id="${c.id}" style="margin-top:6px;">Cancelar correção</button>` : ''}
    </div>
  `;
}

function htmlResumoFamiliaChaveamento(raizId, chaveamentoAtualId){
  const { principal, repescagem, final } = DB.obterFamiliaChaveamento(raizId);
  if(!principal) return '';
  function etapaPipeline(classeFase, rotulo, chav){
    const ativa = chav && chav.id === chaveamentoAtualId;
    if(!chav){
      return `<div class="etapa-pipeline ${classeFase} vazia"><div class="rotulo-etapa">${rotulo}</div><div class="valor-etapa">—</div></div>`;
    }
    const valor = chav.campeaoAlunoId ? `✅ ${DB.getAluno(chav.campeaoAlunoId)?.nome || '—'}` : '▶️ Em andamento';
    return `<a href="#/chaveamentos/${chav.id}" class="etapa-pipeline ${classeFase} ${ativa ? 'ativa' : ''}"><div class="rotulo-etapa">${rotulo}${ativa ? ' · aqui' : ''}</div><div class="valor-etapa">${valor}</div></a>`;
  }
  const podeRepescagem = DB.podeGerarRepescagem(raizId);
  const podeFinal = DB.podeGerarFinal(raizId);
  return `
    <div class="pipeline-chave">
      ${etapaPipeline('principal', '🔵 Principal', principal)}
      <div class="seta-pipeline">→</div>
      ${etapaPipeline('repescagem', '🟠 Repescagem', repescagem)}
      <div class="seta-pipeline">→</div>
      ${etapaPipeline('final', '🟡 Final', final)}
    </div>
    <div class="bloco">
      ${final && final.campeaoAlunoId ? `
        <div class="podio-chaveamento">
          <div class="medalha-grande">🥇</div>
          <div class="nome-campeao">${DB.getAluno(final.campeaoAlunoId)?.nome || '—'}</div>
          <div class="selo-representante">🏆 CAMPEÃO DA MODALIDADE</div>
          ${final.viceAlunoId ? `<div class="podio-vice">🥈 Vice: ${DB.getAluno(final.viceAlunoId)?.nome || '—'}</div>` : ''}
        </div>
      ` : ''}
      ${podeRepescagem ? '<button class="botao botao-primario" id="btnGerarRepescagemChave" type="button" style="width:100%;">🎲 Gerar repescagem</button>' : ''}
      ${podeFinal ? '<button class="botao botao-primario" id="btnGerarFinalChave" type="button" style="width:100%;">🎲 Gerar final</button>' : ''}
      <a href="#/chaveamentos/caminho/${raizId}" class="botao-texto" style="display:block; text-align:center; margin-top:${podeRepescagem || podeFinal ? '12px' : '0'};">📍 Ver caminho de um participante</a>
    </div>
  `;
}

// Classificados para o JIBA (novo): não mexe no motor -- só lê
// DB.classificadosChaveamento (derivado de campeão/vice/terceiro/fase de
// eliminação, já existentes) e grava a quantidade escolhida.
function htmlClassificadosChaveamento(raizId){
  const r = DB.classificadosChaveamento(raizId);
  const totalParticipantes = r.classificacao.length;
  if(!totalParticipantes) return '';
  return `
    <div class="bloco no-print">
      <h3 style="margin-bottom:8px;">🏅 Quantidade de classificados</h3>
      <p style="font-size:12.5px; color:var(--texto-suave); margin:-2px 0 10px;">Escolha quantos dos primeiros colocados serão considerados classificados para o JIBA. A ordem é definida automaticamente pela classificação final.</p>
      <select id="quantidadeClassificadosSelect" style="width:100%; padding:10px; border-radius:var(--raio); border:1px solid var(--borda); font-size:14px;">
        <option value="0" ${r.quantidade === 0 ? 'selected' : ''}>— Não definido —</option>
        ${Array.from({ length: totalParticipantes }, (_, i) => i + 1).map(n => `<option value="${n}" ${r.quantidade === n ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
      <button class="botao botao-primario" id="btnSalvarQuantidadeClassificados" type="button" style="width:100%; margin-top:10px;">Salvar</button>
    </div>
    ${r.classificados.length ? `
      <div class="bloco">
        <h3 style="margin-bottom:8px;">🏅 Classificados (${r.classificados.length})</h3>
        <ol class="lista-classificados">
          ${r.classificados.map(item => `<li>${item.aluno.nome}</li>`).join('')}
        </ol>
      </div>
    ` : ''}
  `;
}

function telaChaveamentoDetalhe(chaveamentoId){
  const c = DB.getChaveamento(chaveamentoId);
  if(!c){
    return `<button class="botao-voltar" onclick="location.hash='#/chaveamentos/lista'">&larr; Chaveamentos</button>
      <div class="tela-em-breve"><div class="icone-grande">❓</div><h2>Chaveamento não encontrado</h2></div>`;
  }
  const modalidade = DB.getModalidades().find(m => m.id === c.modalidadeId);
  confrontosEmEdicao.clear();

  const confrontos = DB.getConfrontos(chaveamentoId);
  const fases = [...new Set(confrontos.filter(x => !x.terceiroLugar).map(x => x.faseIndex))].sort((a, b) => a - b);
  const terceiroLugarConfronto = confrontos.find(x => x.terceiroLugar);

  // Etapa 2B-3: toda "família" (Fase Principal + Repescagem + Final) é
  // identificada pelo id da Fase Principal (a "raiz"). Chaveamentos
  // antigos, criados antes desta etapa, não têm `tipo` -- tratamos como
  // 'principal' sem família, preservando o comportamento de sempre.
  const tipoAtual = c.tipo || 'principal';
  const raizId = tipoAtual === 'principal' ? c.id : c.chaveamentoPrincipalId;
  const familia = raizId ? DB.obterFamiliaChaveamento(raizId) : { principal:c, repescagem:null, final:null };
  const rotuloFase = tipoAtual === 'repescagem' ? '🔄 Repescagem' : (tipoAtual === 'final' ? '🥇 Final' : '🏆 Fase Principal');

  // "Atualizar seletiva" só faz sentido a partir do resultado que vale
  // como resultado definitivo da modalidade: a Final (quando existe),
  // ou a própria Fase Principal quando o professor optou por não usar
  // repescagem/final (uso simples, igual ao Bloco 7 original).
  const mostrarAtualizarSeletiva = !!c.campeaoAlunoId && tipoAtual !== 'repescagem' && (tipoAtual === 'final' || !familia.final);

  return `
    <button class="botao-voltar no-print" onclick="location.hash='#/chaveamentos/lista'">&larr; Chaveamentos</button>

    <div class="cabecalho-chave">
      <div class="titulo-chave">🏆 Chaveamento da Seletiva</div>
      <div class="linha-contexto-chave">
        <span class="modalidade-chave">${iconeModalidade(modalidade ? modalidade.nome : '')} ${modalidade ? modalidade.nome : ''}</span>
        <span class="detalhe-contexto-chave">${rotuloContextoChaveamento(c)} · ${c.categoria} · ${rotuloFase}</span>
      </div>
      <span class="selo-status-chave ${c.status === 'Finalizado' ? 'finalizado' : 'andamento'}" id="badgeStatusChave">${c.status === 'Finalizado' ? '🏆 FINALIZADO' : '🟢 EM ANDAMENTO'}</span>
      <div class="no-print" style="margin-top:14px; display:flex; flex-direction:column; gap:8px;">
        <button class="botao botao-secundario" id="btnRefazerSorteio" type="button" style="width:100%;">🎲 Refazer sorteio</button>
        <button class="botao-texto" id="btnToggleFerramentas" type="button" style="width:100%; color:#fff;">🛠️ Controle da chave (falta, adiar, W.O., reorganizar, trocar, adicionar/remover)</button>
        <button class="botao-texto" onclick="location.hash='#/relatorios/chaveamento-direto/${chaveamentoId}'" style="width:100%; color:#fff;">🖨️ Imprimir chaveamento</button>
      </div>
    </div>

    <div id="painelFerramentasChave" class="no-print" style="${painelFerramentasChaveAberto ? '' : 'display:none;'}">${htmlFerramentasChaveamento(chaveamentoId)}</div>

    ${raizId ? htmlResumoFamiliaChaveamento(raizId, chaveamentoId) : ''}

    ${c.campeaoAlunoId && tipoAtual !== 'final' ? `
      <div class="podio-chaveamento">
        <div class="medalha-grande">🏆</div>
        <div class="nome-campeao">${DB.getAluno(c.campeaoAlunoId)?.nome || '—'}</div>
        <div class="selo-representante">${c.participanteUnico ? '👤 PARTICIPANTE ÚNICO — CAMPEÃO AUTOMÁTICO' : (tipoAtual === 'repescagem' ? 'CAMPEÃO DA REPESCAGEM' : (familia.final ? 'CAMPEÃO DA FASE PRINCIPAL' : `⭐ REPRESENTANTE ${rotuloContextoChaveamento(c).toUpperCase()}`))}</div>
        ${c.participanteUnico ? '<p style="font-size:12px; color:var(--texto-suave); margin-top:8px;">Apenas 1 aluno inscrito nesta seletiva — não houve partida a disputar.</p>' : ''}
        ${c.viceAlunoId ? `<div class="podio-vice">🥈 Vice-campeão: ${DB.getAluno(c.viceAlunoId)?.nome || '—'}</div>` : ''}
        ${c.terceiroAlunoId ? `<div class="podio-vice">🥉 3º lugar: ${DB.getAluno(c.terceiroAlunoId)?.nome || '—'}</div>` : ''}
      </div>
      ${mostrarAtualizarSeletiva ? `
        <button class="botao botao-primario no-print" id="btnAtualizarSeletiva" type="button" style="width:100%; margin-bottom:16px;">Atualizar seletiva</button>
        <div id="areaAtualizarSeletiva"></div>
      ` : ''}
    ` : ''}
    ${c.campeaoAlunoId && tipoAtual === 'final' && mostrarAtualizarSeletiva ? `
      <button class="botao botao-primario no-print" id="btnAtualizarSeletiva" type="button" style="width:100%; margin-bottom:16px;">Atualizar seletiva</button>
      <div id="areaAtualizarSeletiva"></div>
    ` : ''}

    ${mostrarAtualizarSeletiva && raizId ? htmlClassificadosChaveamento(raizId) : ''}

    ${!confrontos.length ? '' : `
      <div class="faixa-fase ${tipoAtual}">
        <span class="ponto-fase"></span>
        <span>${rotuloFase.replace(/^[^\s]+\s/, '')}</span>
      </div>
      <div id="areaBracket">
        <div class="trilho-chave">
          ${fases.map(fi => {
            const confrontosFase = confrontos.filter(x => x.faseIndex === fi && !x.terceiroLugar).sort((a, b) => a.ordem - b.ordem);
            return `
              <div class="cartao-fase">
                <h4>${confrontosFase[0].fase}</h4>
                ${confrontosFase.map(cf => cardConfrontoChaveHtml(cf)).join('')}
              </div>
            `;
          }).join('')}
          ${terceiroLugarConfronto ? `
            <div class="cartao-fase">
              <h4>🥉 Disputa de 3º lugar</h4>
              ${cardConfrontoChaveHtml(terceiroLugarConfronto)}
            </div>
          ` : ''}
        </div>
      </div>
    `}
  `;
}

// Bloco 3: painel de operação real do chaveamento (falta, adiar já
// tratados no card do confronto; aqui ficam as ações de nível de
// participante/estrutura: reorganizar, trocar posições, adicionar e
// remover aluno). Nada disso mexe em aluno/inscrição -- só nas tabelas
// de chaveamento (localStorage).
function htmlFerramentasChaveamento(chaveamentoId){
  const participantes = DB.getParticipantesChaveamento(chaveamentoId)
    .map(p => ({ participante: p, aluno: DB.getAluno(p.alunoId) }))
    .filter(x => x.aluno)
    .sort((a, b) => a.aluno.nome.localeCompare(b.aluno.nome, 'pt-BR'));
  const previa = DB.previaReorganizacaoChaveamento(chaveamentoId);
  const disponiveisAdicionar = DB.alunosDisponiveisParaAdicionar(chaveamentoId);
  const posicoesLivres = DB.confrontosComPosicaoDisponivel(chaveamentoId);

  return `
    <div class="bloco" style="background: var(--fundo); border-style:dashed;">
      <h3 style="margin:0; font-size:14px;">📋 CONTROLE DA CHAVE</h3>
    </div>
    <div class="bloco">
      <h3 style="margin-bottom:10px;">👥 Participantes</h3>
      ${participantes.map(({ participante, aluno }) => `
        <div class="linha-participante-chave" data-aluno-id="${aluno.id}">
          <label class="rotulo-falta">
            <input type="checkbox" data-acao="toggle-falta" data-id="${aluno.id}" ${!participante.presente ? 'checked' : ''}>
            <span>${aluno.nome}${!participante.presente ? ' <span class="selo-tipo-resultado">❌ Falta</span>' : ''}</span>
          </label>
          <button type="button" class="botao-texto" data-acao="remover-aluno" data-id="${aluno.id}" style="color:#B23A3A;">➖ Remover</button>
        </div>
      `).join('')}
    </div>

    <div class="bloco">
      <h3 style="margin-bottom:8px;">🔄 Reorganizar chave</h3>
      ${previa ? `
        <p style="font-size:12.5px; color:var(--texto-suave); margin:0 0 10px;">
          Afeta ${previa.totalConfrontos} confronto(s) pendente(s) da fase "${previa.nomeFase}".
          ${previa.faltosos.length ? `Vai retirar: ${previa.faltosos.map(a => a.nome).join(', ')}.` : 'Nenhuma falta marcada nesta fase ainda.'}
        </p>
        <button class="botao botao-secundario" id="btnReorganizarChave" type="button" style="width:100%;">🔄 Reorganizar chave</button>
      ` : '<p style="font-size:12.5px; color:var(--texto-suave); margin:0;">Não há confrontos pendentes para reorganizar.</p>'}
    </div>

    <div class="bloco">
      <h3 style="margin-bottom:8px;">🔀 Trocar posições</h3>
      <p style="font-size:12.5px; color:var(--texto-suave); margin:0 0 10px;">Só é possível trocar participantes da rodada inicial que ainda não jogaram.</p>
      <div class="campo">
        <label>Posição 1</label>
        <select id="trocaPos1"><option value="">Selecione...</option>${htmlOpcoesRodada1(chaveamentoId)}</select>
      </div>
      <div class="campo" style="margin-top:8px;">
        <label>Posição 2</label>
        <select id="trocaPos2"><option value="">Selecione...</option>${htmlOpcoesRodada1(chaveamentoId)}</select>
      </div>
      <button class="botao botao-secundario" id="btnConfirmarTroca" type="button" style="width:100%; margin-top:10px;">🔀 Confirmar troca</button>
    </div>

    <div class="bloco">
      <h3 style="margin-bottom:8px;">➕ Adicionar aluno</h3>
      ${!disponiveisAdicionar.length ? '<p style="font-size:12.5px; color:var(--texto-suave); margin:0;">Nenhum aluno inscrito nesta modalidade/categoria disponível para adicionar.</p>' : !posicoesLivres.length ? `
        <p style="font-size:12.5px; color:var(--texto-suave); margin:0;">Há alunos disponíveis, mas nenhuma posição livre no momento. Use "🔄 Reorganizar chave" (com alguém marcado como falta) para abrir uma posição.</p>
      ` : `
        <div class="campo">
          <label>Aluno</label>
          <select id="adicionarAlunoSelect">${disponiveisAdicionar.map(a => `<option value="${a.id}">${a.nome}</option>`).join('')}</select>
        </div>
        <div class="campo" style="margin-top:8px;">
          <label>Posição</label>
          <select id="adicionarPosicaoSelect">${posicoesLivres.map(c => `<option value="${c.id}">${c.fase} — Jogo ${c.ordem + 1}${c.alunoAId ? ` (com ${DB.getAluno(c.alunoAId)?.nome || '—'})` : ''}</option>`).join('')}</select>
        </div>
        <button class="botao botao-secundario" id="btnAdicionarAluno" type="button" style="width:100%; margin-top:10px;">➕ Adicionar</button>
      `}
    </div>
  `;
}
function htmlOpcoesRodada1(chaveamentoId){
  const confrontos = DB.getConfrontos(chaveamentoId).filter(c => c.faseIndex === 0 && !c.terceiroLugar && c.status !== 'Finalizado' && c.tipoResultado !== 'bye');
  const alunos = [];
  confrontos.forEach(c => {
    if(c.alunoAId) alunos.push(DB.getAluno(c.alunoAId));
    if(c.alunoBId) alunos.push(DB.getAluno(c.alunoBId));
  });
  return alunos.filter(Boolean).map(a => `<option value="${a.id}">${a.nome}</option>`).join('');
}
function ligarEventosFerramentasChaveamento(chaveamentoId){
  const painel = document.getElementById('painelFerramentasChave');
  if(!painel) return;

  painel.addEventListener('change', async e => {
    const chk = e.target.closest('input[data-acao="toggle-falta"]');
    if(!chk) return;
    DB.marcarFaltaChaveamento(chaveamentoId, chk.dataset.id, chk.checked);
    mostrarToast(chk.checked ? 'Falta marcada.' : 'Falta desmarcada.');
    rerenderizarChaveamentoDetalhe(chaveamentoId);
  });

  painel.addEventListener('click', e => {
    const btnRemover = e.target.closest('button[data-acao="remover-aluno"]');
    if(btnRemover){
      const aluno = DB.getAluno(btnRemover.dataset.id);
      if(!confirm(`Remover ${aluno ? aluno.nome : 'este aluno'} deste chaveamento?\n\nO cadastro e a inscrição dele NÃO são afetados.`)) return;
      try {
        const resultado = DB.removerAlunoDoChaveamento(chaveamentoId, btnRemover.dataset.id);
        mostrarToast(resultado.mensagem);
        rerenderizarChaveamentoDetalhe(chaveamentoId);
      } catch(err){
        alert(err.message || 'Não foi possível remover este aluno.');
      }
      return;
    }

    const btnReorganizar = e.target.closest('#btnReorganizarChave');
    if(btnReorganizar){
      const previa = DB.previaReorganizacaoChaveamento(chaveamentoId);
      if(!previa) return;
      const mensagem = `Esta ação reorganizará os ${previa.totalConfrontos} confronto(s) ainda não iniciados da fase "${previa.nomeFase}".${previa.faltosos.length ? `\n\nSerão retirados: ${previa.faltosos.map(a => a.nome).join(', ')}.` : ''}\n\nConfrontos já finalizados não serão alterados.\n\nDeseja continuar?`;
      if(!confirm(mensagem)) return;
      try {
        DB.reorganizarChaveamento(chaveamentoId);
        mostrarToast('Chave reorganizada.');
        rerenderizarChaveamentoDetalhe(chaveamentoId);
      } catch(err){
        alert(err.message || 'Não foi possível reorganizar.');
      }
      return;
    }

    const btnTroca = e.target.closest('#btnConfirmarTroca');
    if(btnTroca){
      const id1 = document.getElementById('trocaPos1').value;
      const id2 = document.getElementById('trocaPos2').value;
      if(!id1 || !id2){ alert('Selecione as duas posições.'); return; }
      if(id1 === id2){ alert('Selecione dois participantes diferentes.'); return; }
      const nome1 = DB.getAluno(id1)?.nome, nome2 = DB.getAluno(id2)?.nome;
      if(!confirm(`Trocar ${nome1} ↔ ${nome2}?`)) return;
      try {
        DB.trocarPosicoesChaveamento(chaveamentoId, id1, id2);
        mostrarToast('Posições trocadas.');
        rerenderizarChaveamentoDetalhe(chaveamentoId);
      } catch(err){
        alert(err.message || 'Não foi possível trocar essas posições.');
      }
      return;
    }

    const btnAdicionar = e.target.closest('#btnAdicionarAluno');
    if(btnAdicionar){
      const alunoId = document.getElementById('adicionarAlunoSelect').value;
      const confrontoId = document.getElementById('adicionarPosicaoSelect').value;
      if(!alunoId || !confrontoId) return;
      try {
        DB.adicionarAlunoAoChaveamento(chaveamentoId, alunoId, confrontoId);
        mostrarToast('Aluno adicionado.');
        rerenderizarChaveamentoDetalhe(chaveamentoId);
      } catch(err){
        alert(err.message || 'Não foi possível adicionar este aluno.');
      }
    }
  });
}

function renderAreaAtualizarSeletiva(chaveamentoId){
  const area = document.getElementById('areaAtualizarSeletiva');
  if(!area) return;
  const c = DB.getChaveamento(chaveamentoId);
  const campeao = DB.getAluno(c.campeaoAlunoId);
  const vice = c.viceAlunoId ? DB.getAluno(c.viceAlunoId) : null;
  if(!campeao) return;

  area.innerHTML = `
    <div class="bloco">
      <h3>Atualizar seletiva</h3>
      <p style="font-size:13px; color:var(--texto-suave); margin:-4px 0 12px;">Confira a sugestão antes de aplicar.</p>
      <div class="linha-colocacao">
        <span class="nome-time-coloc">🥇 ${campeao.nome}</span>
        <select id="statusSugeridoCampeao" class="select-status" style="width:auto;">
          ${OPCOES_STATUS_SELETIVA.map(o => `<option value="${o.v}" ${o.v === 'Classificado' ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
      </div>
      ${vice ? `
        <div class="linha-colocacao">
          <span class="nome-time-coloc">🥈 ${vice.nome}</span>
          <select id="statusSugeridoVice" class="select-status" style="width:auto;">
            ${OPCOES_STATUS_SELETIVA.map(o => `<option value="${o.v}" ${o.v === 'Reserva' ? 'selected' : ''}>${o.label}</option>`).join('')}
          </select>
        </div>
      ` : ''}
      <button class="botao botao-primario" id="btnConfirmarAtualizarSeletiva" type="button" style="width:100%; margin-top:10px;">Confirmar atualização da seletiva</button>
    </div>
  `;

  document.getElementById('btnConfirmarAtualizarSeletiva').addEventListener('click', async () => {
    const btn = document.getElementById('btnConfirmarAtualizarSeletiva');
    const ok = await executarComFeedback(btn, 'Salvando...', async () => {
      const seletiva = await DB.obterOuCriarSeletiva(c.modalidadeId, c.serieId, c.categoria);
      await aplicarStatusSeletivaComLimite(seletiva, campeao.id, document.getElementById('statusSugeridoCampeao').value);
      if(vice){
        await aplicarStatusSeletivaComLimite(seletiva, vice.id, document.getElementById('statusSugeridoVice').value);
      }
    });
    if(!ok) return;
    mostrarToast('Seletiva atualizada.');
    area.innerHTML = '';
  });
}

async function aplicarStatusSeletivaComLimite(seletiva, alunoId, statusDesejado){
  const participacao = await DB.obterOuCriarParticipacao(seletiva.id, alunoId);
  let statusFinal = statusDesejado;
  if(statusDesejado === 'Classificado' && seletiva.vagas > 0){
    const jaClassificados = DB.contarClassificados(seletiva.id, participacao.id);
    if(jaClassificados >= seletiva.vagas){
      const aceitaReserva = confirm(`⚠️ Limite de vagas atingido para ${DB.getAluno(alunoId).nome}.\n\nDeseja colocar como reserva?`);
      statusFinal = aceitaReserva ? 'Reserva' : participacao.status;
    }
  }
  await DB.atualizarParticipacao(participacao.id, { status: statusFinal });
}

function ligarEventosChaveamentoDetalhe(chaveamentoId){
  const areaBracket = document.getElementById('areaBracket');

  areaBracket.addEventListener('click', e => {
    const btnToggle = e.target.closest('button[data-acao="toggle-opcoes"]');
    if(btnToggle){
      const painel = document.getElementById(`opcoes-${btnToggle.dataset.id}`);
      if(painel) painel.style.display = painel.style.display === 'none' ? 'grid' : 'none';
      return;
    }

    const btnCorrigir = e.target.closest('button[data-acao="corrigir-vencedor"]');
    if(btnCorrigir){
      const confrontoId = btnCorrigir.dataset.id;
      const dependente = DB.existeResultadoPosteriorDependente(confrontoId);
      const avisoFaseSeguinte = DB.temFaseSeguinteGerada(chaveamentoId)
        ? '\n\n⚠️ Repescagem e/ou final já foram geradas a partir deste chaveamento. Elas NÃO são atualizadas automaticamente -- se a correção mudar quem ganhou/perdeu, use "🎲 Refazer sorteio" na repescagem/final depois de corrigir aqui.'
        : '';
      const mensagem = (dependente
        ? '⚠️ Alterar este resultado afetará confrontos posteriores.\n\nOs resultados que dependem dele serão desfeitos (quem avançou por engano deixará de aparecer na fase seguinte). Deseja continuar?'
        : 'Deseja corrigir o vencedor deste confronto?') + avisoFaseSeguinte;
      if(!confirm(mensagem)) return;
      confrontosEmEdicao.add(confrontoId);
      rerenderizarChaveamentoDetalhe(chaveamentoId);
      return;
    }

    const btnCancelarCorrecao = e.target.closest('button[data-acao="cancelar-correcao"]');
    if(btnCancelarCorrecao){
      confrontosEmEdicao.delete(btnCancelarCorrecao.dataset.id);
      rerenderizarChaveamentoDetalhe(chaveamentoId);
      return;
    }

    // Bloco 3: adiar jogo -- não decide nada, só marca o confronto como
    // pendente de remarcação. "Retomar" volta ao fluxo normal.
    const btnAdiar = e.target.closest('button[data-acao="adiar"]');
    if(btnAdiar){
      if(!confirm('Adiar este jogo?\n\nEle ficará marcado como pendente até você retomar e registrar o resultado.')) return;
      try {
        DB.adiarConfronto(btnAdiar.dataset.id);
        mostrarToast('Jogo adiado.');
        rerenderizarChaveamentoDetalhe(chaveamentoId);
      } catch(err){
        alert(err.message || 'Não foi possível adiar este jogo.');
      }
      return;
    }
    const btnRetomarAdiado = e.target.closest('button[data-acao="retomar-adiado"]');
    if(btnRetomarAdiado){
      DB.retomarConfrontoAdiado(btnRetomarAdiado.dataset.id);
      mostrarToast('Jogo retomado.');
      rerenderizarChaveamentoDetalhe(chaveamentoId);
      return;
    }

    // Bloco 3: W.O. -- ação dedicada e sempre manual. Clicar em "⚠️ W.O."
    // só abre a escolha de quem vence; nada é decidido sozinho.
    const btnToggleWO = e.target.closest('button[data-acao="toggle-wo"]');
    if(btnToggleWO){
      const painel = document.getElementById(`wo-${btnToggleWO.dataset.id}`);
      if(painel) painel.style.display = painel.style.display === 'none' ? 'grid' : 'none';
      return;
    }
    const btnConfirmarWO = e.target.closest('button[data-acao="confirmar-wo"]');
    if(btnConfirmarWO){
      const confrontoId = btnConfirmarWO.dataset.id;
      const vencedorAlunoId = btnConfirmarWO.dataset.vencedor;
      if(!confirm('Tem certeza que deseja registrar W.O. para este confronto?')) return;
      DB.definirVencedorConfronto(confrontoId, vencedorAlunoId, { tipoResultado:'wo' });
      mostrarToast('W.O. registrado.');
      rerenderizarChaveamentoDetalhe(chaveamentoId);
      return;
    }

    const btnVencedor = e.target.closest('button[data-acao="vencedor"]');
    if(btnVencedor){
      const confrontoId = btnVencedor.dataset.id;
      const vencedorAlunoId = btnVencedor.dataset.vencedor;
      const vencedorAluno = DB.getAluno(vencedorAlunoId);
      const tipoResultado = document.getElementById(`tipoResultado-${confrontoId}`)?.value || 'normal';
      const mensagemConfirmacao = tipoResultado === 'wo'
        ? 'Tem certeza que deseja registrar W.O. para este confronto?'
        : `Confirma ${vencedorAluno.nome} como vencedor?`;
      if(!confirm(mensagemConfirmacao)) return;

      const placar = document.getElementById(`placar-${confrontoId}`)?.value.trim() || null;
      const observacao = document.getElementById(`observacao-${confrontoId}`)?.value.trim() || '';

      if(confrontosEmEdicao.has(confrontoId)){
        DB.corrigirVencedorConfronto(confrontoId, vencedorAlunoId, { tipoResultado, placar, observacao });
        confrontosEmEdicao.delete(confrontoId);
      } else {
        DB.definirVencedorConfronto(confrontoId, vencedorAlunoId, { tipoResultado, placar, observacao });
      }
      mostrarToast('Resultado registrado.');
      rerenderizarChaveamentoDetalhe(chaveamentoId);
    }
  });

  document.getElementById('btnToggleFerramentas').addEventListener('click', () => {
    painelFerramentasChaveAberto = !painelFerramentasChaveAberto;
    const painel = document.getElementById('painelFerramentasChave');
    painel.style.display = painelFerramentasChaveAberto ? 'block' : 'none';
  });
  ligarEventosFerramentasChaveamento(chaveamentoId);

  document.getElementById('btnRefazerSorteio').addEventListener('click', () => {
    const chav = DB.getChaveamento(chaveamentoId);
    const confrontosAtuais = DB.getConfrontos(chaveamentoId);
    const temResultado = confrontosAtuais.some(cf => cf.vencedorAlunoId && cf.tipoResultado !== 'bye');
    const mensagem = temResultado
      ? '⚠️ Este chaveamento já possui resultados.\n\nRefazer o sorteio apagará os confrontos e resultados deste chaveamento (os alunos e as inscrições NÃO são afetados).\n\nDeseja realmente refazer o chaveamento?'
      : 'Deseja sortear novamente os confrontos?';
    if(!confirm(mensagem)) return;

    const participantesAtuais = DB.getParticipantesChaveamento(chaveamentoId).map(p => DB.getAluno(p.alunoId)).filter(Boolean);
    const novaOrdem = DB.embaralharFisherYates(participantesAtuais);
    DB.montarChaveamento({
      serieId: chav.serieId, turmaId: chav.turmaId, modalidadeId: chav.modalidadeId, categoria: chav.categoria,
      disputaTerceiro: chav.disputaTerceiro, participantesEmbaralhados: novaOrdem,
      chaveamentoExistenteId: chaveamentoId
    });
    mostrarToast('Sorteio refeito.');
    rerenderizarChaveamentoDetalhe(chaveamentoId);
  });

  const btnAtualizarSeletiva = document.getElementById('btnAtualizarSeletiva');
  if(btnAtualizarSeletiva){
    btnAtualizarSeletiva.addEventListener('click', () => renderAreaAtualizarSeletiva(chaveamentoId));
  }

  const btnSalvarQuantidadeClassificados = document.getElementById('btnSalvarQuantidadeClassificados');
  if(btnSalvarQuantidadeClassificados){
    btnSalvarQuantidadeClassificados.addEventListener('click', () => {
      const cAtual = DB.getChaveamento(chaveamentoId);
      const tipoAtualLocal = cAtual.tipo || 'principal';
      const raizIdLocal = tipoAtualLocal === 'principal' ? cAtual.id : cAtual.chaveamentoPrincipalId;
      const definitivoId = DB.classificadosChaveamento(raizIdLocal).definitivoId;
      if(!definitivoId) return;
      const quantidade = Number(document.getElementById('quantidadeClassificadosSelect').value);
      DB.definirQuantidadeClassificados(definitivoId, quantidade);
      mostrarToast(quantidade > 0 ? `${quantidade} classificado(s) definido(s).` : 'Quantidade removida.');
      rerenderizarChaveamentoDetalhe(chaveamentoId);
    });
  }

  // Etapa 2B-3: gerar repescagem/final -- reaproveita DB.montarChaveamento
  // (mesmo motor de sorteio/BYE do Bloco 7). Nada é gerado sem o professor
  // clicar explicitamente no botão.
  const btnGerarRepescagem = document.getElementById('btnGerarRepescagemChave');
  if(btnGerarRepescagem){
    btnGerarRepescagem.addEventListener('click', () => {
      const c = DB.getChaveamento(chaveamentoId);
      const raizId = (c.tipo || 'principal') === 'principal' ? c.id : c.chaveamentoPrincipalId;
      const perdedores = DB.obterPerdedoresChaveamento(raizId);
      if(!confirm(`Gerar repescagem com ${perdedores.length} participante(s) que perderam na fase principal?`)) return;
      try {
        const repescagem = DB.gerarRepescagem(raizId);
        mostrarToast('Repescagem gerada.');
        location.hash = `#/chaveamentos/${repescagem.id}`;
      } catch(err){
        console.error('Erro ao gerar repescagem:', err);
        alert(err.message || 'Não foi possível gerar a repescagem.');
      }
    });
  }
  const btnGerarFinal = document.getElementById('btnGerarFinalChave');
  if(btnGerarFinal){
    btnGerarFinal.addEventListener('click', () => {
      const c = DB.getChaveamento(chaveamentoId);
      const raizId = (c.tipo || 'principal') === 'principal' ? c.id : c.chaveamentoPrincipalId;
      if(!confirm('Gerar a final entre o campeão da fase principal e o campeão da repescagem?')) return;
      try {
        const final = DB.gerarFinal(raizId);
        mostrarToast('Final gerada.');
        location.hash = `#/chaveamentos/${final.id}`;
      } catch(err){
        console.error('Erro ao gerar final:', err);
        alert(err.message || 'Não foi possível gerar a final.');
      }
    });
  }
}
function rerenderizarChaveamentoDetalhe(chaveamentoId){
  const app = document.getElementById('app');
  app.innerHTML = telaChaveamentoDetalhe(chaveamentoId);
  ligarEventosChaveamentoDetalhe(chaveamentoId);
  window.scrollTo(0, 0);
}

/* ---------- Etapa 2B-3: caminho/trajetória de um participante através de
   Fase Principal + Repescagem + Final -- substitui o controle em papel.
   Só leitura (DB.obterCaminhoParticipante), nenhuma tabela nova. ---------- */
const ROTULOS_STATUS_CAMINHO = {
  'avancando': '🟢 Avançando',
  'aguardando-repescagem': '🟢 Avançando (perdeu a fase principal, aguardando repescagem)',
  'aguardando-final': '🟢 Avançando (aguardando a final)',
  'eliminado': '🔴 Eliminado',
  'finalista': '🏆 Finalista',
  'vice-campeao': '🥈 Vice-campeão',
  'campeao': '🥇 Campeão',
  'nao-participou': '— Não participou desta seletiva/chaveamento'
};
const ROTULOS_ORIGEM_CAMINHO = { principal:'🏆 Fase Principal', repescagem:'🔄 Repescagem', final:'🥇 Final' };

function telaCaminhoParticipante(raizId){
  const { principal, repescagem } = DB.obterFamiliaChaveamento(raizId);
  if(!principal){
    return `<button class="botao-voltar" onclick="location.hash='#/chaveamentos/lista'">&larr; Chaveamentos</button>
      <div class="tela-em-breve"><div class="icone-grande">❓</div><h2>Chaveamento não encontrado</h2></div>`;
  }
  const modalidade = DB.getModalidades().find(m => m.id === principal.modalidadeId);
  const idsParticipantes = new Set([
    ...DB.getParticipantesChaveamento(principal.id).map(p => p.alunoId),
    ...(repescagem ? DB.getParticipantesChaveamento(repescagem.id).map(p => p.alunoId) : [])
  ]);
  const alunos = [...idsParticipantes].map(id => DB.getAluno(id)).filter(Boolean)
    .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

  return `
    <button class="botao-voltar" onclick="location.hash='#/chaveamentos/${principal.id}'">&larr; Voltar ao chaveamento</button>
    <div class="secao-titulo">📍 Caminho do participante</div>
    <p style="font-size:13px; color:var(--texto-suave); margin:-10px 0 12px;">${iconeModalidade(modalidade ? modalidade.nome : '')} ${modalidade ? modalidade.nome : ''} · ${nomeExibidoTurma(principal.turmaId)} · ${principal.categoria}</p>
    <div class="bloco">
      <div class="campo" style="margin-bottom:0;">
        <label for="selParticipanteCaminho">Escolha um participante</label>
        <select id="selParticipanteCaminho">
          <option value="">Selecione...</option>
          ${alunos.map(a => `<option value="${a.id}">${a.nome}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="areaCaminhoParticipante"></div>
  `;
}

function renderCaminhoParticipante(raizId, alunoId){
  const area = document.getElementById('areaCaminhoParticipante');
  if(!area) return;
  if(!alunoId){ area.innerHTML = ''; return; }
  const aluno = DB.getAluno(alunoId);
  if(!aluno){ area.innerHTML = ''; return; }
  const { passos, status } = DB.obterCaminhoParticipante(raizId, alunoId);

  function linha(p){
    const origem = `<span style="color:var(--texto-suave); font-size:12px;">(${ROTULOS_ORIGEM_CAMINHO[p.origem]})</span>`;
    if(p.tipo === 'bye') return `<li>⭐ BYE — avanço automático ${origem}</li>`;
    if(p.tipo === 'aguardando') return `<li>⏳ Aguardando confronto${p.oponente ? ` contra ${p.oponente.nome}` : ''} ${origem}</li>`;
    const venceu = p.tipo === 'venceu';
    const wo = p.wo ? ' <span class="selo-tipo-resultado">W.O.</span>' : '';
    return `<li>${venceu ? '✅ Venceu' : '❌ Perdeu para'} ${p.oponente ? p.oponente.nome : '—'}${wo} ${origem}</li>`;
  }

  area.innerHTML = `
    <div class="bloco">
      <h3 style="margin-bottom:6px;">${aluno.nome}</h3>
      <span class="selo-status-seletiva ${status === 'campeao' ? 'selo-concluida' : 'selo-pendente'}" style="display:inline-block; margin-bottom:14px;">${ROTULOS_STATUS_CAMINHO[status] || status}</span>
      <ol class="lista-numerada">
        ${passos.length ? passos.map(linha).join('') : '<li style="color:var(--texto-suave);">Ainda sem confrontos registrados.</li>'}
      </ol>
      ${passos.length ? `<a href="#/relatorios/caminho-imprimir/${raizId}/${alunoId}" class="botao botao-secundario no-print" style="display:block; text-align:center; margin-top:14px; text-decoration:none;">🖨️ Imprimir este caminho</a>` : ''}
    </div>
  `;
}

function ligarEventosCaminhoParticipante(raizId){
  const sel = document.getElementById('selParticipanteCaminho');
  if(!sel) return;
  sel.addEventListener('change', () => renderCaminhoParticipante(raizId, sel.value));
}

/* ---------- Impressão do caminho do participante (Etapa 2B-6) ----------
   Reaproveita DB.obterCaminhoParticipante (2B-3) -- só formata os mesmos
   passos para impressão, sem recalcular nada. */
function conteudoRelatorioCaminho(raizId, alunoId){
  const familia = DB.obterFamiliaChaveamento(raizId);
  if(!familia.principal) return '';
  const aluno = DB.getAluno(alunoId);
  if(!aluno) return '';
  const modalidade = DB.getModalidades().find(m => m.id === familia.principal.modalidadeId);
  const { passos, status } = DB.obterCaminhoParticipante(raizId, alunoId);

  function rotuloOrigem(origem){
    return ROTULOS_ORIGEM_CAMINHO[origem].replace(/^\S+\s/, '').toUpperCase();
  }
  function linhaImpressao(p){
    if(p.tipo === 'bye'){
      return `<div class="secao-relatorio"><h3>${rotuloOrigem(p.origem)}</h3><div class="confronto-relatorio"><span>⭐ ${aluno.nome}</span><span>BYE — avanço automático</span></div></div>`;
    }
    if(p.tipo === 'aguardando'){
      return `<div class="secao-relatorio"><h3>${rotuloOrigem(p.origem)}</h3><div class="confronto-relatorio"><span>${aluno.nome}  ×  ${p.oponente ? p.oponente.nome : '<span class="lacuna-preenchimento">&nbsp;</span>'}</span><span>Aguardando resultado</span></div></div>`;
    }
    const venceu = p.tipo === 'venceu';
    const wo = p.wo ? ' (W.O.)' : '';
    return `
      <div class="secao-relatorio">
        <h3>${rotuloOrigem(p.origem)}</h3>
        <div class="confronto-relatorio"><span>${aluno.nome}  ×  ${p.oponente ? p.oponente.nome : '—'}</span><span>${venceu ? '✔ Venceu' : '✘ Perdeu'}${wo}</span></div>
      </div>
    `;
  }

  return `
    ${cabecalhoRelatorioHtml('CAMINHO DO PARTICIPANTE', `${aluno.nome} — ${modalidade ? modalidade.nome : ''} — ${familia.principal.categoria}`)}
    ${passos.length ? passos.map(linhaImpressao).join('') : '<p style="color:var(--texto-suave); font-size:14px;">Nenhum confronto registrado ainda.</p>'}
    <div class="secao-relatorio">
      <div class="linha-relatorio" style="font-weight:700;"><span>Situação atual</span><span>${ROTULOS_STATUS_CAMINHO[status] || status}</span></div>
    </div>
  `;
}
function telaRelatorioCaminho(raizId, alunoId){
  const conteudo = conteudoRelatorioCaminho(raizId, alunoId);
  if(!conteudo) return `<div class="tela-em-breve"><h2>Não encontrado</h2></div>`;
  definirOrientacaoImpressao('portrait');
  return `
    ${barraAcoesRelatorioHtml(`#/chaveamentos/caminho/${raizId}`)}
    <div class="folha-relatorio">${conteudo}</div>
  `;
}

/* ============================================================
   FINAIS DO JIBA ENTRE REPRESENTANTES DAS TURMAS (Bloco 8)
   Reaproveita o mesmo algoritmo do Bloco 7 (Fisher-Yates, BYE
   aleatório, propagação, reconstrução em cascata, 3º lugar),

============================================================ */

let representantesState = null;
let confrontosFinalJibaEmEdicao = new Set();

function renderListaFinaisJiba(){
  const container = document.getElementById('listaFinaisJibaContainer');
  if(!container) return;
  const filtroSerie = document.getElementById('filtroSerieFinal')?.value || '';
  const filtroModalidade = document.getElementById('filtroModalidadeFinal')?.value || '';
  const filtroCategoria = document.getElementById('filtroCategoriaFinal')?.value || '';
  const filtroStatus = document.getElementById('filtroStatusFinal')?.value || '';
  let lista = DB.getFinaisJiba();
  if(filtroSerie) lista = lista.filter(f => f.serieId === filtroSerie);
  if(filtroModalidade) lista = lista.filter(f => f.modalidadeId === filtroModalidade);
  if(filtroCategoria) lista = lista.filter(f => f.categoria === filtroCategoria);
  if(filtroStatus) lista = lista.filter(f => f.status === filtroStatus);
  lista = lista.slice().sort((a, b) => new Date(b.atualizadoEm) - new Date(a.atualizadoEm));
  container.innerHTML = lista.length
    ? lista.map(cardFinalJibaHtml).join('')
    : '<p style="color:var(--texto-suave); font-size:14px; text-align:center; padding:20px 0;">Nenhuma Final encontrada.</p>';
}
function ligarEventosListaFinaisJiba(statusInicial){
  if(statusInicial) document.getElementById('filtroStatusFinal').value = statusInicial;
  renderListaFinaisJiba();
  document.getElementById('btnAlternarFiltrosFinal').addEventListener('click', () => {
    document.getElementById('painelFiltrosFinal').classList.toggle('aberto');
  });
  ['filtroSerieFinal','filtroModalidadeFinal','filtroCategoriaFinal','filtroStatusFinal'].forEach(id => {
    document.getElementById(id).addEventListener('change', renderListaFinaisJiba);
  });
}

function telaSelecaoRepresentantes(serieId, modalidadeId, categoria){
  const serie = DB.getSeries().find(s => s.id === serieId);
  const modalidade = DB.getModalidades().find(m => m.id === modalidadeId);
  if(!serie || !modalidade){
    return `<button class="botao-voltar" onclick="location.hash='#/finais-jiba'">&larr; Finais JIBA</button>
      <div class="tela-em-breve"><div class="icone-grande">❓</div><h2>Não encontrado</h2></div>`;
  }
  const existentes = DB.getFinaisJibaPorContexto(serieId, modalidadeId, categoria);
  const representantes = DB.getRepresentantesValidos(serieId, modalidadeId, categoria);

  representantesState = representantes.map(r => ({
    turmaId: r.turma.id,
    turmaNome: `${serie.nome} ${r.turma.turma}`,
    representanteOriginalAlunoId: r.campeaoAlunoId,
    participanteAlunoId: r.campeaoAlunoId,
    presente: true, substituido:false, motivoSubstituicao:'',
    chaveamentoOrigem: r.chaveamento
  }));
  previewSorteioJiba = null;

  return `
    <button class="botao-voltar" onclick="location.hash='#/finais-jiba/novo/${serieId}/${modalidadeId}'">&larr; Trocar categoria</button>
    <div class="secao-titulo">${iconeModalidade(modalidade.nome)} ${modalidade.nome} — ${serie.nome} — ${categoria}</div>

    ${existentes.length ? `
      <div class="aviso-forte">
        ⚠️ Já existe uma Final JIBA para esta modalidade.
        <div style="display:flex; gap:10px; margin-top:10px;">
          <a href="#/finais-jiba/${existentes[0].id}" class="botao botao-secundario" style="flex:1; text-align:center; text-decoration:none;">Abrir existente</a>
          <button class="botao botao-primario" id="btnCriarOutraFinal" type="button" style="flex:1;">Criar outra</button>
        </div>
      </div>
      <div id="areaRepresentantes" style="display:none;"></div>
    ` : `
      <div id="areaRepresentantes"></div>
    `}
    <div id="areaSorteioJiba"></div>
  `;
}

function renderListaRepresentantes(serieId, modalidadeId, categoria){
  const area = document.getElementById('areaRepresentantes');
  if(!area) return;
  if(!representantesState.length){
    area.innerHTML = '<div class="bloco"><p style="color:var(--texto-suave); font-size:14px;">Nenhum representante disponível: nenhuma turma desta série tem um chaveamento FINALIZADO (Bloco 7) para esta modalidade/categoria ainda.</p></div>';
    return;
  }
  area.innerHTML = `
    <div class="bloco">
      <h3>⭐ Representantes</h3>
      <p style="font-size:13px; color:var(--texto-suave); margin:-4px 0 10px;">Desmarque quem está ausente. Se precisar, substitua antes de sortear.</p>
      ${representantesState.map((r, idx) => `
        <div class="cartao-representante" data-idx="${idx}">
          <label style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" data-acao="presenca-repr" data-idx="${idx}" ${r.presente ? 'checked' : ''} style="width:22px; height:22px;">
            <div style="flex:1;">
              <div class="nome-repr">⭐ ${DB.getAluno(r.participanteAlunoId)?.nome || '—'}${r.substituido ? ' <span class="selo-bye">Substituto</span>' : ''}</div>
              <div class="turma-repr">${r.turmaNome}</div>
            </div>
            ${!r.presente ? '<span class="badge-ausente">🚫 Ausente</span>' : ''}
          </label>
          ${!r.presente ? `
            <button type="button" class="botao-texto" data-acao="abrir-substituicao" data-idx="${idx}" style="margin-top:8px;">🔄 Substituir representante</button>
            <div class="painel-substituicao" id="substituicao-${idx}" style="display:none;"></div>
          ` : ''}
        </div>
      `).join('')}
      <button class="botao botao-primario" id="btnSortearRepresentantes" type="button" style="width:100%; margin-top:12px;">🎲 Sortear confrontos</button>
    </div>
  `;
}

function renderPainelSubstituicao(idx, serieId, modalidadeId, categoria){
  const painel = document.getElementById(`substituicao-${idx}`);
  if(!painel) return;
  const r = representantesState[idx];
  const sugestoes = DB.getSubstitutosSugeridos({
    turma: { id: r.turmaId }, chaveamento: r.chaveamentoOrigem, campeaoAlunoId: r.representanteOriginalAlunoId
  });
  painel.style.display = 'block';
  painel.innerHTML = `
    <div class="campo" style="margin-bottom:8px;">
      <label>Substituto sugerido</label>
      <select id="selSubstituto-${idx}">
        <option value="">Selecione...</option>
        ${sugestoes.map(s => `<option value="${s.aluno.id}">${s.aluno.nome} — ${s.motivo}</option>`).join('')}
      </select>
    </div>
    <div class="campo" style="margin-bottom:8px;">
      <label>Motivo</label>
      <input type="text" id="motivoSubstituicao-${idx}" placeholder="Ex: Campeão ausente no dia do evento">
    </div>
    <button type="button" class="botao botao-secundario" data-acao="confirmar-substituicao" data-idx="${idx}" style="width:100%;">Confirmar substituição</button>
  `;
  painel.querySelector('button[data-acao="confirmar-substituicao"]').addEventListener('click', () => {
    const substitutoId = document.getElementById(`selSubstituto-${idx}`).value;
    if(!substitutoId){ alert('Selecione um substituto.'); return; }
    const motivo = document.getElementById(`motivoSubstituicao-${idx}`).value.trim();
    representantesState[idx].participanteAlunoId = substitutoId;
    representantesState[idx].substituido = true;
    representantesState[idx].motivoSubstituicao = motivo;
    representantesState[idx].presente = true;
    mostrarToast('Substituição registrada.');
    renderListaRepresentantes(serieId, modalidadeId, categoria);
  });
}

function renderPreviewSorteioJiba(serieId, modalidadeId, categoria){
  const area = document.getElementById('areaSorteioJiba');
  if(!area || !previewSorteioJiba) return;
  const ordem = previewSorteioJiba.ordem;
  const N = ordem.length;
  let size = 2;
  while(size < N) size *= 2;
  const numByes = size - N;
  const comBye = ordem.slice(0, numByes);
  const semBye = ordem.slice(numByes);
  const nomesFases = DB.obterNomesFases(size);

  const confrontosPreview = [];
  comBye.forEach(r => confrontosPreview.push({ r, r2:null, bye:true }));
  for(let i = 0; i < semBye.length; i += 2) confrontosPreview.push({ r:semBye[i], r2:semBye[i + 1], bye:false });

  area.innerHTML = `
    <div class="secao-titulo">Prévia do sorteio — ${nomesFases[0]}</div>
    ${confrontosPreview.map((c, idx) => `
      <div class="cartao-confronto-chave">
        <div style="font-size:12px; color:var(--texto-suave); margin-bottom:6px;">Jogo ${idx + 1}</div>
        ${c.bye
          ? `<div class="lado-confronto vencedor">⭐ ${DB.getAluno(c.r.participanteAlunoId).nome}<span class="turma-inline">${c.r.turmaNome}</span><span class="selo-bye">BYE — avanço automático</span></div>`
          : `<div class="lado-confronto">${DB.getAluno(c.r.participanteAlunoId).nome}<span class="turma-inline">${c.r.turmaNome}</span></div><div class="x-confronto-chave">×</div><div class="lado-confronto">${DB.getAluno(c.r2.participanteAlunoId).nome}<span class="turma-inline">${c.r2.turmaNome}</span></div>`
        }
      </div>
    `).join('')}

    <div class="bloco">
      <label style="display:flex; align-items:center; gap:8px; font-weight:600; ${!nomesFases.includes('Semifinal') ? 'opacity:0.5;' : ''}">
        <input type="checkbox" id="checkDisputaTerceiroJiba" ${previewSorteioJiba.disputaTerceiro ? 'checked' : ''} style="width:20px; height:20px;" ${!nomesFases.includes('Semifinal') ? 'disabled' : ''}>
        Disputa de 3º lugar
      </label>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px; margin-top:12px;">
      <button class="botao botao-primario" id="btnConfirmarSorteioJiba" type="button">Confirmar sorteio</button>
      <button class="botao botao-secundario" id="btnSortearNovamenteJiba" type="button">🎲 Sortear novamente</button>
      <button class="botao-texto" id="btnCancelarSorteioJiba" type="button" style="color:#B23A3A;">Cancelar</button>
    </div>
  `;

  const checkT = document.getElementById('checkDisputaTerceiroJiba');
  if(checkT) checkT.addEventListener('change', e => { previewSorteioJiba.disputaTerceiro = e.target.checked; });

  document.getElementById('btnConfirmarSorteioJiba').addEventListener('click', () => {
    const representantesInfo = previewSorteioJiba.ordem.map(r => ({
      turmaId: r.turmaId, representanteOriginalAlunoId: r.representanteOriginalAlunoId,
      participanteAlunoId: r.participanteAlunoId, substituido: r.substituido, motivoSubstituicao: r.motivoSubstituicao
    }));
    const finalJiba = DB.montarFinalJiba({ serieId, modalidadeId, categoria, disputaTerceiro: previewSorteioJiba.disputaTerceiro, representantesInfo });
    mostrarToast('Final do JIBA criada.');
    previewSorteioJiba = null;
    location.hash = `#/finais-jiba/${finalJiba.id}`;
  });
  document.getElementById('btnSortearNovamenteJiba').addEventListener('click', () => {
    previewSorteioJiba.ordem = DB.embaralharFisherYates(previewSorteioJiba.ordem);
    renderPreviewSorteioJiba(serieId, modalidadeId, categoria);
  });
  document.getElementById('btnCancelarSorteioJiba').addEventListener('click', () => {
    previewSorteioJiba = null;
    area.innerHTML = '';
  });
}

function ligarEventosSelecaoRepresentantes(serieId, modalidadeId, categoria){
  renderListaRepresentantes(serieId, modalidadeId, categoria);

  const btnCriarOutra = document.getElementById('btnCriarOutraFinal');
  if(btnCriarOutra){
    btnCriarOutra.addEventListener('click', () => {
      document.getElementById('areaRepresentantes').style.display = 'block';
      btnCriarOutra.closest('.aviso-forte').style.display = 'none';
    });
  }

  const area = document.getElementById('areaRepresentantes');
  area.addEventListener('change', e => {
    const chk = e.target.closest('input[data-acao="presenca-repr"]');
    if(!chk) return;
    const idx = Number(chk.dataset.idx);
    representantesState[idx].presente = chk.checked;
    if(chk.checked){
      representantesState[idx].participanteAlunoId = representantesState[idx].representanteOriginalAlunoId;
      representantesState[idx].substituido = false;
      representantesState[idx].motivoSubstituicao = '';
    }
    renderListaRepresentantes(serieId, modalidadeId, categoria);
  });
  area.addEventListener('click', e => {
    const btnAbrir = e.target.closest('button[data-acao="abrir-substituicao"]');
    if(btnAbrir) renderPainelSubstituicao(Number(btnAbrir.dataset.idx), serieId, modalidadeId, categoria);
  });

  const btnSortear = document.getElementById('btnSortearRepresentantes');
  if(btnSortear){
    btnSortear.addEventListener('click', () => {
      const presentes = representantesState.filter(r => r.presente);
      if(!presentes.length){
        alert('⚠️ É necessário ao menos 1 representante presente.');
        return;
      }
      if(presentes.length === 1){
        const unico = presentes[0];
        const confirmado = confirm(`🏆 Campeão por ausência dos demais representantes.\n\n${DB.getAluno(unico.participanteAlunoId).nome} (${unico.turmaNome}) será declarado campeão.\n\nConfirma?`);
        if(!confirmado) return;
        const finalJiba = DB.finalizarPorAusenciaDosDemais({ serieId, modalidadeId, categoria, campeaoAlunoId: unico.participanteAlunoId });
        mostrarToast('Campeão definido por ausência dos demais.');
        location.hash = `#/finais-jiba/${finalJiba.id}`;
        return;
      }
      previewSorteioJiba = { ordem: DB.embaralharFisherYates(presentes), disputaTerceiro:false };
      renderPreviewSorteioJiba(serieId, modalidadeId, categoria);
      document.getElementById('areaSorteioJiba').scrollIntoView({ behavior:'smooth' });
    });
  }
}

function cardConfrontoFinalJibaHtml(c){
  const alunoA = c.alunoAId ? DB.getAluno(c.alunoAId) : null;
  const alunoB = c.alunoBId ? DB.getAluno(c.alunoBId) : null;

  if(c.tipoResultado === 'bye'){
    return `
      <div class="cartao-confronto-chave finalizado" data-id="${c.id}">
        <div class="lado-confronto vencedor">⭐ ${alunoA ? alunoA.nome : '—'}<span class="turma-inline">${nomeExibidoTurma(c.turmaAId)}</span><span class="selo-bye">BYE — avanço automático</span></div>
      </div>
    `;
  }
  if(!alunoA || !alunoB){
    return `
      <div class="cartao-confronto-chave" data-id="${c.id}">
        <div class="lado-confronto">${alunoA ? alunoA.nome + `<span class="turma-inline">${nomeExibidoTurma(c.turmaAId)}</span>` : '⏳ Aguardando definição'}</div>
        <div class="x-confronto-chave">×</div>
        <div class="lado-confronto">${alunoB ? alunoB.nome + `<span class="turma-inline">${nomeExibidoTurma(c.turmaBId)}</span>` : '⏳ Aguardando definição'}</div>
      </div>
    `;
  }
  const finalizado = c.status === 'Finalizado';
  const editando = confrontosFinalJibaEmEdicao.has(c.id);

  if(finalizado && !editando){
    const tags = [];
    if(c.tipoResultado === 'wo') tags.push('<span class="selo-tipo-resultado">W.O.</span>');
    if(c.tipoResultado === 'desistencia') tags.push('<span class="selo-tipo-resultado">Desistência</span>');
    return `
      <div class="cartao-confronto-chave finalizado" data-id="${c.id}">
        <div class="lado-confronto ${c.vencedorAlunoId === alunoA.id ? 'vencedor' : 'perdedor'}">${alunoA.nome}<span class="turma-inline">${nomeExibidoTurma(c.turmaAId)}</span>${c.vencedorAlunoId === alunoA.id ? ' 🏆' : ''}</div>
        <div class="x-confronto-chave">×</div>
        <div class="lado-confronto ${c.vencedorAlunoId === alunoB.id ? 'vencedor' : 'perdedor'}">${alunoB.nome}<span class="turma-inline">${nomeExibidoTurma(c.turmaBId)}</span>${c.vencedorAlunoId === alunoB.id ? ' 🏆' : ''}</div>
        ${c.placar ? `<div style="text-align:center; font-size:13px; color:var(--texto-suave); margin-top:6px;">Placar: ${c.placar}</div>` : ''}
        ${tags.length ? `<div style="text-align:center; margin-top:6px;">${tags.join(' ')}</div>` : ''}
        ${c.observacao ? `<div style="text-align:center; font-size:12.5px; color:var(--texto-suave); margin-top:4px;">📝 ${c.observacao}</div>` : ''}
