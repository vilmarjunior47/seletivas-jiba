  // -- Cálculo agregado de pontos por turma --
  function calcularPontosColetivosDaTurma(turmaId){
    let total = 0;
    getResultadosModalidade().filter(r => r.tipo === 'coletiva').forEach(r => {
      const colocacao = getColocacoesDoResultado(r.id).find(c => c.turmaId === turmaId);
      if(colocacao) total += getPontosPorPosicao(colocacao.posicao);
    });
    return total;
  }
  function calcularPontosIndividuaisDaTurma(turmaId){
    let total = 0;
    getResultadosModalidade().filter(r => r.tipo === 'individual').forEach(r => {
      getColocacoesDoResultado(r.id).forEach(c => {
        const aluno = getAluno(c.alunoId);
        if(aluno && aluno.turmaId === turmaId) total += getPontosPorPosicao(c.posicao);
      });
    });
    return total;
  }
  function calcularPontosDesafiosDaTurma(turmaId){
    return lerLista(CHAVES.pontuacoesDesafio)
      .filter(p => p.turmaId === turmaId)
      .reduce((soma, p) => soma + (p.pontos || 0), 0);
  }
  function calcularDetalhePontosCategoriaDaTurma(turmaId){
    return getCategoriasPontuacao().map(cat => ({
      categoria: cat,
      pontos: getPontuacoesCategoria().filter(p => p.categoriaPontuacaoId === cat.id && p.turmaId === turmaId)
        .reduce((soma, p) => soma + (p.pontos || 0), 0)
    }));
  }
  function calcularPontosExtrasDaTurma(turmaId){
    return getAjustesPorTurma(turmaId).reduce((soma, a) => soma + a.pontos, 0);
  }
  function calcularTotalDaTurma(turmaId){
    const categorias = calcularDetalhePontosCategoriaDaTurma(turmaId).reduce((s, c) => s + c.pontos, 0);
    return calcularPontosColetivosDaTurma(turmaId)
      + calcularPontosIndividuaisDaTurma(turmaId)
      + calcularPontosDesafiosDaTurma(turmaId)
      + categorias
      + calcularPontosExtrasDaTurma(turmaId);
  }
  function calcularDetalhamentoTurma(turmaId){
    const coletivos = [];
    getResultadosModalidade().filter(r => r.tipo === 'coletiva').forEach(r => {
      const colocacao = getColocacoesDoResultado(r.id).find(c => c.turmaId === turmaId);
      if(colocacao){
        const modalidade = getModalidades().find(m => m.id === r.modalidadeId);
        coletivos.push({ modalidade, posicao: colocacao.posicao, pontos: getPontosPorPosicao(colocacao.posicao) });
      }
    });
    const individuais = [];
    getResultadosModalidade().filter(r => r.tipo === 'individual').forEach(r => {
      getColocacoesDoResultado(r.id).forEach(c => {
        const aluno = getAluno(c.alunoId);
        if(aluno && aluno.turmaId === turmaId){
          const modalidade = getModalidades().find(m => m.id === r.modalidadeId);
          individuais.push({ modalidade, aluno, posicao: c.posicao, pontos: getPontosPorPosicao(c.posicao) });
        }
      });
    });
    const desafios = getDesafios().map(d => ({
      desafio: d,
      pontos: getPontuacoesDesafio(d.id).find(p => p.turmaId === turmaId)?.pontos || 0
    })).filter(d => d.pontos !== 0 || d.desafio.ativo);
    const categorias = calcularDetalhePontosCategoriaDaTurma(turmaId);
    const extras = getAjustesPorTurma(turmaId).slice().sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));
    const totalExtras = extras.reduce((s, a) => s + a.pontos, 0);
    const total = coletivos.reduce((s, c) => s + c.pontos, 0)
      + individuais.reduce((s, i) => s + i.pontos, 0)
      + desafios.reduce((s, d) => s + d.pontos, 0)
      + categorias.reduce((s, c) => s + c.pontos, 0)
      + totalExtras;
    return { coletivos, individuais, desafios, categorias, extras, totalExtras, total };
  }
  function calcularClassificacaoDaSerie(serieId){
    const turmas = getTurmasAtivasDaSerie(serieId);
    const itens = turmas.map(t => ({ id: t.id, turma: t, valor: calcularTotalDaTurma(t.id) }));
    return calcularRankingCompeticao(itens);
  }

  function resumoModalidadesPontuacao(){
    const coletivas = getModalidadesColetivasAtivas();
    const individuais = getModalidadesIndividuaisAtivas();
    let totalCombinacoesColetivas = 0;
    coletivas.forEach(m => { totalCombinacoesColetivas += seriesDaModalidade(m.id).length; });
    let totalCombinacoesIndividuais = 0;
    individuais.forEach(m => { totalCombinacoesIndividuais += seriesDaModalidade(m.id).length * 2; }); // Masculino + Feminino

    const lancados = getResultadosModalidade().filter(r => r.status === 'Lançado').length;
    const totalCombinacoes = totalCombinacoesColetivas + totalCombinacoesIndividuais;
    const pendentes = Math.max(0, totalCombinacoes - lancados);

    const pontosLancados = getResultadosModalidade().reduce((soma, r) => {
      return soma + getColocacoesDoResultado(r.id).reduce((s, c) => s + getPontosPorPosicao(c.posicao), 0);
    }, 0);

    let empates = 0;
    getResultadosModalidade().forEach(r => {
      const posicoes = getColocacoesDoResultado(r.id).map(c => c.posicao);
      const contagem = {};
      posicoes.forEach(p => { contagem[p] = (contagem[p] || 0) + 1; });
      Object.values(contagem).forEach(c => { if(c > 1) empates++; });
    });

    return { lancados, pendentes, pontosLancados, empates };
  }

  /* ---------- Sorteio e Chaveamento das Seletivas Individuais (Bloco 7) ---------- */

  function embaralharFisherYates(lista){
    const arr = lista.slice();
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function alunosElegiveisChaveamento(turmaId, modalidadeId, categoria){
    const inscritosIds = new Set(getInscricoes().filter(i => i.modalidadeId === modalidadeId).map(i => i.alunoId));
    return getAlunosPorTurma(turmaId).filter(a => inscritosIds.has(a.id) && a.sexo === categoria);
  }

  // Bloco 2: mesma coisa, mas aceita tanto uma turma quanto um agrupamento
  // ativo como contexto -- reúne os elegíveis de todas as turmas do grupo,
  // sem duplicar aluno algum (cada aluno só pertence a uma turma).
  function alunosElegiveisChaveamentoContexto(idTurmaOuAgrupamento, modalidadeId, categoria){
    const agrupamento = getAgrupamento(idTurmaOuAgrupamento);
    if(agrupamento){
      const vistos = new Set();
      const resultado = [];
      agrupamento.turmaIds.forEach(tid => {
        alunosElegiveisChaveamento(tid, modalidadeId, categoria).forEach(a => {
          if(!vistos.has(a.id)){ vistos.add(a.id); resultado.push(a); }
        });
      });
      return resultado;
    }
    return alunosElegiveisChaveamento(idTurmaOuAgrupamento, modalidadeId, categoria);
  }

  // Bloco 2: "já existe chaveamento" também precisa reconhecer um
  // agrupamento como contexto (chaveamentos de agrupamento são guardados
  // com agrupamentoId em vez de turmaId -- ver montarChaveamento).
  function getChaveamentosPorContextoGeral(idTurmaOuAgrupamento, modalidadeId, categoria){
    const agrupamento = getAgrupamento(idTurmaOuAgrupamento);
    if(agrupamento){
      return getChaveamentos()
        .filter(c => c.agrupamentoId === idTurmaOuAgrupamento && c.modalidadeId === modalidadeId && c.categoria === categoria)
        .sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));
    }
    return getChaveamentosPorContexto(idTurmaOuAgrupamento, modalidadeId, categoria);
  }

  function obterNomesFases(size){
    const numRodadas = Math.log2(size);
    const nomesConhecidos = { 1:'Final', 2:'Semifinal', 3:'Quartas de final', 4:'Oitavas de final', 5:'16-avos de final' };
    const fases = [];
    for(let distancia = numRodadas; distancia >= 1; distancia--){
      fases.push(nomesConhecidos[distancia] || `Fase de ${Math.pow(2, distancia)}`);
    }
    return fases;
  }

  function getChaveamentos(){ return lerLista(CHAVES.chaveamentos); }
  function getChaveamento(id){ return getChaveamentos().find(c => c.id === id) || null; }
  function getChaveamentosPorContexto(turmaId, modalidadeId, categoria){
    return getChaveamentos()
      .filter(c => c.turmaId === turmaId && c.modalidadeId === modalidadeId && c.categoria === categoria)
      .sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));
  }
  function atualizarChaveamento(id, dados){
    const lista = getChaveamentos().map(c => c.id === id ? {...c, ...dados, atualizadoEm: new Date().toISOString()} : c);
    salvarLista(CHAVES.chaveamentos, lista);
  }

  function getParticipantesChaveamento(chaveamentoId){
    return lerLista(CHAVES.participantesChaveamento).filter(p => p.chaveamentoId === chaveamentoId);
  }

  function getConfrontos(chaveamentoId){
    return lerLista(CHAVES.confrontosChaveamento).filter(c => c.chaveamentoId === chaveamentoId);
  }
  function getConfrontoPorId(id){
    return lerLista(CHAVES.confrontosChaveamento).find(c => c.id === id) || null;
  }
  function atualizarConfronto(id, dados){
    const lista = lerLista(CHAVES.confrontosChaveamento).map(c => c.id === id ? {...c, ...dados} : c);
    salvarLista(CHAVES.confrontosChaveamento, lista);
  }

  // Monta o chaveamento inteiro (participantes + todas as fases) a partir de uma
  // lista já embaralhada. Se já existir um chaveamento com o mesmo id (refazer
  // sorteio), os confrontos e participantes antigos são substituídos.
  function montarChaveamento({ serieId, turmaId, agrupamentoId, modalidadeId, categoria, disputaTerceiro, participantesEmbaralhados, chaveamentoExistenteId, tipo, chaveamentoPrincipalId }){
    // Etapa 2B-3: `tipo` ('principal' | 'repescagem' | 'final') e
    // `chaveamentoPrincipalId` são opcionais -- chaveamentos criados antes
    // desta etapa continuam funcionando exatamente igual, tratados como
    // 'principal' sem família (comportamento 100% preservado).
    // Bloco 2: `agrupamentoId` também é opcional -- quando presente
    // (chaveamento criado a partir de um agrupamento de turmas em vez de
    // uma turma só), `turmaId` fica null. Nenhum chaveamento antigo tem
    // esse campo, então para eles o comportamento também é 100% igual.
    const tipoFinal = tipo || 'principal';
    let chaveamento;
    if(chaveamentoExistenteId){
      chaveamento = getChaveamento(chaveamentoExistenteId);
      atualizarChaveamento(chaveamento.id, {
        status: 'Em andamento', disputaTerceiro,
        campeaoAlunoId: null, viceAlunoId: null, terceiroAlunoId: null, participanteUnico: false
      });
      // remove confrontos e participantes antigos deste chaveamento (não afeta alunos/inscrições)
      salvarLista(CHAVES.confrontosChaveamento, lerLista(CHAVES.confrontosChaveamento).filter(c => c.chaveamentoId !== chaveamento.id));
      salvarLista(CHAVES.participantesChaveamento, lerLista(CHAVES.participantesChaveamento).filter(p => p.chaveamentoId !== chaveamento.id));
      chaveamento = getChaveamento(chaveamento.id);
    } else {
      const chaveamentos = getChaveamentos();
      chaveamento = {
        id: gerarId(), serieId, turmaId: agrupamentoId ? null : (turmaId || null), agrupamentoId: agrupamentoId || null, modalidadeId, categoria,
        status: 'Em andamento', disputaTerceiro,
        campeaoAlunoId: null, viceAlunoId: null, terceiroAlunoId: null,
        tipo: tipoFinal, chaveamentoPrincipalId: chaveamentoPrincipalId || null,
        criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString()
      };
      chaveamentos.push(chaveamento);
      salvarLista(CHAVES.chaveamentos, chaveamentos);
    }

    const N = participantesEmbaralhados.length;

    // Alteração pontual: participante único -- não cria confronto nem
    // BYE algum. O próprio chaveamento já nasce Finalizado, com esse
    // aluno como campeão (`participanteUnico:true` para a interface
    // deixar claro que não houve partida). Repescagem/Final nunca fazem
    // sentido aqui (não há perdedor), então nada mais precisa mudar --
    // DB.podeGerarRepescagem já retorna false com 0 perdedores.
    if(N === 1){
      const unico = participantesEmbaralhados[0];
      const participanteUnico = { id: gerarId(), chaveamentoId: chaveamento.id, alunoId: unico.id, presente:true, ordemSorteio:0, bye:false };
      salvarLista(CHAVES.participantesChaveamento, [...lerLista(CHAVES.participantesChaveamento), participanteUnico]);
      atualizarChaveamento(chaveamento.id, {
        status: 'Finalizado', campeaoAlunoId: unico.id, viceAlunoId: null, terceiroAlunoId: null, participanteUnico: true
      });
      return getChaveamento(chaveamento.id);
    }

    let size = 2;
    while(size < N) size *= 2;
    const numByes = size - N;
    const nomesFases = obterNomesFases(size);

    const participantes = participantesEmbaralhados.map((aluno, idx) => ({
      id: gerarId(), chaveamentoId: chaveamento.id, alunoId: aluno.id,
      presente: true, ordemSorteio: idx, bye: idx < numByes
    }));
    salvarLista(CHAVES.participantesChaveamento, [...lerLista(CHAVES.participantesChaveamento), ...participantes]);

    const comBye = participantesEmbaralhados.slice(0, numByes);
    const semBye = participantesEmbaralhados.slice(numByes);

    const confrontos = [];
    const round1Ids = [];
    comBye.forEach(aluno => {
      const c = {
        id: gerarId(), chaveamentoId: chaveamento.id, fase: nomesFases[0], faseIndex: 0, ordem: confrontos.length,
        alunoAId: aluno.id, alunoBId: null,
        vencedorAlunoId: aluno.id, perdedorAlunoId: null,
        placar: null, tipoResultado: 'bye', observacao: 'BYE — avanço automático',
        confrontoOrigemAId: null, confrontoOrigemBId: null, usaPerdedoresDaOrigem:false, terceiroLugar:false,
        status: 'Finalizado'
      };
      confrontos.push(c);
      round1Ids.push(c.id);
    });
    for(let i = 0; i < semBye.length; i += 2){
      const c = {
        id: gerarId(), chaveamentoId: chaveamento.id, fase: nomesFases[0], faseIndex: 0, ordem: confrontos.length,
        alunoAId: semBye[i].id, alunoBId: semBye[i + 1].id,
        vencedorAlunoId: null, perdedorAlunoId: null,
        placar: null, tipoResultado: null, observacao: '',
        confrontoOrigemAId: null, confrontoOrigemBId: null, usaPerdedoresDaOrigem:false, terceiroLugar:false,
        status: 'Aguardando'
      };
      confrontos.push(c);
      round1Ids.push(c.id);
    }

    let idsRodadaAnterior = round1Ids;
    for(let f = 1; f < nomesFases.length; f++){
      const idsRodadaAtual = [];
      for(let i = 0; i < idsRodadaAnterior.length; i += 2){
        const c = {
          id: gerarId(), chaveamentoId: chaveamento.id, fase: nomesFases[f], faseIndex: f, ordem: idsRodadaAtual.length,
          alunoAId: null, alunoBId: null,
          vencedorAlunoId: null, perdedorAlunoId: null,
          placar: null, tipoResultado: null, observacao: '',
          confrontoOrigemAId: idsRodadaAnterior[i], confrontoOrigemBId: idsRodadaAnterior[i + 1],
          usaPerdedoresDaOrigem:false, terceiroLugar:false,
          status: 'Aguardando'
        };
        confrontos.push(c);
        idsRodadaAtual.push(c.id);
      }
      idsRodadaAnterior = idsRodadaAtual;
    }

    // disputa de 3º lugar: alimentada pelos PERDEDORES das duas semifinais
    if(disputaTerceiro && nomesFases.includes('Semifinal')){
      const faseIndexSemifinal = nomesFases.indexOf('Semifinal');
      const semifinais = confrontos.filter(c => c.faseIndex === faseIndexSemifinal && !c.terceiroLugar);
      if(semifinais.length === 2){
        confrontos.push({
          id: gerarId(), chaveamentoId: chaveamento.id, fase: 'Terceiro lugar', faseIndex: nomesFases.length - 1, ordem: 0,
          alunoAId: null, alunoBId: null,
          vencedorAlunoId: null, perdedorAlunoId: null,
          placar: null, tipoResultado: null, observacao: '',
          confrontoOrigemAId: semifinais[0].id, confrontoOrigemBId: semifinais[1].id,
          usaPerdedoresDaOrigem: true, terceiroLugar: true,
          status: 'Aguardando'
        });
      }
    }

    salvarLista(CHAVES.confrontosChaveamento, [...lerLista(CHAVES.confrontosChaveamento), ...confrontos]);

    // propaga os BYEs do round1 imediatamente para a fase seguinte
    round1Ids.forEach(id => {
      const c = getConfrontoPorId(id);
      if(c && c.vencedorAlunoId) propagarResultadoDoConfronto(id);
    });

    return chaveamento;
  }

  function propagarResultadoDoConfronto(origemId){
    const confrontoOrigem = getConfrontoPorId(origemId);
    if(!confrontoOrigem) return;
    const todos = lerLista(CHAVES.confrontosChaveamento);
    const dependentes = todos.filter(c => c.confrontoOrigemAId === origemId || c.confrontoOrigemBId === origemId);
    dependentes.forEach(dep => {
      const valor = dep.usaPerdedoresDaOrigem ? confrontoOrigem.perdedorAlunoId : confrontoOrigem.vencedorAlunoId;
      const dados = {};
      if(dep.confrontoOrigemAId === origemId) dados.alunoAId = valor;
      if(dep.confrontoOrigemBId === origemId) dados.alunoBId = valor;
      atualizarConfronto(dep.id, dados);
    });
  }

  function atualizarResultadosFinaisSeAplicavel(chaveamentoId){
    const confrontos = getConfrontos(chaveamentoId);
    const normais = confrontos.filter(c => !c.terceiroLugar);
    if(!normais.length) return;
    const maiorFaseIndex = Math.max(...normais.map(c => c.faseIndex));
    const final = normais.find(c => c.faseIndex === maiorFaseIndex);
    const terceiro = confrontos.find(c => c.terceiroLugar);

    const dados = {};
    if(final && final.vencedorAlunoId){
      dados.campeaoAlunoId = final.vencedorAlunoId;
      dados.viceAlunoId = final.perdedorAlunoId;
      dados.status = 'Finalizado';
    }
    if(terceiro && terceiro.vencedorAlunoId){
      dados.terceiroAlunoId = terceiro.vencedorAlunoId;
    }
    if(Object.keys(dados).length) atualizarChaveamento(chaveamentoId, dados);
  }

  function definirVencedorConfronto(confrontoId, vencedorAlunoId, extras){
    const confronto = getConfrontoPorId(confrontoId);
    if(!confronto) return;
    const perdedorAlunoId = confronto.alunoAId === vencedorAlunoId ? confronto.alunoBId : confronto.alunoAId;
    atualizarConfronto(confrontoId, { vencedorAlunoId, perdedorAlunoId, status:'Finalizado', adiado:false, ...extras });
    propagarResultadoDoConfronto(confrontoId);
    atualizarResultadosFinaisSeAplicavel(confronto.chaveamentoId);
  }

  function existeResultadoPosteriorDependente(confrontoId){
    const todos = lerLista(CHAVES.confrontosChaveamento);
    const dependentes = todos.filter(c => c.confrontoOrigemAId === confrontoId || c.confrontoOrigemBId === confrontoId);
    for(const dep of dependentes){
      if(dep.vencedorAlunoId) return true;
      if(existeResultadoPosteriorDependente(dep.id)) return true;
    }
    return false;
  }

  function resetarConfrontoERecursivos(confrontoId){
    const todos = lerLista(CHAVES.confrontosChaveamento);
    const dependentes = todos.filter(c => c.confrontoOrigemAId === confrontoId || c.confrontoOrigemBId === confrontoId);
    dependentes.forEach(dep => {
      const dadosReset = {};
      if(dep.confrontoOrigemAId === confrontoId) dadosReset.alunoAId = null;
      if(dep.confrontoOrigemBId === confrontoId) dadosReset.alunoBId = null;
      const tinhaVencedor = !!dep.vencedorAlunoId;
      dadosReset.vencedorAlunoId = null;
      dadosReset.perdedorAlunoId = null;
      dadosReset.status = 'Aguardando';
      dadosReset.placar = null;
      dadosReset.tipoResultado = null;
      dadosReset.observacao = '';
      atualizarConfronto(dep.id, dadosReset);
      if(tinhaVencedor) resetarConfrontoERecursivos(dep.id);
    });
  }

  function corrigirVencedorConfronto(confrontoId, novoVencedorAlunoId, extras){
    resetarConfrontoERecursivos(confrontoId);
    definirVencedorConfronto(confrontoId, novoVencedorAlunoId, extras);
    // recalcula campeão/vice/terceiro (pode ter sido limpo pelo reset em cascata)
    const chaveamentoId = getConfrontoPorId(confrontoId).chaveamentoId;
    const aindaTemFinalVencida = getConfrontos(chaveamentoId).some(c => {
      const normais = getConfrontos(chaveamentoId).filter(x => !x.terceiroLugar);
      const maiorFaseIndex = Math.max(...normais.map(x => x.faseIndex));
      return c.faseIndex === maiorFaseIndex && !c.terceiroLugar && c.vencedorAlunoId;
    });
    if(!aindaTemFinalVencida){
      atualizarChaveamento(chaveamentoId, { campeaoAlunoId: null, viceAlunoId: null, status: 'Em andamento' });
    }
  }

  function excluirChaveamento(id){
    salvarLista(CHAVES.chaveamentos, getChaveamentos().filter(c => c.id !== id));
    salvarLista(CHAVES.confrontosChaveamento, lerLista(CHAVES.confrontosChaveamento).filter(c => c.chaveamentoId !== id));
    salvarLista(CHAVES.participantesChaveamento, lerLista(CHAVES.participantesChaveamento).filter(p => p.chaveamentoId !== id));
  }

  function resumoChaveamentosDaTurma(turmaId){
    return getChaveamentos().filter(c => c.turmaId === turmaId).map(c => ({
      chaveamento: c,
      modalidade: getModalidades().find(m => m.id === c.modalidadeId),
      campeao: c.campeaoAlunoId ? getAluno(c.campeaoAlunoId) : null,
      vice: c.viceAlunoId ? getAluno(c.viceAlunoId) : null
    }));
  }

  /* ============================================================
     BLOCO 3 -- OPERAÇÃO REAL DO CHAVEAMENTO
     ------------------------------------------------------------
     Nenhuma tabela nova. Reaproveita os campos que já existiam:
     `participante.presente` (Bloco 7, já default true -- vira o
     controle de falta), `confronto.tipoResultado` (já aceitava 'wo'
     por um caminho indireto -- ganha um confirm dedicado) e o próprio
     motor de BYE/propagação/correção (Bloco 7 + Etapa 2B-3), sem
     reescrever nada disso. Um único campo novo, `confronto.adiado`
     (boolean, ausente = false para todo confronto já existente).
  ============================================================ */

  // ---------- 1. Falta ----------
  // "presente" já existia (default true na criação do chaveamento).
  // Marcar falta só vira presente:false -- não mexe em aluno,
  // inscrição, nem no histórico de confrontos já jogados.
  function marcarFaltaChaveamento(chaveamentoId, alunoId, faltou){
    const lista = lerLista(CHAVES.participantesChaveamento).map(p =>
      (p.chaveamentoId === chaveamentoId && p.alunoId === alunoId) ? { ...p, presente: !faltou } : p);
    salvarLista(CHAVES.participantesChaveamento, lista);
  }

  // ---------- 2. Adiar jogo ----------
  // Novo campo `adiado` (boolean) no confronto -- não mexe em vencedor/
  // perdedor/status, só marca que este confronto específico está em espera.
  function adiarConfronto(confrontoId){
    const c = getConfrontoPorId(confrontoId);
    if(!c) throw new Error('Confronto não encontrado.');
    if(c.status === 'Finalizado') throw new Error('Este confronto já foi finalizado e não pode ser adiado.');
    if(!c.alunoAId || !c.alunoBId) throw new Error('Este confronto ainda não tem os dois participantes definidos.');
    atualizarConfronto(confrontoId, { adiado: true });
  }
  function retomarConfrontoAdiado(confrontoId){
    const c = getConfrontoPorId(confrontoId);
    if(!c) throw new Error('Confronto não encontrado.');
    atualizarConfronto(confrontoId, { adiado: false });
  }

  // ---------- 4. Reorganizar chave ----------
  // Afeta só a fase pendente mais próxima (a "frente" do chaveamento) --
  // nunca toca confrontos já Finalizados (nem BYEs, que contam como
  // decididos). Quem faltou sai da rolagem; se sobrar número ímpar, o
  // último recebe BYE (mesma regra do sorteio original -- não é
  // considerado vitória nem derrota de ninguém).
  function previaReorganizacaoChaveamento(chaveamentoId){
    const confrontos = getConfrontos(chaveamentoId).filter(c => !c.terceiroLugar);
    const pendentes = confrontos.filter(c => c.status !== 'Finalizado');
    if(!pendentes.length) return null;
    const faseIndex = Math.min(...pendentes.map(c => c.faseIndex));
    const confrontosFase = confrontos.filter(c => c.faseIndex === faseIndex && c.status !== 'Finalizado');
    const faltososIds = new Set(getParticipantesChaveamento(chaveamentoId).filter(p => !p.presente).map(p => p.alunoId));
    const idsNaFase = [];
    confrontosFase.forEach(c => { if(c.alunoAId) idsNaFase.push(c.alunoAId); if(c.alunoBId) idsNaFase.push(c.alunoBId); });
    const idsUnicos = [...new Set(idsNaFase)];
    const restantes = idsUnicos.filter(id => !faltososIds.has(id));
    const faltososNaFase = idsUnicos.filter(id => faltososIds.has(id));
    return {
      faseIndex, nomeFase: confrontosFase[0] ? confrontosFase[0].fase : '',
      totalConfrontos: confrontosFase.length,
      restantes: restantes.map(id => getAluno(id)).filter(Boolean),
      faltosos: faltososNaFase.map(id => getAluno(id)).filter(Boolean)
    };
  }
  function reorganizarChaveamento(chaveamentoId){
    const previa = previaReorganizacaoChaveamento(chaveamentoId);
    if(!previa) throw new Error('Não há confrontos pendentes para reorganizar.');
    const confrontos = getConfrontos(chaveamentoId).filter(c => !c.terceiroLugar);
    const confrontosFase = confrontos.filter(c => c.faseIndex === previa.faseIndex && c.status !== 'Finalizado');
    const restantesEmbaralhados = embaralharFisherYates(previa.restantes);

    // limpa os confrontos pendentes desta fase (preserva id/fase/ordem/origem)
    confrontosFase.forEach(c => {
      atualizarConfronto(c.id, {
        alunoAId: null, alunoBId: null, vencedorAlunoId: null, perdedorAlunoId: null,
        status: 'Aguardando', tipoResultado: null, observacao: '', placar: null, adiado: false
      });
    });

    let idx = 0;
    confrontosFase.forEach(c => {
      const a = restantesEmbaralhados[idx]; idx++;
      const b = restantesEmbaralhados[idx]; idx++;
      if(a && b){
        atualizarConfronto(c.id, { alunoAId: a.id, alunoBId: b.id });
      } else if(a && !b){
        atualizarConfronto(c.id, {
          alunoAId: a.id, alunoBId: null, vencedorAlunoId: a.id, perdedorAlunoId: null,
          status: 'Finalizado', tipoResultado: 'bye', observacao: 'BYE — avanço automático (reorganização)'
        });
        propagarResultadoDoConfronto(c.id);
      }
      // se não sobrar ninguém para este confronto, ele fica vazio/Aguardando
      // (posição disponível -- pode receber um aluno adicionado depois)
    });
    atualizarResultadosFinaisSeAplicavel(chaveamentoId);
    return previa;
  }

  // ---------- 5. Trocar posições ----------
  // Só entre posições da RODADA 1 (faseIndex 0) -- é a única fase com
  // aluno atribuído diretamente pelo sorteio; as demais são preenchidas
  // por propagação de resultado, não fazem sentido para "trocar".
  function localizarAlunoNaRodada1(chaveamentoId, alunoId){
    const confrontos = getConfrontos(chaveamentoId).filter(c => c.faseIndex === 0 && !c.terceiroLugar);
    for(const c of confrontos){
      if(c.alunoAId === alunoId) return { confronto: c, campo: 'alunoAId' };
      if(c.alunoBId === alunoId) return { confronto: c, campo: 'alunoBId' };
    }
    return null;
  }
  function trocarPosicoesChaveamento(chaveamentoId, alunoId1, alunoId2){
    if(alunoId1 === alunoId2) throw new Error('Selecione dois alunos diferentes.');
    const loc1 = localizarAlunoNaRodada1(chaveamentoId, alunoId1);
    const loc2 = localizarAlunoNaRodada1(chaveamentoId, alunoId2);
    if(!loc1 || !loc2) throw new Error('Um dos participantes não está na rodada inicial deste chaveamento.');
    if(loc1.confronto.status === 'Finalizado' || loc2.confronto.status === 'Finalizado'){
      throw new Error('Não é possível trocar posições de um confronto já finalizado.');
    }
    if(loc1.confronto.tipoResultado === 'bye' || loc2.confronto.tipoResultado === 'bye'){
      throw new Error('Não é possível trocar a posição de quem recebeu BYE.');
    }
    atualizarConfronto(loc1.confronto.id, { [loc1.campo]: alunoId2 });
    atualizarConfronto(loc2.confronto.id, { [loc2.campo]: alunoId1 });
  }

  // ---------- 6. Adicionar aluno ----------
  // Só quem já existe, já está inscrito na modalidade e pertence ao
  // contexto (turma ou agrupamento) do chaveamento, e ainda não está
  // nele. Precisa de um confronto com posição vazia (não finalizado,
  // não BYE) -- normalmente surge depois de "Reorganizar chave".
  function alunosDisponiveisParaAdicionar(chaveamentoId){
    const chav = getChaveamento(chaveamentoId);
    if(!chav) return [];
    const jaNoChaveamento = new Set(getParticipantesChaveamento(chaveamentoId).map(p => p.alunoId));
    const contextoId = chav.agrupamentoId || chav.turmaId;
    if(!contextoId) return [];
    const elegiveis = alunosElegiveisChaveamentoContexto(contextoId, chav.modalidadeId, chav.categoria);
    return elegiveis.filter(a => !jaNoChaveamento.has(a.id));
  }
  function confrontosComPosicaoDisponivel(chaveamentoId){
    return getConfrontos(chaveamentoId).filter(c =>
      c.status !== 'Finalizado' && c.tipoResultado !== 'bye' && (!c.alunoAId || !c.alunoBId)
    );
  }
  function adicionarAlunoAoChaveamento(chaveamentoId, alunoId, confrontoId){
    const disponiveis = alunosDisponiveisParaAdicionar(chaveamentoId);
    if(!disponiveis.some(a => a.id === alunoId)){
      throw new Error('Este aluno não pode ser adicionado (precisa existir, estar inscrito nesta modalidade/categoria, pertencer a este contexto e ainda não estar no chaveamento).');
    }
    const confronto = getConfrontoPorId(confrontoId);
    if(!confronto || confronto.chaveamentoId !== chaveamentoId) throw new Error('Posição inválida.');
    if(confronto.status === 'Finalizado' || confronto.tipoResultado === 'bye') throw new Error('Esta posição não está mais disponível.');
    if(confronto.alunoAId && confronto.alunoBId) throw new Error('Este confronto já tem os dois participantes definidos.');

    const participantes = lerLista(CHAVES.participantesChaveamento);
    const ordens = getParticipantesChaveamento(chaveamentoId).map(p => p.ordemSorteio);
    const maiorOrdem = ordens.length ? Math.max(...ordens) : -1;
    participantes.push({ id: gerarId(), chaveamentoId, alunoId, presente: true, ordemSorteio: maiorOrdem + 1, bye: false });
    salvarLista(CHAVES.participantesChaveamento, participantes);

    if(!confronto.alunoAId) atualizarConfronto(confrontoId, { alunoAId: alunoId });
    else atualizarConfronto(confrontoId, { alunoBId: alunoId });
  }

  // ---------- 7. Remover aluno ----------
  // Nunca mexe em aluno/inscrição -- só em participantesChaveamento/
  // confrontosChaveamento. Se já jogou algo, o histórico é preservado
  // (só marca indisponível); se ainda não jogou nada, pode sair de vez.
  function removerAlunoDoChaveamento(chaveamentoId, alunoId){
    const participante = getParticipantesChaveamento(chaveamentoId).find(p => p.alunoId === alunoId);
    if(!participante) throw new Error('Este aluno não está neste chaveamento.');
    const confrontosDoAluno = getConfrontos(chaveamentoId).filter(c => c.alunoAId === alunoId || c.alunoBId === alunoId);
    const jaJogou = confrontosDoAluno.some(c => c.status === 'Finalizado');

    if(jaJogou){
      salvarLista(CHAVES.participantesChaveamento, lerLista(CHAVES.participantesChaveamento).map(p =>
        p.id === participante.id ? { ...p, presente: false } : p));
      return {
        removidoCompletamente: false,
        mensagem: 'Este aluno já disputou partidas neste chaveamento — o histórico foi preservado e não foi apagado. Ele foi marcado como indisponível (falta) para as próximas etapas; use "Reorganizar chave" se precisar redistribuir os confrontos ainda pendentes.'
      };
    }
    const confrontosPendentesDoAluno = confrontosDoAluno.filter(c => c.status !== 'Finalizado');
    confrontosPendentesDoAluno.forEach(c => {
      const dados = {};
      if(c.alunoAId === alunoId) dados.alunoAId = null;
      if(c.alunoBId === alunoId) dados.alunoBId = null;
      atualizarConfronto(c.id, dados);
    });
    salvarLista(CHAVES.participantesChaveamento, lerLista(CHAVES.participantesChaveamento).filter(p => p.id !== participante.id));
    return {
      removidoCompletamente: true,
      mensagem: 'Aluno removido deste chaveamento. O cadastro e a inscrição dele continuam normais.'
    };
  }

  /* ============================================================
     CHAVEAMENTO COM REPESCAGEM (Etapa 2B-3)
     ------------------------------------------------------------
     Fase Principal, Repescagem e Final são, cada uma, simplesmente
     um `chaveamento` normal (mesma tabela, mesmo motor de sorteio/
     BYE/propagação/correção do Bloco 7 -- nada disso foi reescrito).
     O que muda é só a ORIGEM dos participantes de cada uma:
       - Fase Principal: quem o professor selecionou na seletiva.
       - Repescagem: todo mundo que PERDEU algum confronto na Fase
         Principal (getChaveamento(...).campeaoAlunoId é o único que
         não entra).
       - Final: campeão da Fase Principal × campeão da Repescagem.
     Nenhuma tabela nova, nenhuma pontuação -- só GANHOU/PERDEU/W.O.,
     exatamente como o motor de confrontos já registra.
  ============================================================ */
  function obterFamiliaChaveamento(chaveamentoPrincipalId){
    const principal = getChaveamento(chaveamentoPrincipalId);
    if(!principal) return { principal:null, repescagem:null, final:null };
    const filhos = getChaveamentos().filter(c => c.chaveamentoPrincipalId === chaveamentoPrincipalId);
    return {
      principal,
      repescagem: filhos.find(c => c.tipo === 'repescagem') || null,
      final: filhos.find(c => c.tipo === 'final') || null
    };
  }

  // Todos os alunos que perderam pelo menos um confronto neste chaveamento
  // (ou seja, todo participante exceto o campeão dele). Só faz sentido
  // depois que o chaveamento já tem campeão definido.
  function obterPerdedoresChaveamento(chaveamentoId){
    const chav = getChaveamento(chaveamentoId);
    if(!chav || !chav.campeaoAlunoId) return [];
    return getParticipantesChaveamento(chaveamentoId)
      .map(p => getAluno(p.alunoId))
      .filter(a => a && a.id !== chav.campeaoAlunoId);
  }

  function podeGerarRepescagem(chaveamentoPrincipalId){
    const { principal, repescagem } = obterFamiliaChaveamento(chaveamentoPrincipalId);
    if(!principal || !principal.campeaoAlunoId || repescagem) return false;
    return obterPerdedoresChaveamento(chaveamentoPrincipalId).length >= 2;
  }

  /* ============================================================
     CLASSIFICADOS PARA O JIBA (novo)
     ------------------------------------------------------------
     NÃO altera o motor (sorteio/BYE/avanço/repescagem/final/W.O./
     correção continuam exatamente como estão). É só uma LEITURA
     derivada dos dados que já existem: campeão/vice/terceiro (já
     gravados por atualizarResultadosFinaisSeAplicavel) + a fase em
     que cada participante foi eliminado (já registrada em cada
     confronto). "Quantidade de classificados" é um campo novo,
     opcional, gravado no chaveamento definitivo (a Final, ou o
     próprio Principal quando não há repescagem/final).
  ============================================================ */

  // Em que fase (faseIndex) este aluno perdeu, dentro de UM chaveamento
  // específico. Retorna Infinity se ele é o campeão daquele chaveamento,
  // e -1 se ele nem participou dele.
  function faseEliminacaoNoBracket(chaveamento, alunoId){
    if(!chaveamento) return -1;
    if(chaveamento.campeaoAlunoId === alunoId) return Infinity;
    const confrontos = getConfrontos(chaveamento.id).filter(c => !c.terceiroLugar);
    const confrontoDerrota = confrontos.find(c => c.perdedorAlunoId === alunoId);
    if(confrontoDerrota) return confrontoDerrota.faseIndex;
    const participou = confrontos.some(c => c.alunoAId === alunoId || c.alunoBId === alunoId)
      || getParticipantesChaveamento(chaveamento.id).some(p => p.alunoId === alunoId);
    return participou ? -1 : -1; // participou mas ainda não foi eliminado (chave em andamento) -- trata como -1 (sem posição definida ainda)
  }

  // Classificação final completa (1º, 2º, 3º, 4º...), derivada dos dados
  // já existentes. 1º/2º/3º vêm de campeaoAlunoId/viceAlunoId/terceiroAlunoId
  // (exatamente como já são exibidos hoje). A partir do 4º lugar, ordena
  // pela fase em que cada um foi eliminado -- prioriza quem chegou mais
  // longe na Repescagem (é ela que dá a "segunda chance" depois do
  // Principal); em caso de empate na mesma fase, usa a ordem original do
  // sorteio/definição manual (estável e determinística, sem inventar
  // diferença onde nenhuma partida decidiu).
  function classificacaoFinalChaveamento(raizId){
    const { principal, repescagem, final } = obterFamiliaChaveamento(raizId);
    if(!principal) return [];
    const vencedorGeral = final ? final.campeaoAlunoId : principal.campeaoAlunoId;
    if(!vencedorGeral) return []; // chaveamento ainda não finalizado

    const viceGeral = final ? final.viceAlunoId : principal.viceAlunoId;
    const terceiroGeral = principal.terceiroAlunoId || null;

    const participantesPrincipal = getParticipantesChaveamento(principal.id);
    const ordemOriginal = new Map(
      participantesPrincipal.slice().sort((a, b) => a.ordemSorteio - b.ordemSorteio).map((p, i) => [p.alunoId, i])
    );

    const jaClassificados = new Set([vencedorGeral, viceGeral, terceiroGeral].filter(Boolean));
    const restantes = participantesPrincipal.map(p => p.alunoId).filter(id => !jaClassificados.has(id));

    function profundidade(alunoId){
      const emRepescagem = repescagem ? faseEliminacaoNoBracket(repescagem, alunoId) : -1;
      if(emRepescagem >= 0) return 1000 + emRepescagem;
      return faseEliminacaoNoBracket(principal, alunoId);
    }

    restantes.sort((a, b) => {
      const diff = profundidade(b) - profundidade(a);
      if(diff !== 0) return diff;
      return (ordemOriginal.get(a) ?? 0) - (ordemOriginal.get(b) ?? 0);
    });

    const ordenados = [vencedorGeral, viceGeral, terceiroGeral].filter(Boolean).concat(restantes);
    return ordenados.map((alunoId, idx) => ({ posicao: idx + 1, aluno: getAluno(alunoId) })).filter(item => item.aluno);
  }

  // Grava quantos primeiros colocados devem ser considerados
  // "classificados para o JIBA". Salvo no chaveamento DEFINITIVO (Final,
  // ou o próprio Principal quando não há repescagem/final) -- o mesmo
  // registro que já guarda campeaoAlunoId/viceAlunoId.
  function definirQuantidadeClassificados(chaveamentoId, quantidade){
    atualizarChaveamento(chaveamentoId, { quantidadeClassificados: quantidade });
  }

  // Lê a quantidade configurada (a partir de QUALQUER chaveamento da
  // família) e devolve a lista já cortada -- é isto que a interface e a
  // impressão usam. Não duplica inscrição nem move aluno de turma; é
  // pura leitura sobre dados que já existem.
  function classificadosChaveamento(raizId){
    const { principal, final } = obterFamiliaChaveamento(raizId);
    const definitivo = final || principal;
    if(!definitivo) return { quantidade: 0, definitivoId: null, classificacao: [], classificados: [] };
    const quantidade = definitivo.quantidadeClassificados || 0;
    const classificacao = classificacaoFinalChaveamento(raizId);
    return {
      quantidade, definitivoId: definitivo.id, classificacao,
      classificados: quantidade > 0 ? classificacao.slice(0, quantidade) : []
    };
  }

  function gerarRepescagem(chaveamentoPrincipalId){
    const principal = getChaveamento(chaveamentoPrincipalId);
    if(!principal) throw new Error('Fase principal não encontrada.');
    const perdedores = obterPerdedoresChaveamento(chaveamentoPrincipalId);
    if(perdedores.length < 2) throw new Error('É preciso pelo menos 2 participantes para gerar a repescagem.');
    return montarChaveamento({
      serieId: principal.serieId, turmaId: principal.turmaId, agrupamentoId: principal.agrupamentoId, modalidadeId: principal.modalidadeId, categoria: principal.categoria,
      disputaTerceiro: false, participantesEmbaralhados: embaralharFisherYates(perdedores),
      tipo: 'repescagem', chaveamentoPrincipalId: principal.id
    });
  }

  function podeGerarFinal(chaveamentoPrincipalId){
    const { principal, repescagem, final } = obterFamiliaChaveamento(chaveamentoPrincipalId);
    return !!(principal && principal.campeaoAlunoId && repescagem && repescagem.campeaoAlunoId && !final);
  }

  function gerarFinal(chaveamentoPrincipalId){
    const { principal, repescagem } = obterFamiliaChaveamento(chaveamentoPrincipalId);
    if(!principal || !principal.campeaoAlunoId) throw new Error('A fase principal ainda não tem campeão.');
    if(!repescagem || !repescagem.campeaoAlunoId) throw new Error('A repescagem ainda não tem campeão.');
    const finalistaPrincipal = getAluno(principal.campeaoAlunoId);
    const finalistaRepescagem = getAluno(repescagem.campeaoAlunoId);
    return montarChaveamento({
      serieId: principal.serieId, turmaId: principal.turmaId, agrupamentoId: principal.agrupamentoId, modalidadeId: principal.modalidadeId, categoria: principal.categoria,
      disputaTerceiro: false, participantesEmbaralhados: [finalistaPrincipal, finalistaRepescagem],
      tipo: 'final', chaveamentoPrincipalId: principal.id
    });
  }

  // Indica se já existe repescagem/final gerados a partir deste chaveamento
  // -- usado só para avisar o professor que uma correção pode deixar a
  // fase seguinte desatualizada (ele decide se quer refazer o sorteio dela).
  function temFaseSeguinteGerada(chaveamentoId){
    const chav = getChaveamento(chaveamentoId);
    if(!chav) return false;
    const raizId = chav.tipo === 'repescagem' || chav.tipo === 'final' ? chav.chaveamentoPrincipalId : chav.id;
    const familia = obterFamiliaChaveamento(raizId);
    if(chav.id === raizId) return !!familia.repescagem || !!familia.final;
    if(chav.tipo === 'repescagem') return !!familia.final;
    return false;
  }

  // Monta a "trajetória" de um participante através da Fase Principal,
  // Repescagem e Final -- para a tela de acompanhamento (substitui o
  // controle manual em papel). Só leitura, nenhuma tabela nova.
  function obterCaminhoParticipante(chaveamentoPrincipalId, alunoId){
    const familia = obterFamiliaChaveamento(chaveamentoPrincipalId);
    const passos = [];

    function processar(chav, origem){
      if(!chav) return null;
      const participou = getParticipantesChaveamento(chav.id).some(p => p.alunoId === alunoId);
      if(!participou) return null;
      const confrontosDoAluno = getConfrontos(chav.id)
        .filter(c => !c.terceiroLugar && (c.alunoAId === alunoId || c.alunoBId === alunoId))
        .sort((a, b) => a.faseIndex - b.faseIndex);
      let perdeu = false;
      confrontosDoAluno.forEach(c => {
        if(c.tipoResultado === 'bye'){
          passos.push({ origem, tipo:'bye' });
          return;
        }
        if(!c.vencedorAlunoId){
          const oponenteId = c.alunoAId === alunoId ? c.alunoBId : c.alunoAId;
          passos.push({ origem, tipo:'aguardando', oponente: oponenteId ? getAluno(oponenteId) : null });
          return;
        }
        const venceu = c.vencedorAlunoId === alunoId;
        const oponenteId = c.alunoAId === alunoId ? c.alunoBId : c.alunoAId;
        passos.push({ origem, tipo: venceu ? 'venceu' : 'perdeu', oponente: getAluno(oponenteId), wo: c.tipoResultado === 'wo' });
        if(!venceu) perdeu = true;
      });
      return { perdeu, campeao: chav.campeaoAlunoId === alunoId };
    }

    const resPrincipal = processar(familia.principal, 'principal');
    let status = 'nao-participou';
    if(resPrincipal){
      status = resPrincipal.campeao ? 'campeao-fase' : (resPrincipal.perdeu ? 'eliminado' : 'avancando');
      if(resPrincipal.perdeu){
        const resRepescagem = processar(familia.repescagem, 'repescagem');
        if(resRepescagem){
          status = resRepescagem.campeao ? 'campeao-fase' : (resRepescagem.perdeu ? 'eliminado' : 'avancando');
        } else {
          status = 'aguardando-repescagem';
        }
      }
      const resFinal = processar(familia.final, 'final');
      if(resFinal){
        if(familia.final.campeaoAlunoId === alunoId) status = 'campeao';
        else if(resFinal.perdeu) status = 'vice-campeao';
        else status = 'finalista';
      } else if(status === 'campeao-fase'){
        status = 'aguardando-final';
      }
    }
    return { passos, status };
  }

  function chaveamentosDoAluno(alunoId){
    const participacoes = lerLista(CHAVES.participantesChaveamento).filter(p => p.alunoId === alunoId);
    return participacoes.map(p => {
      const chaveamento = getChaveamento(p.chaveamentoId);
      if(!chaveamento) return null;
      const confrontos = getConfrontos(chaveamento.id).filter(c =>
        c.alunoAId === alunoId || c.alunoBId === alunoId
      ).sort((a, b) => a.faseIndex - b.faseIndex);
      return { chaveamento, modalidade: getModalidades().find(m => m.id === chaveamento.modalidadeId), confrontos };
    }).filter(Boolean);
  }

  /* ---------- Finais do JIBA entre representantes das turmas (Bloco 8) ----------
     Reaproveita o mesmo algoritmo testado do Bloco 7 (Fisher-Yates via
     embaralharFisherYates, nomes de fase via obterNomesFases, BYE aleatório,
     propagação de vencedores, reconstrução em cascata e disputa de 3º lugar),
     mas com armazenamento completamente separado (finais_jiba / participantes_
     final_jiba / confrontos_final_jiba), para nunca misturar com os
     chaveamentos internos de turma do Bloco 7. */

  function getRepresentantesValidos(serieId, modalidadeId, categoria){
    const turmas = getTurmasAtivasDaSerie(serieId);
    return turmas.map(turma => {
      const chaveamentosDaTurma = getChaveamentosPorContexto(turma.id, modalidadeId, categoria)
        .filter(c => c.status === 'Finalizado' && c.campeaoAlunoId);
      if(!chaveamentosDaTurma.length) return null;
      const chaveamento = chaveamentosDaTurma[0];
      return { turma, chaveamento, campeaoAlunoId: chaveamento.campeaoAlunoId, viceAlunoId: chaveamento.viceAlunoId };
    }).filter(Boolean);
  }

  function getSubstitutosSugeridos(representante){
    const { turma, chaveamento, campeaoAlunoId } = representante;
    const sugestoes = [];
    if(chaveamento.viceAlunoId && chaveamento.viceAlunoId !== campeaoAlunoId){
      const vice = getAluno(chaveamento.viceAlunoId);
      if(vice) sugestoes.push({ aluno: vice, motivo:'Vice-campeão do chaveamento da turma' });
    }
    const seletiva = getSeletiva(chaveamento.modalidadeId, chaveamento.serieId, chaveamento.categoria);
    if(seletiva){
      getParticipacoes(seletiva.id)
        .filter(p => p.status === 'Classificado')
        .map(p => getAluno(p.alunoId))
        .filter(a => a && a.turmaId === turma.id && a.id !== campeaoAlunoId && !sugestoes.some(s => s.aluno.id === a.id))
        .forEach(a => sugestoes.push({ aluno: a, motivo:'Classificado na seletiva desta turma' }));
    }
    return sugestoes;
  }

  function getFinaisJiba(){ return lerLista(CHAVES.finaisJiba); }
  function getFinalJiba(id){ return getFinaisJiba().find(f => f.id === id) || null; }
  function getFinaisJibaPorContexto(serieId, modalidadeId, categoria){
    return getFinaisJiba()
      .filter(f => f.serieId === serieId && f.modalidadeId === modalidadeId && f.categoria === categoria)
      .sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));
  }
  function atualizarFinalJiba(id, dados){
    const lista = getFinaisJiba().map(f => f.id === id ? {...f, ...dados, atualizadoEm: new Date().toISOString()} : f);
    salvarLista(CHAVES.finaisJiba, lista);
  }
  function excluirFinalJiba(id){
    // remove só os registros da Final do JIBA: alunos, inscrições, seletivas e
    // o chaveamento interno de turma (Bloco 7) nunca são tocados aqui.
    salvarLista(CHAVES.finaisJiba, getFinaisJiba().filter(f => f.id !== id));
    salvarLista(CHAVES.confrontosFinalJiba, lerLista(CHAVES.confrontosFinalJiba).filter(c => c.finalJibaId !== id));
    salvarLista(CHAVES.participantesFinalJiba, lerLista(CHAVES.participantesFinalJiba).filter(p => p.finalJibaId !== id));
  }

  function getParticipantesFinalJiba(finalJibaId){
    return lerLista(CHAVES.participantesFinalJiba).filter(p => p.finalJibaId === finalJibaId);
  }
  function getConfrontosFinalJiba(finalJibaId){
    return lerLista(CHAVES.confrontosFinalJiba).filter(c => c.finalJibaId === finalJibaId);
  }
  function getConfrontoFinalJibaPorId(id){
    return lerLista(CHAVES.confrontosFinalJiba).find(c => c.id === id) || null;
  }
  function atualizarConfrontoFinalJiba(id, dados){
    const lista = lerLista(CHAVES.confrontosFinalJiba).map(c => c.id === id ? {...c, ...dados} : c);
    salvarLista(CHAVES.confrontosFinalJiba, lista);
  }

  // Cria a Final do JIBA já finalizada quando só resta 1 representante presente.
  function finalizarPorAusenciaDosDemais({ serieId, modalidadeId, categoria, campeaoAlunoId, finalJibaExistenteId }){
    if(finalJibaExistenteId){
      atualizarFinalJiba(finalJibaExistenteId, { status:'Finalizado', campeaoAlunoId, viceAlunoId:null, terceiroAlunoId:null });
      salvarLista(CHAVES.confrontosFinalJiba, lerLista(CHAVES.confrontosFinalJiba).filter(c => c.finalJibaId !== finalJibaExistenteId));
      return getFinalJiba(finalJibaExistenteId);
    }
    const lista = getFinaisJiba();
    const finalJiba = {
      id: gerarId(), serieId, modalidadeId, categoria, status:'Finalizado', disputaTerceiro:false,
      campeaoAlunoId, viceAlunoId:null, terceiroAlunoId:null,
      criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString()
    };
    lista.push(finalJiba);
    salvarLista(CHAVES.finaisJiba, lista);
    return finalJiba;
  }

  function montarFinalJiba({ serieId, modalidadeId, categoria, disputaTerceiro, representantesInfo, finalJibaExistenteId }){
    // representantesInfo: [{ turmaId, representanteOriginalAlunoId, participanteAlunoId, substituido, motivoSubstituicao }]
    let finalJiba;
    if(finalJibaExistenteId){
      finalJiba = getFinalJiba(finalJibaExistenteId);
      atualizarFinalJiba(finalJiba.id, {
        status:'Em andamento', disputaTerceiro,
        campeaoAlunoId:null, viceAlunoId:null, terceiroAlunoId:null
      });
      salvarLista(CHAVES.confrontosFinalJiba, lerLista(CHAVES.confrontosFinalJiba).filter(c => c.finalJibaId !== finalJiba.id));
      salvarLista(CHAVES.participantesFinalJiba, lerLista(CHAVES.participantesFinalJiba).filter(p => p.finalJibaId !== finalJiba.id));
      finalJiba = getFinalJiba(finalJiba.id);
    } else {
      const lista = getFinaisJiba();
      finalJiba = {
        id: gerarId(), serieId, modalidadeId, categoria,
        status:'Em andamento', disputaTerceiro,
        campeaoAlunoId:null, viceAlunoId:null, terceiroAlunoId:null,
        criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString()
      };
      lista.push(finalJiba);
      salvarLista(CHAVES.finaisJiba, lista);
    }

    const participantes = representantesInfo.map((r, idx) => ({
      id: gerarId(), finalJibaId: finalJiba.id, turmaId: r.turmaId,
      representanteOriginalAlunoId: r.representanteOriginalAlunoId,
      participanteAlunoId: r.participanteAlunoId,
      presente: true, substituido: !!r.substituido, motivoSubstituicao: r.motivoSubstituicao || '',
      bye:false, ordemSorteio: idx
    }));

    const N = representantesInfo.length;
    let size = 2;
    while(size < N) size *= 2;
    const numByes = size - N;
    const nomesFases = obterNomesFases(size);

    const comBye = representantesInfo.slice(0, numByes);
    const semBye = representantesInfo.slice(numByes);
    comBye.forEach(r => {
      const p = participantes.find(x => x.participanteAlunoId === r.participanteAlunoId && x.turmaId === r.turmaId);
      if(p) p.bye = true;
    });
    salvarLista(CHAVES.participantesFinalJiba, [...lerLista(CHAVES.participantesFinalJiba), ...participantes]);

    const confrontos = [];
    const round1Ids = [];
    comBye.forEach(r => {
      const c = {
        id: gerarId(), finalJibaId: finalJiba.id, fase: nomesFases[0], faseIndex: 0, ordem: confrontos.length,
        alunoAId: r.participanteAlunoId, turmaAId: r.turmaId, alunoBId: null, turmaBId: null,
        vencedorAlunoId: r.participanteAlunoId, perdedorAlunoId: null,
        placar: null, tipoResultado:'bye', observacao:'BYE — avanço automático',
        confrontoOrigemAId: null, confrontoOrigemBId: null, usaPerdedoresDaOrigem:false, terceiroLugar:false,
        status:'Finalizado'
      };
      confrontos.push(c);
      round1Ids.push(c.id);
    });
    for(let i = 0; i < semBye.length; i += 2){
      const rA = semBye[i], rB = semBye[i + 1];
      const c = {
        id: gerarId(), finalJibaId: finalJiba.id, fase: nomesFases[0], faseIndex: 0, ordem: confrontos.length,
        alunoAId: rA.participanteAlunoId, turmaAId: rA.turmaId, alunoBId: rB.participanteAlunoId, turmaBId: rB.turmaId,
        vencedorAlunoId: null, perdedorAlunoId: null,
        placar: null, tipoResultado: null, observacao: '',
        confrontoOrigemAId: null, confrontoOrigemBId: null, usaPerdedoresDaOrigem:false, terceiroLugar:false,
        status:'Aguardando'
      };
      confrontos.push(c);
      round1Ids.push(c.id);
    }

    let idsRodadaAnterior = round1Ids;
    for(let f = 1; f < nomesFases.length; f++){
      const idsRodadaAtual = [];
      for(let i = 0; i < idsRodadaAnterior.length; i += 2){
        const c = {
          id: gerarId(), finalJibaId: finalJiba.id, fase: nomesFases[f], faseIndex: f, ordem: idsRodadaAtual.length,
          alunoAId: null, turmaAId: null, alunoBId: null, turmaBId: null,
          vencedorAlunoId: null, perdedorAlunoId: null,
          placar: null, tipoResultado: null, observacao: '',
          confrontoOrigemAId: idsRodadaAnterior[i], confrontoOrigemBId: idsRodadaAnterior[i + 1],
          usaPerdedoresDaOrigem:false, terceiroLugar:false,
          status:'Aguardando'
        };
        confrontos.push(c);
        idsRodadaAtual.push(c.id);
      }
      idsRodadaAnterior = idsRodadaAtual;
    }

    if(disputaTerceiro && nomesFases.includes('Semifinal')){
      const faseIndexSemifinal = nomesFases.indexOf('Semifinal');
      const semifinais = confrontos.filter(c => c.faseIndex === faseIndexSemifinal && !c.terceiroLugar);
      if(semifinais.length === 2){
        confrontos.push({
          id: gerarId(), finalJibaId: finalJiba.id, fase:'Terceiro lugar', faseIndex: nomesFases.length - 1, ordem: 0,
          alunoAId: null, turmaAId: null, alunoBId: null, turmaBId: null,
          vencedorAlunoId: null, perdedorAlunoId: null,
          placar: null, tipoResultado: null, observacao: '',
          confrontoOrigemAId: semifinais[0].id, confrontoOrigemBId: semifinais[1].id,
          usaPerdedoresDaOrigem:true, terceiroLugar:true,
          status:'Aguardando'
        });
      }
    }

    salvarLista(CHAVES.confrontosFinalJiba, [...lerLista(CHAVES.confrontosFinalJiba), ...confrontos]);

    round1Ids.forEach(id => {
      const c = getConfrontoFinalJibaPorId(id);
      if(c && c.vencedorAlunoId) propagarResultadoFinalJiba(id);
    });

    return finalJiba;
  }

  function propagarResultadoFinalJiba(origemId){
    const confrontoOrigem = getConfrontoFinalJibaPorId(origemId);
    if(!confrontoOrigem) return;
    const todos = lerLista(CHAVES.confrontosFinalJiba);
    const dependentes = todos.filter(c => c.confrontoOrigemAId === origemId || c.confrontoOrigemBId === origemId);
    dependentes.forEach(dep => {
      const vencedorOuPerdedor = dep.usaPerdedoresDaOrigem ? confrontoOrigem.perdedorAlunoId : confrontoOrigem.vencedorAlunoId;
      const turmaCorrespondente = vencedorOuPerdedor === confrontoOrigem.alunoAId ? confrontoOrigem.turmaAId
        : vencedorOuPerdedor === confrontoOrigem.alunoBId ? confrontoOrigem.turmaBId : null;
      const dados = {};
      if(dep.confrontoOrigemAId === origemId){ dados.alunoAId = vencedorOuPerdedor; dados.turmaAId = turmaCorrespondente; }
      if(dep.confrontoOrigemBId === origemId){ dados.alunoBId = vencedorOuPerdedor; dados.turmaBId = turmaCorrespondente; }
      atualizarConfrontoFinalJiba(dep.id, dados);
    });
  }

  function atualizarResultadosFinaisJibaSeAplicavel(finalJibaId){
    const confrontos = getConfrontosFinalJiba(finalJibaId);
    const normais = confrontos.filter(c => !c.terceiroLugar);
    if(!normais.length) return;
    const maiorFaseIndex = Math.max(...normais.map(c => c.faseIndex));
    const final = normais.find(c => c.faseIndex === maiorFaseIndex);
    const terceiro = confrontos.find(c => c.terceiroLugar);

    const dados = {};
    if(final && final.vencedorAlunoId){
      dados.campeaoAlunoId = final.vencedorAlunoId;
      dados.viceAlunoId = final.perdedorAlunoId;
      dados.status = 'Finalizado';
    }
    if(terceiro && terceiro.vencedorAlunoId){
      dados.terceiroAlunoId = terceiro.vencedorAlunoId;
    }
    if(Object.keys(dados).length) atualizarFinalJiba(finalJibaId, dados);
  }

  function definirVencedorConfrontoFinalJiba(confrontoId, vencedorAlunoId, extras){
    const confronto = getConfrontoFinalJibaPorId(confrontoId);
    if(!confronto) return;
    const perdedorAlunoId = confronto.alunoAId === vencedorAlunoId ? confronto.alunoBId : confronto.alunoAId;
    atualizarConfrontoFinalJiba(confrontoId, { vencedorAlunoId, perdedorAlunoId, status:'Finalizado', ...extras });
    propagarResultadoFinalJiba(confrontoId);
    atualizarResultadosFinaisJibaSeAplicavel(confronto.finalJibaId);
  }

  function existeResultadoPosteriorDependenteFinalJiba(confrontoId){
    const todos = lerLista(CHAVES.confrontosFinalJiba);
    const dependentes = todos.filter(c => c.confrontoOrigemAId === confrontoId || c.confrontoOrigemBId === confrontoId);
    for(const dep of dependentes){
      if(dep.vencedorAlunoId) return true;
      if(existeResultadoPosteriorDependenteFinalJiba(dep.id)) return true;
    }
    return false;
  }

  function resetarConfrontoFinalJibaERecursivos(confrontoId){
    const todos = lerLista(CHAVES.confrontosFinalJiba);
    const dependentes = todos.filter(c => c.confrontoOrigemAId === confrontoId || c.confrontoOrigemBId === confrontoId);
    dependentes.forEach(dep => {
      const dadosReset = {};
      if(dep.confrontoOrigemAId === confrontoId){ dadosReset.alunoAId = null; dadosReset.turmaAId = null; }
      if(dep.confrontoOrigemBId === confrontoId){ dadosReset.alunoBId = null; dadosReset.turmaBId = null; }
      const tinhaVencedor = !!dep.vencedorAlunoId;
      dadosReset.vencedorAlunoId = null;
      dadosReset.perdedorAlunoId = null;
      dadosReset.status = 'Aguardando';
      dadosReset.placar = null;
      dadosReset.tipoResultado = null;
      dadosReset.observacao = '';
      atualizarConfrontoFinalJiba(dep.id, dadosReset);
      if(tinhaVencedor) resetarConfrontoFinalJibaERecursivos(dep.id);
    });
  }

  function corrigirVencedorConfrontoFinalJiba(confrontoId, novoVencedorAlunoId, extras){
    resetarConfrontoFinalJibaERecursivos(confrontoId);
    definirVencedorConfrontoFinalJiba(confrontoId, novoVencedorAlunoId, extras);
    const finalJibaId = getConfrontoFinalJibaPorId(confrontoId).finalJibaId;
    const normais = getConfrontosFinalJiba(finalJibaId).filter(x => !x.terceiroLugar);
    const maiorFaseIndex = Math.max(...normais.map(x => x.faseIndex));
    const aindaTemFinalVencida = normais.some(c => c.faseIndex === maiorFaseIndex && c.vencedorAlunoId);
    if(!aindaTemFinalVencida){
      atualizarFinalJiba(finalJibaId, { campeaoAlunoId:null, viceAlunoId:null, status:'Em andamento' });
    }
  }

  function resumoJibaDaTurma(turmaId){
    const participacoes = lerLista(CHAVES.participantesFinalJiba).filter(p => p.turmaId === turmaId);
    const resultados = [];
    let ouro = 0, prata = 0, bronze = 0;
    participacoes.forEach(p => {
      const finalJiba = getFinalJiba(p.finalJibaId);
      if(!finalJiba || finalJiba.status !== 'Finalizado') return;
      const modalidade = getModalidades().find(m => m.id === finalJiba.modalidadeId);
      let colocacao = null;
      if(finalJiba.campeaoAlunoId === p.participanteAlunoId){ colocacao = 1; ouro++; }
      else if(finalJiba.viceAlunoId === p.participanteAlunoId){ colocacao = 2; prata++; }
      else if(finalJiba.terceiroAlunoId === p.participanteAlunoId){ colocacao = 3; bronze++; }
      if(colocacao){
        resultados.push({ modalidade, aluno: getAluno(p.participanteAlunoId), colocacao });
      }
    });
    return { resultados, ouro, prata, bronze, participacoes: participacoes.length };
  }

  function jibaDoAluno(alunoId){
    const participacoes = lerLista(CHAVES.participantesFinalJiba).filter(p => p.participanteAlunoId === alunoId);
    return participacoes.map(p => {
      const finalJiba = getFinalJiba(p.finalJibaId);
      if(!finalJiba) return null;
      const confrontos = getConfrontosFinalJiba(finalJiba.id).filter(c =>
        c.alunoAId === alunoId || c.alunoBId === alunoId
      ).sort((a, b) => a.faseIndex - b.faseIndex);
      return { finalJiba, modalidade: getModalidades().find(m => m.id === finalJiba.modalidadeId), turmaId: p.turmaId, confrontos };
    }).filter(Boolean);
  }

  /* ---------- Relatórios e Impressão (Bloco 9) — somente LEITURA ----------
     Nenhuma tabela nova. Tudo é calculado a partir dos dados já existentes
     dos Blocos 1 a 8, para nunca desatualizar e nunca duplicar dados. */

  function relatorioRepresentantesDaTurma(turmaId){
    // Modalidades individuais vinculadas à série da turma, com o representante
    // (campeão do chaveamento FINALIZADO do Bloco 7) e o vice como reserva.
    const turma = getTurmas().find(t => t.id === turmaId);
    if(!turma) return [];
    const modalidades = modalidadesDaSerie(turma.serieId).filter(m => m.tipo === 'Individual');
    const linhas = [];
    modalidades.forEach(m => {
      ['Masculino', 'Feminino'].forEach(categoria => {
        const elegiveis = alunosElegiveisChaveamento(turmaId, m.id, categoria);
        if(!elegiveis.length) return;
        const chaveamentos = getChaveamentosPorContexto(turmaId, m.id, categoria);
        const chaveamento = chaveamentos[0] || null;
        linhas.push({
          modalidade: m, categoria,
          representante: chaveamento && chaveamento.status === 'Finalizado' ? getAluno(chaveamento.campeaoAlunoId) : null,
          reserva: chaveamento && chaveamento.status === 'Finalizado' ? getAluno(chaveamento.viceAlunoId) : null,
          status: !chaveamento ? 'nao_iniciado' : chaveamento.status === 'Finalizado' ? 'definido' : 'em_andamento'
        });
      });
    });
    return linhas;
  }

  function relatorioEquipesDaTurma(turmaId){
    // Modalidades coletivas vinculadas à série da turma com pelo menos um inscrito dela.
    const turma = getTurmas().find(t => t.id === turmaId);
    if(!turma) return [];
    const modalidades = modalidadesColetivasDaSerie(turma.serieId);
    const linhas = [];
    modalidades.forEach(m => {
      const inscritos = getAlunosInscritosModalidade(turmaId, m.id);
      if(!inscritos.length) return;
      const equipe = getEquipe(turmaId, m.id);
      const participacoes = equipe ? getParticipacoesEquipe(equipe.id) : [];
      const titulares = participacoes.filter(p => p.status === 'Titular/Selecionado').map(p => getAluno(p.alunoId)).filter(Boolean);
      const reservas = participacoes.filter(p => p.status === 'Reserva').map(p => getAluno(p.alunoId)).filter(Boolean);
      const capitaoParticipacao = participacoes.find(p => p.capitao);
      linhas.push({
        modalidade: m,
        equipeDefinida: !!equipe,
        titulares, reservas,
        capitao: capitaoParticipacao ? getAluno(capitaoParticipacao.alunoId) : null
      });
    });
    return linhas;
  }

  function relatorioInscricoesDaTurma(turmaId){
    return getAlunosPorTurma(turmaId)
      .slice()
      .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))
      .map(aluno => ({
        aluno,
        modalidades: getInscricoesDoAluno(aluno.id).map(id => getModalidades().find(m => m.id === id)).filter(Boolean)
      }));
  }

  // Etapa 2B-4: visão rápida (só leitura) das inscrições de uma turma,
  // agrupadas por modalidade e separadas por sexo -- para a área
  // "📋 Ver inscrições" dentro de Alunos. Reaproveita só getters já
  // existentes (alunos/inscrições/modalidades/modalidade_serie); nenhuma
  // tabela nova, nenhum dado copiado ou recalculado além da agregação
  // em memória.
  function resumoInscricoesPorTurma(turmaId){
    const turma = getTurmas().find(t => t.id === turmaId);
    if(!turma) return null;
    const alunosDaTurma = getAlunosPorTurma(turmaId);
    const modalidadesDaTurma = modalidadesDaSerie(turma.serieId);

    const porModalidade = modalidadesDaTurma.map(m => {
      const inscritos = getAlunosInscritosModalidade(turmaId, m.id).map(id => getAluno(id)).filter(Boolean);
      const masculino = inscritos.filter(a => a.sexo === 'Masculino').sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      const feminino = inscritos.filter(a => a.sexo === 'Feminino').sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      return { modalidade: m, masculino, feminino, total: masculino.length + feminino.length };
    })
      .filter(r => r.total > 0)
      .sort((a, b) => a.modalidade.nome.localeCompare(b.modalidade.nome, 'pt-BR'));

    const totalInscricoes = porModalidade.reduce((soma, r) => soma + r.total, 0);

    return {
      turma,
      alunosCadastrados: alunosDaTurma.length,
      totalInscricoes,
      modalidadesUtilizadas: porModalidade.length,
      modalidades: porModalidade
    };
  }

  function relatorioInscritosPorModalidade(modalidadeId, serieId, categoria){
    const modalidade = getModalidades().find(m => m.id === modalidadeId);
    if(!modalidade) return { turmas: [], total: 0 };
    const turmas = getTurmasAtivasDaSerie(serieId);
    const porTurma = turmas.map(turma => {
      let alunos = getAlunosInscritosModalidade(turma.id, modalidadeId).map(id => getAluno(id)).filter(Boolean);
      if(categoria) alunos = alunos.filter(a => a.sexo === categoria);
      alunos.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      return { turma, alunos };
    }).filter(t => t.alunos.length);
    const total = porTurma.reduce((s, t) => s + t.alunos.length, 0);
    return { turmas: porTurma, total };
  }

  function relatorioResultadosSeletivasDaTurma(turmaId){
    const turma = getTurmas().find(t => t.id === turmaId);
    if(!turma) return [];
    const modalidades = modalidadesDaSerie(turma.serieId).filter(m => m.tipo === 'Individual');
    const linhas = [];
    modalidades.forEach(m => {
      ['Masculino', 'Feminino'].forEach(categoria => {
        const elegiveis = alunosElegiveisChaveamento(turmaId, m.id, categoria);
        if(!elegiveis.length) return;
        const chaveamentos = getChaveamentosPorContexto(turmaId, m.id, categoria).filter(c => c.status === 'Finalizado');
        if(!chaveamentos.length) return;
        const c = chaveamentos[0];
        linhas.push({
          modalidade: m, categoria,
          campeao: getAluno(c.campeaoAlunoId), vice: c.viceAlunoId ? getAluno(c.viceAlunoId) : null,
          terceiro: c.terceiroAlunoId ? getAluno(c.terceiroAlunoId) : null
        });
      });
    });
    return linhas;
  }

  function relatorioResultadosJiba({ serieId, modalidadeId } = {}){
    let finais = getFinaisJiba().filter(f => f.status === 'Finalizado');
    if(serieId) finais = finais.filter(f => f.serieId === serieId);
    if(modalidadeId) finais = finais.filter(f => f.modalidadeId === modalidadeId);
    return finais.map(f => {
      const participantes = getParticipantesFinalJiba(f.id);
      const turmaDe = alunoId => participantes.find(p => p.participanteAlunoId === alunoId)?.turmaId;
      return {
        finalJiba: f,
        modalidade: getModalidades().find(m => m.id === f.modalidadeId),
        serie: getSeries().find(s => s.id === f.serieId),
        campeao: getAluno(f.campeaoAlunoId), turmaCampeao: turmaDe(f.campeaoAlunoId),
        vice: f.viceAlunoId ? getAluno(f.viceAlunoId) : null, turmaVice: turmaDe(f.viceAlunoId),
        terceiro: f.terceiroAlunoId ? getAluno(f.terceiroAlunoId) : null, turmaTerceiro: turmaDe(f.terceiroAlunoId)
      };
    });
  }

  function quadroDeMedalhasJiba(){
    const mapa = {};
    getFinaisJiba().filter(f => f.status === 'Finalizado').forEach(f => {
      const participantes = getParticipantesFinalJiba(f.id);
      const turmaDe = alunoId => participantes.find(p => p.participanteAlunoId === alunoId)?.turmaId;
      const tOuro = turmaDe(f.campeaoAlunoId);
      const tPrata = f.viceAlunoId ? turmaDe(f.viceAlunoId) : null;
      const tBronze = f.terceiroAlunoId ? turmaDe(f.terceiroAlunoId) : null;
      if(tOuro){ mapa[tOuro] = mapa[tOuro] || { ouro:0, prata:0, bronze:0 }; mapa[tOuro].ouro++; }
      if(tPrata){ mapa[tPrata] = mapa[tPrata] || { ouro:0, prata:0, bronze:0 }; mapa[tPrata].prata++; }
      if(tBronze){ mapa[tBronze] = mapa[tBronze] || { ouro:0, prata:0, bronze:0 }; mapa[tBronze].bronze++; }
    });
    return Object.entries(mapa).map(([turmaId, medalhas]) => ({ turma: getTurmas().find(t => t.id === turmaId), ...medalhas }))
      .filter(x => x.turma)
      .sort((a, b) => b.ouro - a.ouro || b.prata - a.prata || b.bronze - a.bronze);
  }

  function calcularPendencias(){
    const pendencias = [];
    getSeries().filter(s => s.ativo).forEach(serie => {
      getTurmasAtivasDaSerie(serie.id).forEach(turma => {
        modalidadesDaSerie(serie.id).filter(m => m.tipo === 'Individual').forEach(modalidade => {
          ['Masculino', 'Feminino'].forEach(categoria => {
            const elegiveis = alunosElegiveisChaveamento(turma.id, modalidade.id, categoria);
            if(elegiveis.length < 2) return;
            const chaveamentos = getChaveamentosPorContexto(turma.id, modalidade.id, categoria);
            if(!chaveamentos.length){
              pendencias.push({ texto: `${serie.nome} ${turma.turma} — ${modalidade.nome} (${categoria}) — seletiva não iniciada` });
            } else if(chaveamentos[0].status !== 'Finalizado'){
              pendencias.push({ texto: `${serie.nome} ${turma.turma} — ${modalidade.nome} (${categoria}) — chaveamento em andamento` });
            }
          });
        });
      });
    });
    return pendencias;
  }

  function resumoGeralRelatorio(){
    const seletivas = getSeletivas();
    return {
      totalAlunos: getAlunos().length,
      totalInscricoes: getInscricoes().length,
      totalModalidades: getModalidades().filter(m => m.ativo).length,
      totalRepresentantesDefinidos: getChaveamentos().filter(c => c.status === 'Finalizado' && c.campeaoAlunoId).length,
      seletivasConcluidas: seletivas.filter(s => s.status === 'Concluída').length,
      seletivasPendentes: seletivas.filter(s => s.status === 'Pendente').length,
      finaisJibaConcluidas: getFinaisJiba().filter(f => f.status === 'Finalizado').length,
      finaisJibaPendentes: getFinaisJiba().filter(f => f.status === 'Em andamento').length,
      pendencias: calcularPendencias()
    };
  }

  /* ---------- Importação Rápida de Alunos (Bloco 10) ----------
     Sem tabela nova: usa a mesma tabela `alunos` (com um campo opcional
     `importacaoId` para permitir desfazer) e o mesmo `addAluno`/`excluirAluno`
     já existentes dos Blocos 2+. */

  function analisarListaAlunosTexto(texto){
    return (texto || '')
      .split('\n')
      .map(linha => {
        let s = linha.trim();
        s = s.replace(/^\d+\s*[\.\)\-]\s*/, ''); // numeração: "1. " "1) " "1 - "
        s = s.replace(/^[-•]\s*/, '');           // marcadores: "- " "• "
        s = s.replace(/\s+/g, ' ').trim();       // espaços internos extras
        return s;
      })
      .filter(s => s.length > 0);
  }

  function prepararImportacaoAlunos(texto, turmaId){
    const linhasLimpas = analisarListaAlunosTexto(texto);
    const existentes = new Set(getAlunosPorTurma(turmaId).map(a => a.nome.toLowerCase()));
    const vistosNestaLista = new Set();
    return linhasLimpas.map(nome => {
      const chave = nome.toLowerCase();
      const duplicadoNaLista = vistosNestaLista.has(chave);
      const jaCadastrado = existentes.has(chave);
      vistosNestaLista.add(chave);
      return {
        nome,
        duplicadoNaLista,
        jaCadastrado,
        marcadoPorPadrao: !duplicadoNaLista && !jaCadastrado
      };
    });
  }

  async function importarAlunosEmLote(turmaId, serieId, itens){
    const importacaoId = gerarUuidCliente(); // alunos.importacao_id é uuid no Supabase
    const resumo = { importacaoId, totalAnalisado: itens.length, importados:0, jaCadastrados:0, ignorados:0 };
    for(const item of itens){
      if(item.marcado){
        await addAluno({ turmaId, serieId, nome: item.nome, sexo:'Não informado', importacaoId });
        resumo.importados++;
      } else if(item.jaCadastrado){
        resumo.jaCadastrados++;
      } else {
        resumo.ignorados++;
      }
    }
    return resumo;
  }

  function getAlunosDaImportacao(importacaoId){
    return getAlunos().filter(a => a.importacaoId === importacaoId);
  }

  function alunoTemVinculos(alunoId){
    return getInscricoesDoAluno(alunoId).length > 0
      || getParticipacoesDoAluno(alunoId).length > 0
      || getParticipacoesEquipeDoAluno(alunoId).length > 0
      || chaveamentosDoAluno(alunoId).length > 0
      || jibaDoAluno(alunoId).length > 0;
  }

  async function desfazerImportacao(importacaoId){
    const alunosDaImportacao = getAlunosDaImportacao(importacaoId);
    if(!alunosDaImportacao.length) return { sucesso:false, motivo:'nao_encontrada' };
    const comVinculo = alunosDaImportacao.filter(a => alunoTemVinculos(a.id));
    if(comVinculo.length){
      return { sucesso:false, motivo:'com_vinculo', alunos: comVinculo };
    }
    for(const a of alunosDaImportacao){
      await excluirAluno(a.id);
    }
    return { sucesso:true, quantidade: alunosDaImportacao.length };
  }

/* ------------------------------------------------------------
   Helper de feedback para operações assíncronas com o Supabase
   (Migração Etapa 2): desabilita o botão, mostra um texto de
   carregamento, executa a ação e sempre restaura o botão -- mesmo
   se der erro. Evita clique duplo e tela travada em caso de falha.
------------------------------------------------------------ */
async function executarComFeedback(botao, textoCarregando, acao){
  const textoOriginal = botao ? botao.textContent : null;
  if(botao){ botao.disabled = true; botao.textContent = textoCarregando; }
  try {
    await acao();
    return true;
  } catch(e){
    console.error('Erro ao comunicar com o Supabase:', e);
    alert('Não foi possível salvar. Verifique sua conexão e tente novamente.');
    return false;
  } finally {
    if(botao){ botao.disabled = false; botao.textContent = textoOriginal; }
  }
}

   de competição para Inscrições e para a Ficha da Turma. */
function telaAgrupamentosLista(){
  const ativos = DB.getAgrupamentosAtivos();
  return `
    <button class="botao-voltar" onclick="location.hash='#/config'">&larr; Configurações</button>

    ${!ativos.length ? '<p style="color:var(--texto-suave); font-size:14px;">Nenhum agrupamento ativo no momento.</p>' : ativos.map(a => {
      const serie = DB.getSeries().find(s => s.id === a.serieId);
      const turmas = a.turmaIds.map(tid => DB.getTurmas().find(t => t.id === tid)).filter(Boolean);
      const totalAlunos = turmas.reduce((s, t) => s + DB.getAlunosPorTurma(t.id).length, 0);
      return `
        <div class="bloco">
          <h3 style="margin-bottom:4px;">🔗 ${a.nome}</h3>
          <p style="font-size:12.5px; color:var(--texto-suave); margin:0 0 10px;">${serie ? serie.nome : ''} · ${turmas.map(t => t.turma).join(' + ')} · ${totalAlunos} aluno${totalAlunos === 1 ? '' : 's'}</p>

function ligarEventosAgrupamentosLista(){
  document.querySelectorAll('button[data-acao="separar"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const agrupamento = DB.getAgrupamento(btn.dataset.id);
      if(!confirm(`Separar o agrupamento "${agrupamento ? agrupamento.nome : ''}"? As turmas continuam existindo normalmente, com seus alunos e inscrições.`)) return;
      const ok = await executarComFeedback(btn, '...', () => DB.separarAgrupamento(btn.dataset.id));
      if(!ok) return;
      mostrarToast('Agrupamento separado.');
      const app = document.getElementById('app');
      app.innerHTML = telaAgrupamentosLista();
      ligarEventosAgrupamentosLista();

  });

function ligarEventosAgrupamentoNovo(serieId){
  const lista = document.getElementById('listaTurmasAgrupamento');
  const nomeInput = document.getElementById('nomeAgrupamento');
  if(!lista || !nomeInput) return;
  const turmas = DB.getTurmasAtivasDaSerie(serieId);

  function atualizarNomeSugerido(){
    const marcadas = Array.from(lista.querySelectorAll('input:checked')).map(c => c.value);
    if(nomeInput.dataset.editadoManualmente === 'true') return;
    const nomes = turmas.filter(t => marcadas.includes(t.id)).map(t => t.turma);
    const serie = DB.getSeries().find(s => s.id === serieId);
    nomeInput.value = nomes.length ? nomes.map(n => `${serie.nome} ${n}`).join(' + ') : '';
  }
  lista.addEventListener('change', e => {
    e.target.closest('.item-checkbox-modalidade')?.classList.toggle('marcado', e.target.checked);
    atualizarNomeSugerido();
  });
  nomeInput.addEventListener('input', () => { nomeInput.dataset.editadoManualmente = 'true'; });

  document.getElementById('btnCriarAgrupamento').addEventListener('click', async () => {
    const marcadas = Array.from(lista.querySelectorAll('input:checked')).map(c => c.value);
    const nome = nomeInput.value.trim();
    if(marcadas.length < 2){ alert('Selecione pelo menos duas turmas.'); return; }
    if(!nome){ alert('Informe um nome para o grupo.'); return; }
    const btn = document.getElementById('btnCriarAgrupamento');
    let criado = null;
    const ok = await executarComFeedback(btn, 'Criando...', async () => {
      criado = await DB.criarAgrupamento(nome, serieId, marcadas);
    });
    if(!ok) return;
    mostrarToast('Agrupamento criado.');
    location.hash = '#/config/agrupamentos';
  });
}

  const elAlunos = document.getElementById('resumoTotalAlunos');
  const elInscricoes = document.getElementById('resumoTotalInscricoes');

  if(elInscricoes) elInscricoes.textContent = totalInscricoes;
}

  let alunos = DB.getAlunosPorTurma(turmaId);
  if(termoBusca){
    alunos = alunos.filter(a => a.nome.toLowerCase().includes(termoBusca));
  }
  alunos.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));

  if(!alunos.length){
    container.innerHTML = `<p style="color:var(--texto-suave); font-size:14px; text-align:center; padding:20px 0;">
      ${termoBusca ? 'Nenhum aluno encontrado.' : 'Nenhum aluno cadastrado nesta turma ainda.'}
    </p>`;
    return;
  }

  container.innerHTML = alunos.map(a => {
    const total = DB.contarInscricoesDoAluno(a.id);
    return `
      <div class="cartao-aluno" data-id="${a.id}">
        <div class="topo-aluno">
          <div>
            <div class="nome-aluno">${a.nome}</div>
            <div class="meta-aluno">
              <select class="seletor-sexo-cartao" data-acao="alterar-sexo" data-id="${a.id}">
                <option value="Feminino" ${a.sexo === 'Feminino' ? 'selected' : ''}>Feminino</option>
                <option value="Masculino" ${a.sexo === 'Masculino' ? 'selected' : ''}>Masculino</option>
                <option value="Não informado" ${a.sexo === 'Não informado' ? 'selected' : ''}>Não informado</option>
              </select>
            </div>
            ${total > 0 ? `<div class="resumo-aluno">${total} modalidade${total > 1 ? 's' : ''}</div>` : ''}
          </div>
        </div>
        <div class="acoes-aluno">
          <button data-acao="inscricoes-aluno" data-id="${a.id}">Inscrições</button>
          <button data-acao="editar-aluno" data-id="${a.id}">Editar</button>
          <button class="acao-excluir" data-acao="excluir-aluno" data-id="${a.id}">Excluir</button>
        </div>
      </div>
    `;
  }).join('');
}
