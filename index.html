function telaFinalJibaDetalhe(finalJibaId){
  const f = DB.getFinalJiba(finalJibaId);
  if(!f){
    return `<button class="botao-voltar" onclick="location.hash='#/finais-jiba/lista'">&larr; Finais JIBA</button>
      <div class="tela-em-breve"><div class="icone-grande">❓</div><h2>Final não encontrada</h2></div>`;
  }
  const modalidade = DB.getModalidades().find(m => m.id === f.modalidadeId);
  const serie = DB.getSeries().find(s => s.id === f.serieId);
  confrontosFinalJibaEmEdicao.clear();

  const confrontos = DB.getConfrontosFinalJiba(finalJibaId);
  const fases = [...new Set(confrontos.filter(x => !x.terceiroLugar).map(x => x.faseIndex))].sort((a, b) => a - b);
  const terceiroLugarConfronto = confrontos.find(x => x.terceiroLugar);
  const participantes = DB.getParticipantesFinalJiba(finalJibaId);
  const substituicoes = participantes.filter(p => p.substituido);

  return `
    <button class="botao-voltar" onclick="location.hash='#/finais-jiba/lista'">&larr; Finais JIBA</button>
    <div class="bloco">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <h3>${iconeModalidade(modalidade ? modalidade.nome : '')} ${modalidade ? modalidade.nome : ''}<br><span style="font-size:13px; font-weight:400; color:var(--texto-suave);">${serie ? serie.nome : ''} · ${f.categoria}</span></h3>
        <span class="selo-status-seletiva ${f.status === 'Finalizado' ? 'selo-concluida' : 'selo-pendente'}">${f.status === 'Finalizado' ? '✅ Finalizada' : '▶️ Em andamento'}</span>
      </div>
      <button class="botao botao-secundario" id="btnRefazerSorteioJiba" type="button" style="width:100%; margin-top:12px;">🎲 Refazer sorteio</button>
      <button class="botao-texto" onclick="location.hash='#/relatorios/final-jiba-direto/${finalJibaId}'" style="width:100%; margin-top:8px;">🖨️ Imprimir resultado</button>
      <button class="botao-texto" id="btnExcluirFinalJiba" type="button" style="width:100%; margin-top:8px; color:#B23A3A;">🗑️ Excluir Final JIBA</button>
    </div>

    ${substituicoes.length ? `
      <div class="bloco">
        <h3>🔄 Substituições</h3>
        ${substituicoes.map(s => `
          <div class="linha-detalhe"><span>${nomeExibidoTurma(s.turmaId)}: ${DB.getAluno(s.representanteOriginalAlunoId)?.nome || '—'} → ${DB.getAluno(s.participanteAlunoId)?.nome || '—'}</span></div>
          <div style="font-size:12px; color:var(--texto-suave); margin-top:-2px; margin-bottom:8px;">${s.motivoSubstituicao || 'Sem motivo informado'}</div>
        `).join('')}
      </div>
    ` : ''}

    ${f.campeaoAlunoId ? `
      <div class="podio-chaveamento">
        <div class="medalha-grande">🏆</div>
        <div class="nome-campeao">${DB.getAluno(f.campeaoAlunoId)?.nome || '—'}</div>
        <div class="selo-representante">${nomeExibidoTurma(participantes.find(p => p.participanteAlunoId === f.campeaoAlunoId)?.turmaId)}</div>
        ${f.viceAlunoId ? `<div class="podio-vice">🥈 Vice: ${DB.getAluno(f.viceAlunoId)?.nome || '—'} — ${nomeExibidoTurma(participantes.find(p => p.participanteAlunoId === f.viceAlunoId)?.turmaId)}</div>` : ''}
        ${f.terceiroAlunoId ? `<div class="podio-vice">🥉 3º lugar: ${DB.getAluno(f.terceiroAlunoId)?.nome || '—'} — ${nomeExibidoTurma(participantes.find(p => p.participanteAlunoId === f.terceiroAlunoId)?.turmaId)}</div>` : ''}
      </div>
      <button class="botao botao-secundario" id="btnEnviarPodioColocacoes" type="button" style="width:100%; margin-bottom:16px;">Enviar pódio para Colocações (opcional)</button>
      <div id="areaEnviarPodio"></div>
    ` : ''}

    <div id="areaBracketJiba">
      ${fases.map(fi => {
        const confrontosFase = confrontos.filter(x => x.faseIndex === fi && !x.terceiroLugar).sort((a, b) => a.ordem - b.ordem);
        return `
          <div class="cartao-fase">
            <h4>${confrontosFase[0].fase}</h4>
            ${confrontosFase.map(cf => cardConfrontoFinalJibaHtml(cf)).join('')}
          </div>
        `;
      }).join('')}
      ${terceiroLugarConfronto ? `
        <div class="cartao-fase">
          <h4>🥉 Disputa de 3º lugar</h4>
          ${cardConfrontoFinalJibaHtml(terceiroLugarConfronto)}
        </div>
      ` : ''}
    </div>
  `;
}

function renderAreaEnviarPodio(finalJibaId){
  const area = document.getElementById('areaEnviarPodio');
  if(!area) return;
  const f = DB.getFinalJiba(finalJibaId);
  const campeao = DB.getAluno(f.campeaoAlunoId);
  const vice = f.viceAlunoId ? DB.getAluno(f.viceAlunoId) : null;
  const terceiro = f.terceiroAlunoId ? DB.getAluno(f.terceiroAlunoId) : null;
  const linhas = [`1º ${campeao.nome}`];
  if(vice) linhas.push(`2º ${vice.nome}`);
  if(terceiro) linhas.push(`3º ${terceiro.nome}`);

  area.innerHTML = `
    <div class="bloco">
      <h3>Enviar pódio para Colocações</h3>
      <p style="font-size:13px; color:var(--texto-suave); margin:-4px 0 10px;">Registra a colocação final desta modalidade individual no módulo de Classificação (Bloco 6). Confira antes de confirmar.</p>
      ${linhas.map(l => `<div class="linha-detalhe"><span>${l}</span></div>`).join('')}
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button class="botao botao-primario" id="btnConfirmarEnvioPodio" type="button" style="flex:1;">Confirmar</button>
        <button class="botao botao-secundario" id="btnCancelarEnvioPodio" type="button" style="flex:1;">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('btnConfirmarEnvioPodio').addEventListener('click', () => {
    const resultado = DB.obterOuCriarResultadoModalidade(f.modalidadeId, f.serieId, f.categoria, 'individual');
    const mapa = { [campeao.id]: 1 };
    if(vice) mapa[vice.id] = 2;
    if(terceiro) mapa[terceiro.id] = 3;
    DB.salvarColocacoesIndividual(resultado.id, mapa);
    mostrarToast('Pódio enviado para Colocações.');
    area.innerHTML = '';
  });
  document.getElementById('btnCancelarEnvioPodio').addEventListener('click', () => { area.innerHTML = ''; });
}

function ligarEventosFinalJibaDetalhe(finalJibaId){
  const areaBracket = document.getElementById('areaBracketJiba');
  areaBracket.addEventListener('click', e => {
    const btnToggle = e.target.closest('button[data-acao="toggle-opcoes-jiba"]');
    if(btnToggle){
      const painel = document.getElementById(`opcoesJiba-${btnToggle.dataset.id}`);
      if(painel) painel.style.display = painel.style.display === 'none' ? 'grid' : 'none';
      return;
    }
    const btnCorrigir = e.target.closest('button[data-acao="corrigir-vencedor-jiba"]');
    if(btnCorrigir){
      const confrontoId = btnCorrigir.dataset.id;
      const dependente = DB.existeResultadoPosteriorDependenteFinalJiba(confrontoId);
      const mensagem = dependente
        ? '⚠️ Alterar este resultado afetará a fase seguinte.\n\nOs resultados dependentes serão apagados e reconstruídos. Deseja continuar?'
        : 'Deseja corrigir o vencedor deste confronto?';
      if(!confirm(mensagem)) return;
      confrontosFinalJibaEmEdicao.add(confrontoId);
      rerenderizarFinalJibaDetalhe(finalJibaId);
      return;
    }
    const btnCancelar = e.target.closest('button[data-acao="cancelar-correcao-jiba"]');
    if(btnCancelar){
      confrontosFinalJibaEmEdicao.delete(btnCancelar.dataset.id);
      rerenderizarFinalJibaDetalhe(finalJibaId);
      return;
    }
    const btnVencedor = e.target.closest('button[data-acao="vencedor-jiba"]');
    if(btnVencedor){
      const confrontoId = btnVencedor.dataset.id;
      const vencedorAlunoId = btnVencedor.dataset.vencedor;
      const vencedorAluno = DB.getAluno(vencedorAlunoId);
      if(!confirm(`Confirma ${vencedorAluno.nome} como vencedor?`)) return;
      const tipoResultado = document.getElementById(`tipoResultadoJiba-${confrontoId}`)?.value || 'normal';
      const placar = document.getElementById(`placarJiba-${confrontoId}`)?.value.trim() || null;
      const observacao = document.getElementById(`observacaoJiba-${confrontoId}`)?.value.trim() || '';
      if(confrontosFinalJibaEmEdicao.has(confrontoId)){
        DB.corrigirVencedorConfrontoFinalJiba(confrontoId, vencedorAlunoId, { tipoResultado, placar, observacao });
        confrontosFinalJibaEmEdicao.delete(confrontoId);
      } else {
        DB.definirVencedorConfrontoFinalJiba(confrontoId, vencedorAlunoId, { tipoResultado, placar, observacao });
      }
      mostrarToast('Resultado registrado.');
      rerenderizarFinalJibaDetalhe(finalJibaId);
    }
  });

  document.getElementById('btnRefazerSorteioJiba').addEventListener('click', () => {
    const f = DB.getFinalJiba(finalJibaId);
    const confrontosAtuais = DB.getConfrontosFinalJiba(finalJibaId);
    const temResultado = confrontosAtuais.some(cf => cf.vencedorAlunoId && cf.tipoResultado !== 'bye');
    const mensagem = temResultado
      ? '⚠️ Esta Final já possui resultados.\n\nRefazer o sorteio apagará os confrontos e resultados (os representantes continuam os mesmos).\n\nDeseja realmente refazer?'
      : 'Deseja sortear novamente os confrontos?';
    if(!confirm(mensagem)) return;
    const participantesAtuais = DB.getParticipantesFinalJiba(finalJibaId).map(p => ({
      turmaId: p.turmaId, representanteOriginalAlunoId: p.representanteOriginalAlunoId,
      participanteAlunoId: p.participanteAlunoId, substituido: p.substituido, motivoSubstituicao: p.motivoSubstituicao,
      id: p.participanteAlunoId
    }));
    const novaOrdem = DB.embaralharFisherYates(participantesAtuais);
    DB.montarFinalJiba({ serieId: f.serieId, modalidadeId: f.modalidadeId, categoria: f.categoria, disputaTerceiro: f.disputaTerceiro, representantesInfo: novaOrdem, finalJibaExistenteId: finalJibaId });
    mostrarToast('Sorteio refeito.');
    rerenderizarFinalJibaDetalhe(finalJibaId);
  });

  document.getElementById('btnExcluirFinalJiba').addEventListener('click', () => {
    if(!confirm('⚠️ Deseja realmente excluir esta Final do JIBA?\n\nIsso não apaga alunos, inscrições, seletivas nem o chaveamento de turma do Bloco 7 — só o registro desta Final.')) return;
    DB.excluirFinalJiba(finalJibaId);
    mostrarToast('Final JIBA excluída.');
    location.hash = '#/finais-jiba/lista';
  });

  const btnEnviarPodio = document.getElementById('btnEnviarPodioColocacoes');
  if(btnEnviarPodio){
    btnEnviarPodio.addEventListener('click', () => renderAreaEnviarPodio(finalJibaId));
  }
}
function rerenderizarFinalJibaDetalhe(finalJibaId){
  const app = document.getElementById('app');
  app.innerHTML = telaFinalJibaDetalhe(finalJibaId);
  ligarEventosFinalJibaDetalhe(finalJibaId);
  window.scrollTo(0, 0);
}

      </div>

    <div class="folha-relatorio" id="conteudoRepresentantes"></div>

function renderConteudoRepresentantes(){
  const container = document.getElementById('conteudoRepresentantes');
  if(!container) return;
  const filtroSerie = document.getElementById('filtroSerieRepr')?.value || '';
  const filtroModalidade = document.getElementById('filtroModalidadeRepr')?.value || '';
  const filtroCategoria = document.getElementById('filtroCategoriaRepr')?.value || '';

  const series = filtroSerie ? [DB.getSeries().find(s => s.id === filtroSerie)] : DB.getSeries().filter(s => s.ativo);
  const blocosSeries = series.filter(Boolean).map(serie => {
    const turmas = DB.getTurmasAtivasDaSerie(serie.id);
    const blocosTurma = turmas.map(turma => {
      let linhas = DB.relatorioRepresentantesDaTurma(turma.id).filter(r => r.status === 'definido');
      if(filtroModalidade) linhas = linhas.filter(r => r.modalidade.id === filtroModalidade);
      if(filtroCategoria) linhas = linhas.filter(r => r.categoria === filtroCategoria);
      if(!linhas.length) return '';
      return `
        <div class="secao-relatorio">
          <h3>${serie.nome} ${turma.turma}</h3>
          ${linhas.map(l => `<div class="linha-relatorio"><span>${l.modalidade.nome} (${l.categoria})</span><span>⭐ ${l.representante.nome}</span></div>`).join('')}
        </div>
      `;
    }).filter(Boolean).join('');
    return blocosTurma ? `<div class="grupo-serie-relatorio"><h2>${serie.nome.toUpperCase()}</h2>${blocosTurma}</div>` : '';
  }).filter(Boolean).join('');

  container.innerHTML = `
    ${cabecalhoRelatorioHtml('REPRESENTANTES DO JIBA')}
    ${blocosSeries || '<p style="color:var(--texto-suave); font-size:14px;">Nenhum representante definido ainda para os filtros selecionados.</p>'}
  `;
}
function ligarEventosRelatorioRepresentantes(){
  renderConteudoRepresentantes();
  ['filtroSerieRepr','filtroModalidadeRepr','filtroCategoriaRepr'].forEach(id => {
    document.getElementById(id).addEventListener('change', renderConteudoRepresentantes);
  });
}

/* ---------- Ficha de Seletiva (Etapa 2B-6) ----------
   Uma seletiva específica (modalidade + série + categoria), com o estado
   JÁ REGISTRADO na seletiva digital (presença/status/colocação) -- não é
   um formulário em branco, mas como os campos ainda não preenchidos ficam
   vazios, também serve para preencher à mão se for impresso antes da
   seletiva acontecer. Só leitura: usa DB.getSeletiva/DB.getParticipacoes
   já existentes, nenhum dado novo. */
function conteudoFichaSeletiva(modalidadeId, serieId, categoria){
  const modalidade = DB.getModalidades().find(m => m.id === modalidadeId);
  const serie = DB.getSeries().find(s => s.id === serieId);
  if(!modalidade || !serie) return '';
  const seletiva = DB.getSeletiva(modalidadeId, serieId, categoria);
  const participacoes = seletiva ? DB.getParticipacoes(seletiva.id) : [];
  const linhas = participacoes
    .map(p => ({ p, aluno: DB.getAluno(p.alunoId) }))
    .filter(l => l.aluno)
    .sort((a, b) => a.aluno.nome.localeCompare(b.aluno.nome, 'pt-BR'));
  const comObservacao = linhas.filter(l => l.p.observacao);

  return `
    ${cabecalhoRelatorioHtml('SELETIVA', `${iconeModalidade(modalidade.nome)} ${modalidade.nome} — ${serie.nome} — ${categoria}`)}
    ${!linhas.length ? '<p style="color:var(--texto-suave); font-size:14px;">Nenhum aluno inscrito nesta modalidade/categoria ainda.</p>' : `
      <table class="tabela-ficha-seletiva">
        <thead><tr><th>Nº</th><th>Aluno</th><th>Presença</th><th>Resultado</th><th>Colocação</th></tr></thead>
        <tbody>
          ${linhas.map((l, i) => `
            <tr>
              <td>${i + 1}</td>
              <td class="col-aluno-ficha">${l.aluno.nome}</td>
              <td>${l.p.presente ? '✔' : ''}</td>
              <td>${l.p.status && l.p.status !== 'Aguardando' ? l.p.status : ''}</td>
              <td>${l.p.colocacao || ''}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `}
    ${comObservacao.length ? `
      <div class="secao-relatorio" style="margin-top:16px;">
        <h3>Observações</h3>
        ${comObservacao.map(l => `<div class="linha-relatorio"><span>${l.aluno.nome}</span><span>${l.p.observacao}</span></div>`).join('')}
      </div>
    ` : ''}
  `;
}

function linhaConfrontoRelatorio(c){
  const alunoA = c.alunoAId ? DB.getAluno(c.alunoAId) : null;
  const alunoB = c.alunoBId ? DB.getAluno(c.alunoBId) : null;
  if(c.tipoResultado === 'bye'){
    return `<div class="confronto-relatorio"><span>⭐ ${alunoA ? alunoA.nome : '—'}</span><span>BYE — avanço automático</span></div>`;
  }
  if(!alunoA || !alunoB){
    return `<div class="confronto-relatorio"><span>${alunoA ? alunoA.nome : '<span class="lacuna-preenchimento">&nbsp;</span>'}  ×  ${alunoB ? alunoB.nome : '<span class="lacuna-preenchimento">&nbsp;</span>'}</span><span>Aguardando fase anterior</span></div>`;
  }
  if(c.status === 'Finalizado'){
    const vencedor = DB.getAluno(c.vencedorAlunoId);
    const wo = c.tipoResultado === 'wo' ? ' — W.O.' : '';
    return `<div class="confronto-relatorio"><span>${alunoA.nome}  ×  ${alunoB.nome}</span><span>Vencedor: ${vencedor ? vencedor.nome : '—'}${wo}</span></div>`;
  }
  return `<div class="confronto-relatorio"><span>${alunoA.nome} <span class="lacuna-preenchimento">&nbsp;</span> ×  <span class="lacuna-preenchimento">&nbsp;</span> ${alunoB.nome}</span><span>Resultado: <span class="lacuna-preenchimento">&nbsp;&nbsp;&nbsp;&nbsp;</span> Vencedor: <span class="lacuna-preenchimento">&nbsp;&nbsp;&nbsp;&nbsp;</span></span></div>`;
}

// Renderiza UM chaveamento (fases + confrontos + pódio) para o relatório --
// reaproveitado igualmente para Fase Principal, Repescagem e Final
// (Etapa 2B-6), que continuam sendo apenas `chaveamento`s normais.
function blocoChaveamentoRelatorio(chaveamento, tituloSecao, rotuloCampeao){
  const confrontos = DB.getConfrontos(chaveamento.id);
  const fases = [...new Set(confrontos.filter(c => !c.terceiroLugar).map(c => c.faseIndex))].sort((a, b) => a - b);
  const terceiro = confrontos.find(c => c.terceiroLugar);

  if(chaveamento.participanteUnico){
    return `
      <div class="secao-relatorio">
        ${tituloSecao ? `<div class="rotulo-secao-chaveamento">${tituloSecao}</div>` : ''}
        <p style="font-size:12.5px; color:var(--texto-suave); margin:0 0 8px;">Apenas 1 participante inscrito nesta seletiva — sem confronto a registrar.</p>
        <div class="linha-relatorio"><span class="selo-medalha-relatorio">🥇 ${rotuloCampeao || 'Campeão'} (participante único)</span><span>${DB.getAluno(chaveamento.campeaoAlunoId)?.nome || '—'}</span></div>
      </div>
    `;
  }

  return `
    ${fases.map((fi, idx) => {
      const confrontosFase = confrontos.filter(c => c.faseIndex === fi && !c.terceiroLugar).sort((a, b) => a.ordem - b.ordem);
      return `<div class="secao-relatorio">
        ${idx === 0 && tituloSecao ? `<div class="rotulo-secao-chaveamento">${tituloSecao}</div>` : ''}
        <h3>${confrontosFase[0].fase.toUpperCase()}</h3>${confrontosFase.map(linhaConfrontoRelatorio).join('')}
      </div>`;
    }).join('')}
    ${terceiro ? `<div class="secao-relatorio"><h3>DISPUTA DE 3º LUGAR</h3>${linhaConfrontoRelatorio(terceiro)}</div>` : ''}
    ${chaveamento.campeaoAlunoId ? `
      <div class="secao-relatorio">
        <div class="linha-relatorio"><span class="selo-medalha-relatorio">🥇 ${rotuloCampeao || 'Campeão'}</span><span>${DB.getAluno(chaveamento.campeaoAlunoId)?.nome || '—'}</span></div>
        ${chaveamento.viceAlunoId ? `<div class="linha-relatorio"><span class="selo-medalha-relatorio">🥈 Vice</span><span>${DB.getAluno(chaveamento.viceAlunoId)?.nome || '—'}</span></div>` : ''}
        ${chaveamento.terceiroAlunoId ? `<div class="linha-relatorio"><span class="selo-medalha-relatorio">🥉 3º lugar</span><span>${DB.getAluno(chaveamento.terceiroAlunoId)?.nome || '—'}</span></div>` : ''}
      </div>
    ` : ''}
  `;
}

function conteudoRelatorioChaveamento(chaveamento){
  const modalidade = DB.getModalidades().find(m => m.id === chaveamento.modalidadeId);
  // Etapa 2B-6: se este chaveamento fizer parte de uma família (Fase
  // Principal + Repescagem + Final -- Etapa 2B-3), a impressão mostra as
  // três; chaveamentos simples (sem repescagem/final) imprimem como
  // sempre, sem nenhuma seção extra.
  const tipoAtual = chaveamento.tipo || 'principal';
  const raizId = tipoAtual === 'principal' ? chaveamento.id : chaveamento.chaveamentoPrincipalId;
  const familia = raizId ? DB.obterFamiliaChaveamento(raizId) : { principal: chaveamento, repescagem:null, final:null };
  const principal = familia.principal || chaveamento;
  const temFamilia = !!(familia.repescagem || familia.final);

  return `
    ${cabecalhoRelatorioHtml('CHAVEAMENTO DA SELETIVA', `${modalidade ? modalidade.nome : ''} — ${nomeExibidoTurma(principal.turmaId)} — ${principal.categoria}`)}
    ${blocoChaveamentoRelatorio(principal, temFamilia ? '🏆 FASE PRINCIPAL' : null, temFamilia ? 'Campeão da Fase Principal' : 'Campeão')}
    ${familia.repescagem ? blocoChaveamentoRelatorio(familia.repescagem, '🔄 REPESCAGEM', 'Campeão da Repescagem') : ''}
    ${familia.final ? blocoChaveamentoRelatorio(familia.final, '🥇 FINAL', 'CAMPEÃO DA MODALIDADE') : ''}
    ${blocoClassificadosRelatorio(raizId, modalidade)}
  `;
}
// Classificados para o JIBA (novo): mostra só modalidade + nomes, sem

/* ---------- ALUNOS CLASSIFICADOS (Resultado Simplificado — para professoras) ----------
   Reaproveita DB.relatorioClassificadosSimplificado, que lê diretamente

   nova, nenhuma pontuação. */
function conteudoClassificadosSimplificado(resumo){
  const cfg = DB.getConfig();
  const rotuloTurmas = resumo.tipo === 'grupo'
    ? resumo.turmas.map(t => t.turma).join(' + ')
    : (resumo.turmas[0] ? resumo.turmas[0].turma : '');

  function colunaClassificados(lista){
    return lista.length
      ? `<ol class="lista-classificados">${lista.map(a => `<li>${a.nome}</li>`).join('')}</ol>`
      : '<p class="vazio-classificados">—</p>';
  }

  return `
    <div class="capa-classificados">
      <div class="marca-evento-classificados">${cfg.nomeEvento} ${cfg.ano}</div>
      <div class="titulo-classificados">ALUNOS CLASSIFICADOS</div>
      <div class="serie-classificados">${resumo.serie ? resumo.serie.nome.toUpperCase() : ''} — ${rotuloTurmas}</div>
      ${resumo.tipo === 'grupo' ? '<div class="selo-grupo-classificados">Grupo de competição</div>' : ''}
    </div>
    ${!resumo.blocos.length ? '<p style="text-align:center; color:var(--texto-suave); padding:30px 0;">Nenhum aluno classificado ainda para este contexto.</p>' : resumo.blocos.map(b => `
      <div class="bloco-modalidade-classificados">
        <div class="cabecalho-modalidade-classificados">${iconeModalidade(b.modalidade.nome)} ${b.modalidade.nome.toUpperCase()}</div>
        <div class="grade-classificados-sexo">
          <div class="coluna-classificados">
            <div class="rotulo-coluna-classificados">MASCULINO</div>
            ${colunaClassificados(b.masculino)}
          </div>
          <div class="coluna-classificados">
            <div class="rotulo-coluna-classificados">FEMININO</div>
            ${colunaClassificados(b.feminino)}
          </div>
        </div>
      </div>
    `).join('')}
  `;
}
function telaRelatorioClassificados(idTurmaOuGrupo){

/* ---------- RESULTADO DETALHADO (controle interno) ----------
   Substitui o antigo "Resultados das Seletivas", que na verdade lia o
   CHAVEAMENTO (Bloco 7) em vez da seletiva -- por isso uma seletiva

   DB.relatorioResultadoDetalhado). Agora lê a seletiva diretamente. */

  const rotuloContexto = resumo.turmas.length > 1
    ? `${resumo.agrupamento.nome} (grupo: ${resumo.turmas.map(t => t.turma).join(' + ')})`
    : (resumo.turmas[0] ? resumo.turmas[0].turma : '');
  return `
    ${cabecalhoRelatorioHtml('RESULTADO DETALHADO', `${resumo.serie ? resumo.serie.nome : ''} — ${rotuloContexto}`)}
    ${!resumo.blocos.length ? '<p style="color:var(--texto-suave); font-size:14px;">Nenhuma seletiva com participantes ainda para este contexto.</p>' : resumo.blocos.map(b => `
      <div class="secao-relatorio">
        <h3>${iconeModalidade(b.modalidade.nome)} ${b.modalidade.nome.toUpperCase()} — ${b.categoria}</h3>
        <table class="tabela-ficha-seletiva">
          <thead><tr><th>Nº</th><th>Aluno</th><th>Sexo</th><th>Turma</th><th>Presença</th><th>Posição</th><th>Situação</th></tr></thead>
          <tbody>
            ${b.linhas.map((l, i) => `
              <tr>
                <td>${i + 1}</td>
                <td class="col-aluno-ficha">${l.aluno.nome}</td>
                <td>${l.aluno.sexo}</td>
                <td>${l.turma ? l.turma.turma : '—'}</td>
                <td>${l.participacao.presente ? '✔' : ''}</td>
                <td>${l.participacao.colocacao || ''}</td>
                <td>${DB.situacaoAmigavelParticipacao(l.participacao.status)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `).join('')}
  `;
}
function telaRelatorioResultadoDetalhado(idTurmaOuGrupo){

  if(!resumo) return `<div class="tela-em-breve"><h2>Não encontrado</h2></div>`;

      </label>
    </div>
    <div class="folha-relatorio" id="conteudoResultadosJiba"></div>
  `;
}
function renderConteudoResultadosJiba(){
  const container = document.getElementById('conteudoResultadosJiba');
  if(!container) return;
  const filtroSerie = document.getElementById('filtroSerieJibaRel')?.value || '';
  const filtroModalidade = document.getElementById('filtroModalidadeJibaRel')?.value || '';
  const incluirMedalhas = document.getElementById('checkQuadroMedalhas')?.checked;

  const resultados = DB.relatorioResultadosJiba({ serieId: filtroSerie || undefined, modalidadeId: filtroModalidade || undefined });
  const porSerie = {};
  resultados.forEach(r => {
    const chave = r.serie ? r.serie.id : '—';
    porSerie[chave] = porSerie[chave] || { serie: r.serie, itens: [] };
    porSerie[chave].itens.push(r);
  });

  const blocos = Object.values(porSerie).map(grupo => `
    <div class="grupo-serie-relatorio">
      <h2>${grupo.serie ? grupo.serie.nome.toUpperCase() : ''}</h2>
      ${grupo.itens.map(r => `
        <div class="secao-relatorio">
          <h3>${iconeModalidade(r.modalidade ? r.modalidade.nome : '')} ${r.modalidade ? r.modalidade.nome.toUpperCase() : ''} (${r.finalJiba.categoria})</h3>
          <div class="linha-relatorio"><span>🥇</span><span>${r.campeao.nome} — ${nomeExibidoTurma(r.turmaCampeao)}</span></div>
          ${r.vice ? `<div class="linha-relatorio"><span>🥈</span><span>${r.vice.nome} — ${nomeExibidoTurma(r.turmaVice)}</span></div>` : ''}
          ${r.terceiro ? `<div class="linha-relatorio"><span>🥉</span><span>${r.terceiro.nome} — ${nomeExibidoTurma(r.turmaTerceiro)}</span></div>` : ''}
        </div>
      `).join('')}
    </div>
  `).join('');

  // Correção do bug relatado ("uma final já finalizada, como a de Xadrez,
  // não aparece"): além das Finais do JIBA entre turmas (acima), também
  // mostramos aqui os campeões já decididos pelo chaveamento intra-turma
  // (Fase Principal/Repescagem/Final, Etapa 2B-3) -- que é uma etapa
  // separada e, sozinha, já pode ser o resultado final quando não há
  // (ou ainda não houve) uma Final do JIBA entre turmas diferentes.
  const campeoesChaveamento = DB.relatorioCampeoesChaveamentoFinal({
    serieId: filtroSerie || undefined, modalidadeId: filtroModalidade || undefined
  });
  const porSerieChaveamento = {};
  campeoesChaveamento.forEach(r => {
    const chave = r.serie ? r.serie.id : '—';
    porSerieChaveamento[chave] = porSerieChaveamento[chave] || { serie: r.serie, itens: [] };
    porSerieChaveamento[chave].itens.push(r);
  });
  const blocosChaveamento = Object.values(porSerieChaveamento).map(grupo => `
    <div class="grupo-serie-relatorio">
      <h2>${grupo.serie ? grupo.serie.nome.toUpperCase() : ''}</h2>
      ${grupo.itens.map(r => `
        <div class="secao-relatorio">
          <h3>${iconeModalidade(r.modalidade ? r.modalidade.nome : '')} ${r.modalidade ? r.modalidade.nome.toUpperCase() : ''} (${r.chaveamento.categoria}) — ${nomeExibidoTurma(r.chaveamento.turmaId)}</h3>
          <div class="linha-relatorio"><span>🥇</span><span>${r.campeao ? r.campeao.nome : '—'}</span></div>
          ${r.vice ? `<div class="linha-relatorio"><span>🥈</span><span>${r.vice.nome}</span></div>` : ''}
        </div>
      `).join('')}
    </div>
  `).join('');

  const medalhas = incluirMedalhas ? DB.quadroDeMedalhasJiba() : [];

  container.innerHTML = `
    ${cabecalhoRelatorioHtml('RESULTADOS FINAIS DO JIBA')}
    <div class="secao-relatorio" style="border:none; padding:0;"><h2 style="font-size:15px; margin-bottom:2px;">🏆 Finais do JIBA (entre turmas)</h2></div>
    ${blocos || '<p style="color:var(--texto-suave); font-size:14px;">Nenhuma Final do JIBA finalizada ainda para os filtros selecionados.</p>'}
    <div class="secao-relatorio" style="border:none; padding:0; margin-top:18px;"><h2 style="font-size:15px; margin-bottom:2px;">🎲 Campeões por turma (chaveamento da seletiva)</h2></div>
    ${blocosChaveamento || '<p style="color:var(--texto-suave); font-size:14px;">Nenhum chaveamento finalizado ainda para os filtros selecionados.</p>'}
    ${incluirMedalhas ? `
      <div class="secao-relatorio">
        <h3>🏅 MEDALHAS POR TURMA</h3>
        <p style="font-size:11.5px; color:var(--texto-suave); margin-top:-4px;">Apenas contagem de medalhas — não gera pontuação.</p>
        ${medalhas.length ? medalhas.map(m => `
          <div class="linha-relatorio"><span>${nomeExibidoTurma(m.turma.id)}</span><span>🥇 ${m.ouro} · 🥈 ${m.prata} · 🥉 ${m.bronze}</span></div>
        `).join('') : '<p style="color:var(--texto-suave); font-size:13px;">Nenhuma medalha registrada ainda.</p>'}
      </div>
    ` : ''}
  `;
}

/* ---------- Ficha Individual do Aluno ---------- */
function telaRelatorioFichaAluno(alunoId){
  const aluno = DB.getAluno(alunoId);
  if(!aluno) return `<div class="tela-em-breve"><h2>Aluno não encontrado</h2></div>`;
  definirOrientacaoImpressao('portrait');
  const turma = DB.getTurmas().find(t => t.id === aluno.turmaId);
  const serie = turma ? DB.getSeries().find(s => s.id === turma.serieId) : null;
  const modalidadesInscritas = DB.getInscricoesDoAluno(aluno.id).map(id => DB.getModalidades().find(m => m.id === id)).filter(Boolean);
  const individuaisInscritas = modalidadesInscritas.filter(m => m.tipo === 'Individual');
  const coletivasInscritas = modalidadesInscritas.filter(m => m.tipo === 'Coletiva');

  const linhasSeletivas = individuaisInscritas.map(m => {
    const seletiva = DB.getSeletiva(m.id, aluno.serieId, aluno.sexo);
    const participacao = seletiva ? DB.getParticipacoes(seletiva.id).find(p => p.alunoId === aluno.id) : null;
    const chaveamento = DB.getChaveamentosPorContexto(aluno.turmaId, m.id, aluno.sexo)[0];
    let texto = '⚠️ Pendente';
    if(chaveamento && chaveamento.status === 'Finalizado'){
      if(chaveamento.campeaoAlunoId === aluno.id) texto = '🥇 Campeão da turma · ⭐ Representante';
      else if(chaveamento.viceAlunoId === aluno.id) texto = '🥈 Vice-campeão da turma';
      else texto = '❌ Não classificado';
    } else if(participacao && participacao.status !== 'Aguardando'){
      texto = iconeStatusSeletiva(participacao.status);
    }
    return `<div class="linha-relatorio"><span>${m.nome}</span><span>${texto}</span></div>`;
  }).join('');

  const linhasEquipes = coletivasInscritas.map(m => {
    const equipe = DB.getEquipe(aluno.turmaId, m.id);
    const participacao = equipe ? DB.getParticipacoesEquipe(equipe.id).find(p => p.alunoId === aluno.id) : null;
    const texto = !participacao || participacao.status === 'Aguardando definição' ? '⚠️ Pendente' : labelStatusEquipe(participacao.status);
    return `<div class="linha-relatorio"><span>${m.nome}</span><span>${texto}${participacao && participacao.capitao ? ' · ⭐ Capitão' : ''}</span></div>`;
  }).join('');

  const historicoJiba = DB.jibaDoAluno(aluno.id);
  const linhasJiba = historicoJiba.map(h => {
    let selo = h.finalJiba.status !== 'Finalizado' ? '⏳ Em andamento' : '❌ Não classificado';
    if(h.finalJiba.campeaoAlunoId === aluno.id) selo = '🥇 Campeão do JIBA';
    else if(h.finalJiba.viceAlunoId === aluno.id) selo = '🥈 Vice-campeão do JIBA';
    else if(h.finalJiba.terceiroAlunoId === aluno.id) selo = '🥉 3º lugar do JIBA';
    return `<div class="linha-relatorio"><span>${h.modalidade ? h.modalidade.nome : ''}</span><span>${selo}</span></div>`;
  }).join('');

  return `
    ${barraAcoesRelatorioHtml(`#/turma/${aluno.turmaId}`)}
    <div class="folha-relatorio">
      ${cabecalhoRelatorioHtml('FICHA INDIVIDUAL DO ALUNO')}
      <div class="secao-relatorio">
        <div class="linha-relatorio"><span>Aluno</span><span>${aluno.nome}</span></div>
        <div class="linha-relatorio"><span>Turma</span><span>${serie ? serie.nome : ''} ${turma ? turma.turma : ''}</span></div>
        <div class="linha-relatorio"><span>Sexo</span><span>${aluno.sexo}</span></div>
      </div>
      <div class="secao-relatorio">
        <h3>Modalidades inscritas</h3>
        <ul class="lista-simples-relatorio">${modalidadesInscritas.length ? modalidadesInscritas.map(m => `<li>${m.nome}</li>`).join('') : '<li style="color:var(--texto-suave);">Nenhuma inscrição</li>'}</ul>
      </div>
      ${linhasSeletivas ? `<div class="secao-relatorio"><h3>Seletivas</h3>${linhasSeletivas}</div>` : ''}
      ${linhasEquipes ? `<div class="secao-relatorio"><h3>Equipes</h3>${linhasEquipes}</div>` : ''}
      ${linhasJiba ? `<div class="secao-relatorio"><h3>Finais JIBA</h3>${linhasJiba}</div>` : ''}
    </div>
  `;
}

function renderPreviaImportacao(turmaId){
  const area = document.getElementById('areaPreviaImportacao');
  if(!area || !previewImportacao) return;
  const marcados = previewImportacao.filter(i => i.marcado).length;
  area.innerHTML = `
    <div class="secao-titulo">📋 Prévia da importação</div>
    <div class="bloco">
      <div class="linha-relatorio"><span>Turma</span><span>${nomeExibidoTurma(turmaId)}</span></div>
      <div class="linha-relatorio"><span>Alunos encontrados</span><span>${previewImportacao.length}</span></div>
    </div>
    <div id="listaPreviaImportacao">
      ${previewImportacao.map((item, idx) => `
        <label class="item-preview-importacao ${item.jaCadastrado ? 'ja-cadastrado' : ''}">
          <input type="checkbox" data-idx="${idx}" ${item.marcado ? 'checked' : ''}>
          <div>
            <div class="nome-preview">${item.nome}</div>
            ${item.duplicadoNaLista ? '<div class="aviso-preview">⚠️ Aparece mais de uma vez na lista</div>' : ''}
            ${item.jaCadastrado ? '<div class="aviso-preview">⚠️ Já cadastrado nesta turma</div>' : ''}
          </div>
        </label>
      `).join('')}
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:12px;">
      <button class="botao botao-primario" id="btnConfirmarImportacao" type="button">Confirmar importação (${marcados} selecionado${marcados === 1 ? '' : 's'})</button>
      <button class="botao botao-secundario" id="btnVoltarEditarImportacao" type="button">← Voltar e editar</button>
      <button class="botao-texto" id="btnCancelarImportacao" type="button" style="color:#B23A3A;">Cancelar</button>
    </div>
  `;

  document.getElementById('listaPreviaImportacao').addEventListener('change', e => {
    const chk = e.target.closest('input[type="checkbox"]');
    if(!chk) return;
    previewImportacao[Number(chk.dataset.idx)].marcado = chk.checked;
    const btn = document.getElementById('btnConfirmarImportacao');
    const total = previewImportacao.filter(i => i.marcado).length;
    btn.textContent = `Confirmar importação (${total} selecionado${total === 1 ? '' : 's'})`;
  });

  document.getElementById('btnConfirmarImportacao').addEventListener('click', async () => {
    const total = previewImportacao.filter(i => i.marcado).length;
    if(!total){
      alert('Selecione ao menos um aluno para importar.');
      return;
    }
    if(!confirm(`Confirma a importação de ${total} aluno${total === 1 ? '' : 's'} para ${nomeExibidoTurma(turmaId)}?`)) return;
    const turma = DB.getTurmas().find(t => t.id === turmaId);
    const itensParaImportar = previewImportacao;
    const btn = document.getElementById('btnConfirmarImportacao');
    let resumo = null;
    const ok = await executarComFeedback(btn, 'Importando...', async () => {
      resumo = await DB.importarAlunosEmLote(turmaId, turma.serieId, itensParaImportar);
    });
    if(!ok) return;
    previewImportacao = null;
    rerenderizarResultadoImportacao(turmaId, resumo);
  });
  document.getElementById('btnVoltarEditarImportacao').addEventListener('click', () => {
    area.innerHTML = '';
  });
  document.getElementById('btnCancelarImportacao').addEventListener('click', () => {
    previewImportacao = null;
    location.hash = `#/turma/${turmaId}`;
  });
}

function renderListaModalidades(){
  const container = document.getElementById('listaModalidades');
  if(!container) return;
  const modalidades = DB.getModalidades();
  const seriesAtivas = DB.getSeries().filter(s => s.ativo);

  container.innerHTML = modalidades.length ? modalidades.map(m => `
    <div class="linha-lista" data-id="${m.id}" style="flex-direction:column; align-items:stretch; gap:8px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <div class="info-item">
          <span class="principal">${m.nome}</span>
          <span class="secundario">${m.tipo} · ${m.categoria}</span>
        </div>
        <div class="acoes-linha">
          <span class="selo-status ${m.ativo ? 'ativo' : 'inativo'}">${m.ativo ? 'Ativa' : 'Inativa'}</span>
          <button class="botao-texto" data-acao="toggle-modalidade" data-id="${m.id}">${m.ativo ? 'Desativar' : 'Ativar'}</button>
          <button class="botao-texto" data-acao="editar-modalidade" data-id="${m.id}">Editar</button>
          <button class="botao-texto" data-acao="expandir-modalidade" data-id="${m.id}">Séries</button>
        </div>
      </div>
      <div class="painel-series" id="series-modalidade-${m.id}" style="display:none; padding:10px; background:var(--fundo); border-radius:var(--raio); border:1px solid var(--borda);">
        ${seriesAtivas.length ? seriesAtivas.map(s => `
          <label style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13.5px;">
            <input type="checkbox" data-acao="serie-modalidade" data-modalidade-id="${m.id}" data-serie-id="${s.id}" ${m.seriesIds.includes(s.id) ? 'checked' : ''}>
            ${s.nome}
          </label>
        `).join('') : '<span style="font-size:13px; color:var(--texto-suave);">Nenhuma série ativa cadastrada.</span>'}
      </div>
    </div>
  `).join('') : '<p style="color:var(--texto-suave); font-size:14px;">Nenhuma modalidade cadastrada.</p>';
}

function ligarEventosConfig(){
  document.getElementById('formEvento').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const ok = await executarComFeedback(btn, 'Salvando...', () => DB.salvarConfig({
      nomeEvento: document.getElementById('nomeEvento').value.trim(),
      ano: parseInt(document.getElementById('ano').value, 10),
      nomeCompleto: document.getElementById('nomeCompleto').value.trim()
    }));
    if(!ok) return;
    atualizarSeloAno();
    mostrarToast('Dados do evento salvos.');
  });

  document.getElementById('formNovaSerie').addEventListener('submit', async e => {
    e.preventDefault();
    const input = document.getElementById('novaSerieNome');
    if(!input.value.trim()) return;
    const btn = e.target.querySelector('button[type="submit"]');
    const ok = await executarComFeedback(btn, 'Salvando...', () => DB.addSerie(input.value.trim()));
    if(!ok) return;
    input.value = '';
    renderListaSeries();
    renderListaTurmas();
    mostrarToast('Série adicionada.');
  });

  document.getElementById('listaSeries').addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const id = btn.dataset.id;
    if(btn.dataset.acao === 'toggle-serie'){
      const serie = DB.getSeries().find(s => s.id === id);
      const ok = await executarComFeedback(btn, '...', () => DB.atualizarSerie(id, { ativo: !serie.ativo }));
      if(!ok) return;
      renderListaSeries();
      renderListaTurmas();
      renderListaModalidades();
    }
    if(btn.dataset.acao === 'editar-serie'){
      const serie = DB.getSeries().find(s => s.id === id);
      const novoNome = prompt('Novo nome da série:', serie.nome);
      if(novoNome && novoNome.trim()){
        const ok = await executarComFeedback(btn, '...', () => DB.atualizarSerie(id, { nome: novoNome.trim() }));
        if(!ok) return;
        renderListaSeries();
        renderListaTurmas();
        renderListaModalidades();
      }
    }
  });

  document.getElementById('formNovaTurma').addEventListener('submit', async e => {
    e.preventDefault();
    const serieId = document.getElementById('turmaSerie').value;
    const turma = document.getElementById('turmaLetra').value.trim().toUpperCase();
    const turno = document.getElementById('turmaTurno').value;
    if(!serieId || !turma) return;
    const btn = e.target.querySelector('button[type="submit"]');
    const ok = await executarComFeedback(btn, 'Salvando...', () => DB.addTurma({ serieId, turma, turno }));
    if(!ok) return;
    document.getElementById('turmaLetra').value = '';
    renderListaTurmas();
    mostrarToast('Turma adicionada.');
  });

  document.getElementById('listaTurmas').addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if(!btn || btn.dataset.acao !== 'toggle-turma') return;
    const turma = DB.getTurmas().find(t => t.id === btn.dataset.id);
    const ok = await executarComFeedback(btn, '...', () => DB.atualizarTurma(btn.dataset.id, { ativo: !turma.ativo }));
    if(!ok) return;
    renderListaTurmas();
  });

  /* ---------- Turnos ---------- */
  document.getElementById('formNovoTurno').addEventListener('submit', async e => {
    e.preventDefault();
    const input = document.getElementById('novoTurnoNome');
    if(!input.value.trim()) return;
    const btn = e.target.querySelector('button[type="submit"]');
    const ok = await executarComFeedback(btn, 'Salvando...', () => DB.addTurno(input.value.trim()));
    if(!ok) return;
    input.value = '';
    renderListaTurnos();
    mostrarToast('Turno adicionado.');
  });

  document.getElementById('listaTurnos').addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const id = btn.dataset.id;
    if(btn.dataset.acao === 'toggle-turno'){
      const turno = DB.getTurnos().find(t => t.id === id);
      const ok = await executarComFeedback(btn, '...', () => DB.atualizarTurno(id, { ativo: !turno.ativo }));
      if(!ok) return;
      renderListaTurnos();
    }
    if(btn.dataset.acao === 'editar-turno'){
      const turno = DB.getTurnos().find(t => t.id === id);
      const novoNome = prompt('Novo nome do turno:', turno.nome);
      if(novoNome && novoNome.trim()){
        const ok = await executarComFeedback(btn, '...', () => DB.atualizarTurno(id, { nome: novoNome.trim() }));
        if(!ok) return;
        renderListaTurnos();
      }
    }
  });

  /* ---------- Categorias ---------- */
  document.getElementById('formNovaCategoria').addEventListener('submit', async e => {
    e.preventDefault();
    const input = document.getElementById('novaCategoriaNome');
    if(!input.value.trim()) return;
    const btn = e.target.querySelector('button[type="submit"]');
    const ok = await executarComFeedback(btn, 'Salvando...', () => DB.addCategoria(input.value.trim()));
    if(!ok) return;
    input.value = '';
    renderListaCategorias();
    mostrarToast('Categoria adicionada.');
  });

  document.getElementById('listaCategorias').addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const id = btn.dataset.id;
    if(btn.dataset.acao === 'toggle-categoria'){
      const categoria = DB.getCategorias().find(c => c.id === id);
      const ok = await executarComFeedback(btn, '...', () => DB.atualizarCategoria(id, { ativo: !categoria.ativo }));
      if(!ok) return;
      renderListaCategorias();
    }
    if(btn.dataset.acao === 'editar-categoria'){
      const categoria = DB.getCategorias().find(c => c.id === id);
      const novoNome = prompt('Novo nome da categoria:', categoria.nome);
      if(novoNome && novoNome.trim()){
        const ok = await executarComFeedback(btn, '...', () => DB.atualizarCategoria(id, { nome: novoNome.trim() }));
        if(!ok) return;
        renderListaCategorias();
      }
    }
  });

  /* ---------- Modalidades ---------- */
  document.getElementById('formNovaModalidade').addEventListener('submit', async e => {
    e.preventDefault();
    const nome = document.getElementById('modalidadeNome').value.trim();
    const tipo = document.getElementById('modalidadeTipo').value;
    const categoria = document.getElementById('modalidadeCategoria').value;
    if(!nome) return;
    const btn = e.target.querySelector('button[type="submit"]');
    const ok = await executarComFeedback(btn, 'Salvando...', () => DB.addModalidade({ nome, tipo, categoria }));
    if(!ok) return;
    document.getElementById('modalidadeNome').value = '';
    renderListaModalidades();
    mostrarToast('Modalidade adicionada.');
  });

  document.getElementById('listaModalidades').addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const id = btn.dataset.id;
    if(btn.dataset.acao === 'toggle-modalidade'){
      const modalidade = DB.getModalidades().find(m => m.id === id);
      const ok = await executarComFeedback(btn, '...', () => DB.atualizarModalidade(id, { ativo: !modalidade.ativo }));
      if(!ok) return;
      renderListaModalidades();
    }
    if(btn.dataset.acao === 'editar-modalidade'){
      const modalidade = DB.getModalidades().find(m => m.id === id);
      const novoNome = prompt('Nome da modalidade:', modalidade.nome);
      if(!novoNome || !novoNome.trim()) return;
      let novoTipo = prompt('Tipo (Individual ou Coletiva):', modalidade.tipo);
      if(!['Individual','Coletiva'].includes(novoTipo)) novoTipo = modalidade.tipo;
      let novaCategoria = prompt('Categoria (Masculino, Feminino, Misto ou Todas):', modalidade.categoria);
      if(!['Masculino','Feminino','Misto','Todas'].includes(novaCategoria)) novaCategoria = modalidade.categoria;
      const ok = await executarComFeedback(btn, '...', () => DB.atualizarModalidade(id, { nome: novoNome.trim(), tipo: novoTipo, categoria: novaCategoria }));
      if(!ok) return;
      renderListaModalidades();
    }
    if(btn.dataset.acao === 'expandir-modalidade'){
      const painel = document.getElementById(`series-modalidade-${id}`);
      if(painel) painel.style.display = painel.style.display === 'none' ? 'block' : 'none';
    }
  });

  document.getElementById('listaModalidades').addEventListener('change', async e => {
    const chk = e.target;
    if(chk.dataset.acao !== 'serie-modalidade') return;
    chk.disabled = true;
    try {
      await DB.alternarSerieNaModalidade(chk.dataset.modalidadeId, chk.dataset.serieId);
    } catch(err){
      console.error('Erro ao vincular série à modalidade:', err);
      alert('Não foi possível salvar. Verifique sua conexão e tente novamente.');
      chk.checked = !chk.checked; // desfaz visualmente, já que a gravação falhou
    } finally {
      chk.disabled = false;
    }
  });
}
